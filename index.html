<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>The Executive Events — Costing Ledger</title>
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',sans-serif; background:#FAF6EE; color:#211D17; }
  .beo-serif { font-family:'Cormorant Garamond', serif; }
  .beo-btn { display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer; border-radius:6px; font-family:inherit; font-weight:600; transition:all .15s ease; }
  .beo-btn:active { transform:scale(0.97); }
  .beo-btn-primary { background:#6B1E23; color:#FAF6EE; padding:9px 16px; font-size:14px; }
  .beo-btn-primary:hover { background:#5a191d; }
  .beo-btn-gold { background:#B8934A; color:#211D17; padding:9px 16px; font-size:14px; }
  .beo-btn-gold:hover { background:#a68140; }
  .beo-btn-ghost { background:transparent; color:#6B1E23; padding:6px 10px; font-size:13px; border:1px solid #E4DCC8; }
  .beo-btn-ghost:hover { background:#F1EADA; }
  .beo-tab-btn:hover { background:#FAF3E3 !important; color:#6B1E23 !important; }
  .beo-nav-scroll { scrollbar-width: thin; scrollbar-color: #E4DCC8 transparent; }
  .beo-nav-scroll::-webkit-scrollbar { height: 5px; }
  .beo-nav-scroll::-webkit-scrollbar-thumb { background: #E4DCC8; border-radius: 4px; }
  .beo-input { border:1px solid #E4DCC8; background:#fff; border-radius:6px; padding:8px 10px; font-family:inherit; font-size:14px; color:#211D17; width:100%; }
  .beo-input:focus { outline:2px solid #B8934A; outline-offset:1px; }
  .beo-card { background:#fff; border:1px solid #EDE6D6; border-radius:10px; }
  .two-col { display:grid; grid-template-columns:260px 1fr; gap:20px; }
  .builder-col { display:grid; grid-template-columns:1fr 380px; gap:20px; }
  @media (max-width:800px) {
    .two-col, .builder-col { grid-template-columns: 1fr !important; }
  }
  #print-area { display:none; }
  @media print {
    body * { visibility:hidden; }
    #print-area, #print-area * { visibility:visible; }
    #print-area { display:block !important; position:absolute; top:0; left:0; width:100%; padding:30px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="print-area"></div>

<script>
  // Draws the PDF directly (text/shapes) instead of screenshotting the page.
  // config: { companyName, title, client, date, sections:[{title,color:[r,g,b],subsections:[{title,items:[{name,qty}]}]}],
  //           totalRows:[{label,value}], grandTotalLabel, grandTotal, filename }
  window.generatePdf = function (config) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 16;
    let y = 24;

    const CREAM = [253, 251, 243];
    const primary = config.themePrimary || [107, 30, 35];
    const accent = config.themeAccent || [184, 147, 74];

    const paintPage = () => {
      doc.setFillColor(CREAM[0], CREAM[1], CREAM[2]);
      doc.rect(0, 0, pageWidth, pageHeight, "F");
      // Decorative corner brackets, top-left and bottom-right
      doc.setDrawColor(accent[0], accent[1], accent[2]);
      doc.setLineWidth(0.5);
      const bl = 8;
      doc.line(8, 8, 8 + bl, 8); doc.line(8, 8, 8, 8 + bl);
      doc.line(pageWidth - 8, pageHeight - 8, pageWidth - 8 - bl, pageHeight - 8);
      doc.line(pageWidth - 8, pageHeight - 8, pageWidth - 8, pageHeight - 8 - bl);
    };
    paintPage();

    const checkPageBreak = (needed) => {
      if (y + needed > pageHeight - 20) { doc.addPage(); paintPage(); y = 24; }
    };
    const wrapText = (text, maxWidth, fontSize) => {
      doc.setFontSize(fontSize);
      return doc.splitTextToSize(String(text), maxWidth);
    };
    const dividerRow = () => {
      doc.setDrawColor(accent[0], accent[1], accent[2]);
      doc.setLineWidth(0.4);
      const w = 22;
      doc.line(pageWidth / 2 - w - 6, y - 1.5, pageWidth / 2 - 6, y - 1.5);
      doc.line(pageWidth / 2 + 6, y - 1.5, pageWidth / 2 + w + 6, y - 1.5);
      doc.setFont("times", "normal");
      doc.setFontSize(9);
      doc.setTextColor(accent[0], accent[1], accent[2]);
      doc.text("•", pageWidth / 2, y, { align: "center" });
      y += 6;
    };

    if (config.companyName) {
      doc.setFont("times", "italic");
      doc.setFontSize(11);
      doc.setTextColor(accent[0], accent[1], accent[2]);
      doc.text(config.companyName.toUpperCase(), pageWidth / 2, y, { align: "center" });
      y += 9;
    }
    doc.setFont("times", "bold");
    doc.setFontSize(25);
    doc.setTextColor(primary[0], primary[1], primary[2]);
    doc.text(config.title || "Event Quotation", pageWidth / 2, y, { align: "center" });
    y += 8;
    dividerRow();

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10.5);
    doc.setTextColor(70, 65, 60);
    if (config.client) { doc.text(`Client: ${config.client}`, pageWidth / 2, y, { align: "center" }); y += 5.5; }
    if (config.date) { doc.text(`Date: ${config.date}`, pageWidth / 2, y, { align: "center" }); y += 5.5; }
    y += 6;

    (config.sections || []).forEach(section => {
      checkPageBreak(15);
      const [r, g, b] = section.color || [107, 30, 35];
      doc.setFillColor(r, g, b);
      doc.roundedRect(margin, y, pageWidth - margin * 2, 10, 1.8, 1.8, "F");
      doc.setDrawColor(accent[0], accent[1], accent[2]);
      doc.setLineWidth(0.3);
      doc.roundedRect(margin, y, pageWidth - margin * 2, 10, 1.8, 1.8, "S");
      doc.setTextColor(255, 255, 255);
      doc.setFont("times", "bold");
      doc.setFontSize(13);
      doc.text(section.title, margin + 5, y + 6.8);
      y += 15;

      (section.subsections || []).forEach(sub => {
        checkPageBreak(11);
        if (sub.title) {
          doc.setFont("times", "bold");
          doc.setFontSize(11.5);
          doc.setTextColor(r, g, b);
          doc.text(sub.title, margin + 2, y);
          y += 6;
        }
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        if (!sub.items || sub.items.length === 0) {
          doc.setTextColor(150, 145, 135);
          doc.text("No items added", margin + 4, y);
          y += 5.5;
        } else {
          const stripeColor = [
            Math.round(CREAM[0] * 0.94 + accent[0] * 0.06),
            Math.round(CREAM[1] * 0.94 + accent[1] * 0.06),
            Math.round(CREAM[2] * 0.94 + accent[2] * 0.06)
          ];
          sub.items.forEach((item, idx) => {
            const lines = wrapText(item.name, pageWidth - margin * 2 - 28, 9.5);
            const rowHeight = 5.4 * lines.length;
            checkPageBreak(rowHeight + 1);
            if (idx % 2 === 0) {
              doc.setFillColor(stripeColor[0], stripeColor[1], stripeColor[2]);
              doc.rect(margin, y - 4, pageWidth - margin * 2, rowHeight, "F");
            }
            doc.setTextColor(45, 40, 35);
            doc.text(lines, margin + 4, y);
            doc.text(String(item.qty), pageWidth - margin - 4, y, { align: "right" });
            y += rowHeight;
            doc.setDrawColor(accent[0], accent[1], accent[2]);
            doc.setLineWidth(0.15);
            doc.line(margin, y - 2, pageWidth - margin, y - 2);
          });
        }
        y += 4;
      });
    });

    if (config.totalRows && config.totalRows.length) {
      checkPageBreak(8 * config.totalRows.length + 8);
      y += 2;
      doc.setDrawColor(accent[0], accent[1], accent[2]);
      doc.setLineWidth(0.3);
      doc.line(margin, y, pageWidth - margin, y);
      y += 7;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      config.totalRows.forEach(row => {
        doc.setTextColor(row.color ? row.color[0] : 70, row.color ? row.color[1] : 65, row.color ? row.color[2] : 60);
        doc.text(row.label, margin, y);
        doc.text(row.value, pageWidth - margin, y, { align: "right" });
        y += 6;
      });
      y += 2;
    }

    if (config.grandTotalLabel) {
      checkPageBreak(24);
      doc.setFillColor(primary[0], primary[1], primary[2]);
      doc.roundedRect(margin, y, pageWidth - margin * 2, 18, 2.5, 2.5, "F");
      doc.setDrawColor(accent[0], accent[1], accent[2]);
      doc.setLineWidth(0.4);
      doc.roundedRect(margin, y, pageWidth - margin * 2, 18, 2.5, 2.5, "S");
      doc.setTextColor(accent[0] + 60 > 255 ? 255 : accent[0] + 60, accent[1] + 60 > 255 ? 255 : accent[1] + 60, accent[2] + 40 > 255 ? 255 : accent[2] + 40);
      doc.setFont("times", "italic");
      doc.setFontSize(10.5);
      doc.text(config.grandTotalLabel, margin + 6, y + 7);
      doc.setTextColor(255, 255, 255);
      doc.setFont("times", "bold");
      doc.setFontSize(19);
      doc.text(config.grandTotal || "", pageWidth - margin - 6, y + 13, { align: "right" });
      y += 24;
      checkPageBreak(14);
      doc.setFont("times", "italic");
      doc.setFontSize(9.5);
      doc.setTextColor(accent[0], accent[1], accent[2]);
      doc.text("Thank you for the opportunity to be part of your celebration", pageWidth / 2, y, { align: "center" });
    }

    // Footer: page numbers on every page
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.5);
      doc.setTextColor(150, 145, 135);
      doc.text(`Page ${i} of ${totalPages}`, pageWidth / 2, pageHeight - 10, { align: "center" });
    }

    doc.save((config.filename || "quotation") + ".pdf");
  };

  window.generateProposalPdf = async function (proposal, companySettings, linkedBudget, linkedBudgetFin) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 18;
    const CREAM = [253, 251, 243];
    const PRIMARY = [107, 30, 35];
    const ACCENT = [184, 147, 74];
    const cs = companySettings || {};
    const inr = (n) => "Rs. " + (Number(n) || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
    let pageNum = 1;
    const loadErrors = [];

    const loadImageDataUrl = async (url, label) => {
      if (!url) return null;
      try {
        const res = await fetch(url);
        if (!res.ok) { loadErrors.push(`${label}: server returned ${res.status}`); return null; }
        const blob = await res.blob();
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = () => { loadErrors.push(`${label}: could not read file`); resolve(null); };
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        loadErrors.push(`${label}: ${e.message}`);
        return null;
      }
    };
    const imgFormat = (dataUrl) => (dataUrl && dataUrl.indexOf("data:image/png") === 0) ? "PNG" : "JPEG";
    const safeAddImage = (dataUrl, x, y2, w, h) => {
      if (!dataUrl) return false;
      try { doc.addImage(dataUrl, imgFormat(dataUrl), x, y2, w, h, undefined, "FAST"); return true; }
      catch (e) { loadErrors.push("Could not place image: " + e.message); return false; }
    };

    const paintPage = () => {
      doc.setFillColor(CREAM[0], CREAM[1], CREAM[2]);
      doc.rect(0, 0, pageWidth, pageHeight, "F");
      doc.setDrawColor(ACCENT[0], ACCENT[1], ACCENT[2]);
      doc.setLineWidth(0.5);
      const bl = 8;
      doc.line(8, 8, 8 + bl, 8); doc.line(8, 8, 8, 8 + bl);
      doc.line(pageWidth - 8, pageHeight - 8, pageWidth - 8 - bl, pageHeight - 8);
      doc.line(pageWidth - 8, pageHeight - 8, pageWidth - 8, pageHeight - 8 - bl);
    };
    const footer = () => {
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
      doc.setTextColor(150, 145, 135);
      doc.text(`Page ${pageNum}`, pageWidth / 2, pageHeight - 10, { align: "center" });
    };
    const newPage = () => { footer(); doc.addPage(); pageNum++; paintPage(); y = margin + 6; };
    let y = margin + 6;
    const checkPageBreak = (needed) => { if (y + needed > pageHeight - 18) newPage(); };

    const sectionTitle = (text) => {
      checkPageBreak(18);
      doc.setFont("times", "bold"); doc.setFontSize(15);
      doc.setTextColor(PRIMARY[0], PRIMARY[1], PRIMARY[2]);
      doc.text(text.toUpperCase(), pageWidth / 2, y, { align: "center" });
      y += 5;
      doc.setDrawColor(ACCENT[0], ACCENT[1], ACCENT[2]);
      doc.setLineWidth(0.3);
      doc.line(pageWidth / 2 - 26, y, pageWidth / 2 + 26, y);
      y += 9;
    };

    const logoDataUrl = await loadImageDataUrl(cs.logoUrl, "Company logo");

    // ===== PAGE 1: Logo, Company, Client Details, Legacy =====
    paintPage();
    y = 22;
    if (logoDataUrl && safeAddImage(logoDataUrl, pageWidth / 2 - 15, y, 30, 30)) y += 36;
    doc.setFont("times", "bold"); doc.setFontSize(20);
    doc.setTextColor(PRIMARY[0], PRIMARY[1], PRIMARY[2]);
    doc.text(cs.companyName || "Your Company", pageWidth / 2, y, { align: "center" });
    y += 7;
    if (cs.tagline) {
      doc.setFont("times", "italic"); doc.setFontSize(11);
      doc.setTextColor(ACCENT[0], ACCENT[1], ACCENT[2]);
      doc.text(cs.tagline, pageWidth / 2, y, { align: "center" });
      y += 9;
    }
    doc.setDrawColor(ACCENT[0], ACCENT[1], ACCENT[2]);
    doc.setLineWidth(0.4);
    doc.line(pageWidth / 2 - 30, y, pageWidth / 2 + 30, y);
    y += 10;
    doc.setFont("times", "bold"); doc.setFontSize(13);
    doc.setTextColor(40, 38, 33);
    doc.text((proposal.title || "Exclusive Wedding Proposal").toUpperCase(), pageWidth / 2, y, { align: "center" });
    y += 12;

    const details = [
      ["Bride", proposal.brideNam || "—", "Groom", proposal.groomName || "—"],
      ["Wedding Date", proposal.weddingDate || "—", "Venue", proposal.venueName || "—"],
      ["Proposal Date", proposal.proposalDate || "—", "Contact", proposal.clientContact || "—"]
    ];
    const boxH = 10 * details.length + 6;
    doc.setFillColor(250, 235, 225);
    doc.roundedRect(margin, y, pageWidth - margin * 2, boxH, 2, 2, "F");
    let rowY = y + 8;
    const colX1 = margin + 8, colX2 = pageWidth / 2 + 6;
    details.forEach(([l1, v1, l2, v2]) => {
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
      doc.setTextColor(150, 120, 80);
      doc.text(l1.toUpperCase(), colX1, rowY);
      doc.text(l2.toUpperCase(), colX2, rowY);
      doc.setFont("times", "italic"); doc.setFontSize(11);
      doc.setTextColor(50, 45, 40);
      doc.text(v1, colX1, rowY + 5.5);
      doc.text(v2, colX2, rowY + 5.5);
      rowY += 10;
    });
    y += boxH + 12;

    sectionTitle("Our Legacy & Philosophy");
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    doc.setTextColor(55, 50, 45);
    const legacyLines = doc.splitTextToSize(
      proposal.legacyText || cs.legacyText || "We are deeply honoured that you have chosen us to be part of your most sacred journey. This proposal has been crafted not merely as a document, but as a promise that every detail of your celebration shall reflect timeless grace, woven together with the refinement of a truly elevated experience.",
      pageWidth - margin * 2
    );
    legacyLines.forEach(line => { checkPageBreak(5.5); doc.text(line, margin, y); y += 5; });
    y += 4;
    if ((proposal.legacyHighlights || []).length > 0) {
      proposal.legacyHighlights.forEach(h => {
        checkPageBreak(6);
        doc.setFont("times", "bold"); doc.setFontSize(10);
        doc.setTextColor(ACCENT[0], ACCENT[1], ACCENT[2]);
        doc.text("•", margin, y);
        doc.setFont("helvetica", "normal"); doc.setFontSize(10);
        doc.setTextColor(55, 50, 45);
        doc.text(h, margin + 5, y);
        y += 6;
      });
    }

    // ===== PAGE 2+: BUDGET & QUOTATION (table, repeats header across pages) =====
    if (linkedBudget) {
      newPage();
      y = margin + 6;
      sectionTitle("Budget & Quotation");

      const drawTableHeader = () => {
        checkPageBreak(12);
        doc.setFillColor(PRIMARY[0], PRIMARY[1], PRIMARY[2]);
        doc.rect(margin, y, pageWidth - margin * 2, 9, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFont("times", "bold"); doc.setFontSize(10.5);
        doc.text("ITEM / SERVICE", margin + 4, y + 6.2);
        doc.text("QTY", pageWidth - margin - 4, y + 6.2, { align: "right" });
        y += 9;
      };
      const checkPageBreakTable = (needed) => {
        if (y + needed > pageHeight - 18) { newPage(); drawTableHeader(); }
      };
      drawTableHeader();

      let rowIdx = 0;
      (linkedBudget.days || []).forEach(d => {
        checkPageBreakTable(10);
        doc.setFillColor(240, 225, 200);
        doc.rect(margin, y, pageWidth - margin * 2, 8, "F");
        doc.setFont("times", "bold"); doc.setFontSize(10);
        doc.setTextColor(PRIMARY[0], PRIMARY[1], PRIMARY[2]);
        doc.text(`${d.label}${d.date ? " — " + d.date : ""}`, margin + 4, y + 5.6);
        y += 8;
        (d.events || []).forEach(ev => {
          checkPageBreakTable(8);
          doc.setFont("times", "italic"); doc.setFontSize(9.5);
          doc.setTextColor(ACCENT[0], ACCENT[1], ACCENT[2]);
          doc.text(`${ev.name}${ev.time ? " — " + ev.time : ""}`, margin + 4, y + 5);
          y += 7;
          (ev.lines || []).forEach(l => {
            const lines = doc.splitTextToSize(l.name, pageWidth - margin * 2 - 30);
            const rowH = 6 * lines.length;
            checkPageBreakTable(rowH);
            if (rowIdx % 2 === 0) {
              doc.setFillColor(247, 242, 230);
              doc.rect(margin, y, pageWidth - margin * 2, rowH, "F");
            }
            doc.setFont("helvetica", "normal"); doc.setFontSize(9);
            doc.setTextColor(45, 40, 35);
            doc.text(lines, margin + 6, y + 4.2);
            doc.text(String(l.qty), pageWidth - margin - 4, y + 4.2, { align: "right" });
            y += rowH;
            rowIdx++;
          });
        });
      });

      checkPageBreak(16);
      y += 3;
      doc.setFillColor(PRIMARY[0], PRIMARY[1], PRIMARY[2]);
      doc.roundedRect(margin, y, pageWidth - margin * 2, 14, 2, 2, "F");
      doc.setTextColor(255, 255, 255);
      doc.setFont("times", "bold"); doc.setFontSize(11);
      doc.text("Total Package", margin + 6, y + 5.5);
      doc.setFontSize(15);
      doc.text(linkedBudgetFin && isFinite(linkedBudgetFin.finalBudget) ? inr(linkedBudgetFin.finalBudget) : "—", pageWidth - margin - 6, y + 10, { align: "right" });
      y += 20;
    }

    // ===== FINAL PAGE: PAYMENT SCHEDULE + THANK YOU + CONTACT =====
    newPage();
    y = margin + 6;
    if ((proposal.paymentSchedule || []).length > 0) {
      sectionTitle("Payment Schedule");
      checkPageBreak(10);
      doc.setFillColor(PRIMARY[0], PRIMARY[1], PRIMARY[2]);
      doc.rect(margin, y, pageWidth - margin * 2, 9, "F");
      doc.setTextColor(255, 255, 255);
      doc.setFont("times", "bold"); doc.setFontSize(10);
      doc.text("MILESTONE", margin + 4, y + 6.2);
      doc.text("%", pageWidth - margin - 40, y + 6.2, { align: "right" });
      doc.text("AMOUNT", pageWidth - margin - 4, y + 6.2, { align: "right" });
      y += 9;
      const total = linkedBudgetFin && isFinite(linkedBudgetFin.finalBudget) ? linkedBudgetFin.finalBudget : 0;
      proposal.paymentSchedule.forEach((p, i) => {
        checkPageBreak(8);
        if (i % 2 === 0) { doc.setFillColor(247, 242, 230); doc.rect(margin, y, pageWidth - margin * 2, 8, "F"); }
        doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
        doc.setTextColor(45, 40, 35);
        doc.text(p.label || "", margin + 4, y + 5.5);
        doc.text(`${p.percent}%`, pageWidth - margin - 40, y + 5.5, { align: "right" });
        doc.text(total ? inr(total * (p.percent / 100)) : "—", pageWidth - margin - 4, y + 5.5, { align: "right" });
        y += 8;
      });
      y += 10;
    }

    checkPageBreak(50);
    doc.setDrawColor(ACCENT[0], ACCENT[1], ACCENT[2]);
    doc.setLineWidth(0.4);
    doc.line(pageWidth / 2 - 30, y, pageWidth / 2 + 30, y);
    y += 10;
    doc.setFont("times", "bold"); doc.setFontSize(11);
    doc.setTextColor(PRIMARY[0], PRIMARY[1], PRIMARY[2]);
    doc.text("We thank you for the opportunity to be part of your celebration.", pageWidth / 2, y, { align: "center" });
    y += 14;
    if (logoDataUrl) { safeAddImage(logoDataUrl, pageWidth / 2 - 9, y, 18, 18); y += 24; }
    doc.setFont("times", "bold"); doc.setFontSize(13);
    doc.setTextColor(PRIMARY[0], PRIMARY[1], PRIMARY[2]);
    doc.text(cs.companyName || "", pageWidth / 2, y, { align: "center" });
    y += 7;
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
    doc.setTextColor(90, 85, 80);
    if (cs.address) { doc.text(cs.address, pageWidth / 2, y, { align: "center" }); y += 5.5; }
    const contactLine = [cs.website, cs.phone].filter(Boolean).join("   ·   ");
    if (contactLine) { doc.text(contactLine, pageWidth / 2, y, { align: "center" }); y += 5.5; }

    footer();
    doc.save(`${(proposal.title || "proposal").replace(/[^a-z0-9]/gi, "_")}.pdf`);
    return { loadErrors };
  };
</script>

const computeBudgetFinancials = (b) => {
  const itemsCost = (b.lines || []).reduce((s, l) => s + l.cost * l.qty, 0) +
    (b.days || []).reduce((s, d) => s + d.events.reduce((s2, e) => s2 + e.lines.reduce((s3, l) => s3 + l.cost * l.qty, 0), 0), 0);
  const expensesTotal = (b.otherExpenses || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const baseCost = itemsCost + expensesTotal;
  const profit = Number(b.profit) || 0;

  const individualPct = Number(b.individualCommissionPercent) || 0;
  const totalPct = hotelPct + individualPct;
  const mode = b.commissionMode || "final";
  let finalBudget, commissionAmount;
  if (mode === "final") {
    finalBudget = totalPct >= 100 ? Infinity : (baseCost + profit) / (1 - totalPct / 100);
    commissionAmount = totalPct >= 100 ? 0 : finalBudget * (totalPct / 100);
  } else {
    commissionAmount = baseCost * (hotelPct / 100) + baseCost * (individualPct / 100);
    finalBudget = baseCost + profit + commissionAmount;
  }
  const discountAmount = Number(b.discountAmount) || 0;
  const afterDiscount = isFinite(finalBudget) ? Math.max(0, finalBudget - discountAmount) : finalBudget;
  const gstAmount = isFinite(afterDiscount) ? afterDiscount * ((Number(b.gstPercent) || 0) / 100) : 0;
  const grandTotal = isFinite(afterDiscount) ? afterDiscount + gstAmount : afterDiscount;
  const totalReceived = (b.advancePayments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
  return { baseCost, finalBudget: isFinite(grandTotal) ? grandTotal : finalBudget, totalReceived, profit, commissionAmount: isFinite(commissionAmount) ? commissionAmount : 0, gstAmount: isFinite(gstAmount) ? gstAmount : 0, expensesTotal };

function PublicMenuView({ menuId }) {
  const [data, setData] = useState(undefined);
  const [selections, setSelections] = useState({});

  const [suggestions, setSuggestions] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  useEffect(() => {
    db.collection("publicMenus").doc(menuId).get()
      .then(snap => setData(snap.exists ? snap.data() : null))
      .catch(() => setData(null));
  }, [menuId]);

  if (data === undefined) return <div style={{ padding: 40, textAlign: "center", color: "#6b1e23" }}>Loading menu…</div>;
  if (data === null) return <div style={{ padding: 40, textAlign: "center", color: "#a39a89" }}>This menu link is invalid or no longer available.</div>;

  const toggleItem = (section, itemName) => {
    setSelections(prev => {
      const current = prev[section.id] || [];
      const isSelected = current.includes(itemName);
      if (isSelected) return { ...prev, [section.id]: current.filter(n => n !== itemName) };
      if (section.selectLimit && current.length >= section.selectLimit) return prev;
      return { ...prev, [section.id]: [...current, itemName] };
    });
  };

  const handleSubmit = async () => {
    if (!clientName.trim()) { setErrorMsg("Please enter your name before submitting."); return; }
    setErrorMsg("");
    setSubmitting(true);
    try {
      const namedSelections = {};
      (data.sections || []).forEach(s => {
        namedSelections[s.name] = selections[s.id] || [];
      });
      await db.collection("menuResponses").add({
        templateShareId: menuId,
        clientName: clientName.trim(),
        selections: namedSelections,
        suggestions: suggestions.trim(),
        submittedAt: Date.now()
      });
      setSubmitted(true);
    } catch (e) {
      setErrorMsg("Could not submit — please check your connection and try again.");
    }
    setSubmitting(false);
  };

  if (submitted) {
    return (
      <div style={{ maxWidth: 600, margin: "0 auto", padding: "60px 24px", textAlign: "center" }}>
        <div className="beo-serif" style={{ fontSize: 26, fontWeight: 700, color: "#6B1E23", marginBottom: 12 }}>Thank you!</div>
        <div style={{ fontSize: 14, color: "#333" }}>Your menu selection has been submitted successfully. Our team will be in touch shortly.</div>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 700, margin: "0 auto", padding: "36px 20px 100px" }}>
      <div className="beo-serif" style={{ fontSize: 26, fontWeight: 700, color: "#6B1E23", textAlign: "center", marginBottom: 4 }}>{data.name}</div>
      <div style={{ fontSize: 12.5, color: "#8a8071", textAlign: "center", marginBottom: 24 }}>Select your items below, then submit — you can pick up to the limit shown for each section.</div>

      <div className="beo-card" style={{ padding: 16, marginBottom: 20 }}>
        <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Your Name</label>
        <input className="beo-input" value={clientName} onChange={e => setClientName(e.target.value)} style={{ marginTop: 4 }} />
      </div>

      {(data.sections || []).map(s => {
        const current = selections[s.id] || [];
        return (
          <div key={s.id} className="beo-card" style={{ padding: 18, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div className="beo-serif" style={{ fontSize: 16, fontWeight: 700, color: "#6B1E23" }}>{s.name}</div>
              <div style={{ fontSize: 11.5, color: current.length >= s.selectLimit ? "#2E7D32" : "#8a8071", fontWeight: 600 }}>{current.length} / {s.selectLimit} selected</div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 8 }}>
              {(s.items || []).map(it => {
                const checked = current.includes(it.name);
                const disabled = !checked && s.selectLimit && current.length >= s.selectLimit;
                return (
                  <label key={it.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, padding: "6px 8px", borderRadius: 6, background: checked ? "#F3EBD8" : "transparent", opacity: disabled ? 0.4 : 1, cursor: disabled ? "not-allowed" : "pointer" }}>
                    <input type="checkbox" checked={checked} disabled={disabled} onChange={() => toggleItem(s, it.name)} />
                    <span>{it.name}{s.isLiveCounter && it.price ? ` — ₹${it.price}/pax` : ""}</span>
                  </label>
                );
              })}
            </div>
          </div>
        );
      })}

      <div className="beo-card" style={{ padding: 18, marginBottom: 20 }}>
        <div style={{ fontWeight: 700, marginBottom: 8, fontSize: 14 }}>Suggestions / items not on this menu</div>
        <textarea className="beo-input" rows={3} placeholder="Anything else you'd like to add or request…" value={suggestions} onChange={e => setSuggestions(e.target.value)} style={{ resize: "vertical", fontFamily: "inherit" }} />
      </div>

      {errorMsg && <div style={{ color: "#c9585d", fontSize: 13, textAlign: "center", marginBottom: 14 }}>{errorMsg}</div>}

      <div style={{ textAlign: "center" }}>
        <button className="beo-btn beo-btn-primary" disabled={submitting} onClick={handleSubmit} style={{ padding: "12px 32px", fontSize: 15 }}>
          {submitting ? "Submitting…" : "Submit Selection"}
        </button>
      </div>
    </div>
  );
}

    if (skipNextPersonalSave.current) { skipNextPersonalSave.current = false; return; }
    setSyncStatus("syncing");
    personalDocRef.set({ categories, budgets, recentItems, bundles, proposals, companySettings, cateringTemplates }, { merge: true })
      .then(() => setSyncStatus("synced"))
      .catch(e => { console.error(e); setSyncStatus("error"); });
  }, [categories, budgets, recentItems, bundles, proposals, companySettings, cateringTemplates]);

  useEffect(() => {
    if (!loaded) return;
    if (skipNextSharedSave.current) { skipNextSharedSave.current = false; return; }
    setSyncStatus("syncing");
    sharedDocRef.set({ cities, corpQuotes, activityLog, vendors, ideas, decorFunctions, projects, customerLeads }, { merge: true })
      .then(() => setSyncStatus("synced"))
      .catch(e => { console.error(e); setSyncStatus("error"); });
  }, [cities, corpQuotes, activityLog, vendors, ideas, decorFunctions, projects, customerLeads]);

  const logActivity = (what) => {
    const entry = { id: uid(), who: getDeviceUser(), what, when: Date.now() };
    setActivityLog(prev => [entry, ...(prev || [])].slice(0, 100));
  };

  const openBudget = (id) => { setActiveBudgetId(id); setTab("builder"); };
  const createBudget = () => {
    const b = {
      id: uid(), name: "New Client Budget", clientName: "", date: new Date().toISOString().slice(0, 10), lines: [], days: [],
      profit: 0, commissionPercent: 0, individualCommissionPercent: 0, commissionMode: "final",
      otherExpenses: [], status: "Lead", clientPhone: "", clientAltPhone: "", managerName: "",
      advancePayments: [], notes: [], createdAt: Date.now()
    };
    setBudgets(prev => [b, ...prev]);
    logActivity("Created a new client budget");
    openBudget(b.id);
  };

  const openHotel = (cityId, hotelId) => { setActiveCityId(cityId); setActiveHotelId(hotelId); setTab("hotelDetail"); };
  const openVendor = (id) => { setActiveVendorId(id); setTab("vendorDetail"); };
  const openQuote = (id) => { setActiveQuoteId(id); setTab("quoteBuilder"); };
  const createQuote = () => {
    const q = {
      id: uid(), name: "New Corporate Quote", clientName: "", date: new Date().toISOString().slice(0, 10),
      cityId: "", hotelId: "",
      rooms: { qty: 0, rate: 0, nights: 1 },
      banquet: { mode: "flat", pax: 0, rate: 0 },
      extraLines: [],
      profit: 0, commissionPercent: 0, commissionMode: "final", currency: "₹", createdAt: Date.now()
    };
    setCorpQuotes(prev => [q, ...prev]);
    logActivity("Created a new corporate quote");
    openQuote(q.id);
  };

  const fileInputRef = useRef(null);
  const [globalSearch, setGlobalSearch] = useState("");
  const [menuOpen, setMenuOpen] = useState(false);
  const [sidebarExpanded, setSidebarExpanded] = useState(false);
  const [activityLogOpen, setActivityLogOpen] = useState(false);
  const [companySettingsOpen, setCompanySettingsOpen] = useState(false);

  const handleBackup = () => {
    const backup = { categories, budgets, recentItems, cities, corpQuotes, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `beo_backup_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleRestoreFile = (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!window.confirm("This will REPLACE your current data with the backup file. Continue?")) return;
        if (data.categories) setCategories(data.categories);
        if (data.budgets) setBudgets(data.budgets);
        if (data.recentItems) setRecentItems(data.recentItems);
        if (data.cities) setCities(data.cities);
        if (data.corpQuotes) setCorpQuotes(data.corpQuotes);
        alert("Backup restored successfully.");
      } catch (err) {
        alert("Could not read this file — make sure it's a valid backup JSON exported from this app.");
      }
    };
    reader.readAsText(file);
  };

  if (!loaded) return <div style={{ padding: 40, color: "#6b1e23" }}>Loading your workspace…</div>;

  const activeHotel = (() => {
    const c = cities.find(c => c.id === activeCityId);
    if (!c) return null;
    return c.hotels.find(h => h.id === activeHotelId) || null;
  })();

  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>
      {isAdmin && (
        <div style={{ width: sidebarExpanded ? 190 : 56, flexShrink: 0, background: "#FAF3E3", borderRight: "1px solid #EDE6D6", display: "flex", flexDirection: "column", alignItems: sidebarExpanded ? "stretch" : "center", paddingTop: 16, paddingLeft: sidebarExpanded ? 8 : 0, paddingRight: sidebarExpanded ? 8 : 0, gap: 4, transition: "width 0.18s ease", overflow: "hidden" }}>
          <button
            onClick={() => setSidebarExpanded(!sidebarExpanded)}
            title={sidebarExpanded ? "Collapse sidebar" : "Expand sidebar"}
            style={{ width: sidebarExpanded ? "100%" : 40, height: 40, borderRadius: 8, border: "none", cursor: "pointer", background: "transparent", color: "#6B1E23", fontSize: 18, display: "flex", alignItems: "center", justifyContent: sidebarExpanded ? "flex-start" : "center", gap: 10, paddingLeft: sidebarExpanded ? 8 : 0, marginBottom: 8 }}
          >
            ☰
          </button>
          <SidebarIcon expanded={sidebarExpanded} label="Quick Quote" title="Quick Quote" active={tab === "quickquote"} onClick={() => setTab("quickquote")}>⚡</SidebarIcon>
          <SidebarIcon expanded={sidebarExpanded} label="Vendors & Artists" title="Vendors & Artists" active={tab === "vendors" || tab === "vendorDetail"} onClick={() => setTab("vendors")}>👥</SidebarIcon>
          <SidebarIcon expanded={sidebarExpanded} label="Idea Box" title="Idea Box" active={tab === "ideas"} onClick={() => setTab("ideas")}>💡</SidebarIcon>
          <SidebarIcon expanded={sidebarExpanded} label="Decor" title="Decor" active={tab === "decor" || tab === "decorTheme"} onClick={() => setTab("decor")}>🎨</SidebarIcon>
          <SidebarIcon expanded={sidebarExpanded} label="Projects" title="Projects" active={tab === "projects" || tab === "projectDetail"} onClick={() => setTab("projects")}>📋</SidebarIcon>
          <SidebarIcon expanded={sidebarExpanded} label="Proposals" title="Proposals" active={tab === "proposals" || tab === "proposalBuilder"} onClick={() => setTab("proposals")}>✦</SidebarIcon>
          <SidebarIcon expanded={sidebarExpanded} label="Catering" title="Catering" active={tab === "catering" || tab === "cateringDetail"} onClick={() => setTab("catering")}>🍽️</SidebarIcon>
          <div style={{ flex: 1 }}></div>
          <div style={{ position: "relative", marginBottom: 16 }}>
            <button
              onClick={() => setMenuOpen(!menuOpen)}
              title="Account & data"
              style={{
                width: sidebarExpanded ? "100%" : 40, height: 40, borderRadius: 8, border: "none", cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: sidebarExpanded ? "flex-start" : "center",
                gap: 10, paddingLeft: sidebarExpanded ? 10 : 0, fontSize: 19, background: "transparent", color: "#6B1E23"
              }}
            >
              <span>⋮</span>
              {sidebarExpanded && <span style={{ fontSize: 13.5, fontWeight: 500 }}>Account & Data</span>}
            </button>
            {menuOpen && (
              <React.Fragment>
                <div onClick={() => setMenuOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 199 }}></div>
                <div style={{ position: "absolute", bottom: "100%", left: 0, marginBottom: 6, background: "#fff", border: "1px solid #EDE6D6", borderRadius: 8, boxShadow: "0 8px 24px rgba(0,0,0,0.12)", zIndex: 200, minWidth: 190, overflow: "hidden" }}>
                  <div onClick={() => { handleBackup(); setMenuOpen(false); }} style={{ padding: "10px 16px", cursor: "pointer", fontSize: 13.5, whiteSpace: "nowrap" }}>⬇ Backup</div>
                  <div onClick={() => { fileInputRef.current && fileInputRef.current.click(); setMenuOpen(false); }} style={{ padding: "10px 16px", cursor: "pointer", fontSize: 13.5, whiteSpace: "nowrap", borderTop: "1px solid #F1EADA" }}>⬆ Restore</div>
                  <div onClick={() => { setActivityLogOpen(true); setMenuOpen(false); }} style={{ padding: "10px 16px", cursor: "pointer", fontSize: 13.5, whiteSpace: "nowrap", borderTop: "1px solid #F1EADA" }}>📋 Activity Log</div>
                  <div onClick={() => { setCompanySettingsOpen(true); setMenuOpen(false); }} style={{ padding: "10px 16px", cursor: "pointer", fontSize: 13.5, whiteSpace: "nowrap", borderTop: "1px solid #F1EADA" }}>⚙ Company Settings</div>
                  <div onClick={() => auth.signOut()} style={{ padding: "10px 16px", cursor: "pointer", fontSize: 13.5, whiteSpace: "nowrap", borderTop: "1px solid #F1EADA", color: "#c9585d" }}>Sign out</div>
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      )}
      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
      <div style={{ borderBottom: "1px solid #EDE6D6", background: "#fff", padding: "18px 20px", display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <div className="beo-serif" style={{ fontSize: 24, fontWeight: 700, color: "#6B1E23" }}>The Executive Events</div>
          <div style={{ fontSize: 11.5, color: syncStatus === "error" ? "#c9585d" : "#8a8071", marginTop: 2 }}>
            {syncStatus === "syncing" ? "Syncing…" : syncStatus === "error" ? "Sync error — check connection" : `Synced · ${user.email}`}
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 14, flex: 1, justifyContent: "flex-end", minWidth: 0 }}>
          <nav className="beo-nav-scroll" style={{ display: "flex", gap: 4, alignItems: "center", overflowX: "auto", maxWidth: "100%" }}>
            {isAdmin && <TabBtn active={tab === "dashboard"} onClick={() => setTab("dashboard")}>Dashboard</TabBtn>}
            {isAdmin && <TabBtn active={tab === "inventory"} onClick={() => setTab("inventory")}>Inventory</TabBtn>}
            {isAdmin && <TabBtn active={tab === "budgets" || tab === "builder"} onClick={() => setTab("budgets")}>Client Budgets</TabBtn>}
            <TabBtn active={tab === "hotels" || tab === "hotelDetail"} onClick={() => setTab("hotels")}>Hotels</TabBtn>

      </div>
      {isAdmin && (

          <div style={{ maxWidth: "none", position: "relative" }}>
            <input
              className="beo-input"
              placeholder="🔍 Search across Hotels, Client Budgets & Corporate Quotes…"
              value={globalSearch}
              onChange={e => setGlobalSearch(e.target.value)}
              style={{ fontSize: 13.5 }}
            />
            {globalSearch.trim() && (() => {
              const q = globalSearch.trim().toLowerCase();
              const matchedBudgets = budgets.filter(b => (b.name || "").toLowerCase().includes(q) || (b.clientName || "").toLowerCase().includes(q)).slice(0, 5);
              const matchedHotels = cities.flatMap(c => c.hotels.filter(h => h.name.toLowerCase().includes(q)).map(h => ({ h, cityId: c.id }))).slice(0, 5);
              const matchedQuotes = corpQuotes.filter(qt => (qt.name || "").toLowerCase().includes(q) || (qt.clientName || "").toLowerCase().includes(q)).slice(0, 5);
              const noResults = matchedBudgets.length === 0 && matchedHotels.length === 0 && matchedQuotes.length === 0;
              return (
                <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#fff", border: "1px solid #EDE6D6", borderRadius: 8, marginTop: 4, boxShadow: "0 6px 20px rgba(0,0,0,0.08)", zIndex: 50, maxHeight: 360, overflowY: "auto" }}>
                  {noResults && <div style={{ padding: 14, color: "#a39a89", fontSize: 13 }}>No matches found.</div>}
                  {matchedBudgets.length > 0 && (
                    <div>
                      <div style={{ padding: "8px 14px", fontSize: 11, fontWeight: 700, color: "#8a8071", textTransform: "uppercase" }}>Client Budgets</div>
                      {matchedBudgets.map(b => (
                        <div key={b.id} onClick={() => { openBudget(b.id); setGlobalSearch(""); }} style={{ padding: "8px 14px", cursor: "pointer", fontSize: 13.5 }}>{b.name} <span style={{ color: "#8a8071", fontSize: 12 }}>({b.clientName || "no client"})</span></div>
                      ))}
                    </div>
                  )}
                  {matchedHotels.length > 0 && (
                    <div>
                      <div style={{ padding: "8px 14px", fontSize: 11, fontWeight: 700, color: "#8a8071", textTransform: "uppercase" }}>Hotels</div>
                      {matchedHotels.map(({ h, cityId }) => (
                        <div key={h.id} onClick={() => { openHotel(cityId, h.id); setGlobalSearch(""); }} style={{ padding: "8px 14px", cursor: "pointer", fontSize: 13.5 }}>{h.name}</div>
                      ))}
                    </div>
                  )}
                  {matchedQuotes.length > 0 && (
                    <div>
                      <div style={{ padding: "8px 14px", fontSize: 11, fontWeight: 700, color: "#8a8071", textTransform: "uppercase" }}>Corporate Quotes</div>
                      {matchedQuotes.map(qt => (
                        <div key={qt.id} onClick={() => { openQuote(qt.id); setGlobalSearch(""); }} style={{ padding: "8px 14px", cursor: "pointer", fontSize: 13.5 }}>{qt.name} <span style={{ color: "#8a8071", fontSize: 12 }}>({qt.clientName || "no client"})</span></div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })()}
          </div>
        </div>
      )}
      <div style={{ padding: 20, maxWidth: "none" }}>
        {isAdmin && tab === "dashboard" && <DashboardView budgets={budgets} onOpen={openBudget} activityLog={activityLog} />}
        {isAdmin && tab === "quickquote" && (
          <QuickQuoteView
            categories={categories}
            onSave={(items, clientName) => {
              const b = {
                id: uid(), name: clientName ? `Quick Quote — ${clientName}` : "Quick Quote", clientName: clientName || "",
                date: new Date().toISOString().slice(0, 10), lines: [],
                days: [{ id: uid(), date: new Date().toISOString().slice(0, 10), label: "Day 1", events: [{ id: uid(), name: "Quick Quote", time: "", lines: items }] }],
                profit: 0, commissionPercent: 0, individualCommissionPercent: 0, commissionMode: "final",
                otherExpenses: [], status: "Lead", clientPhone: "", clientAltPhone: "", managerName: "",
                advancePayments: [], notes: [], createdAt: Date.now()
              };
              setBudgets(prev => [b, ...prev]);
              logActivity("Created a Quick Quote" + (clientName ? ` for ${clientName}` : ""));
              openBudget(b.id);
            }}
          />
        )}
        {isAdmin && tab === "inventory" && <InventoryView categories={categories} setCategories={setCategories} bundles={bundles} setBundles={setBundles} />}
        {isAdmin && tab === "budgets" && <BudgetsListView budgets={budgets} setBudgets={setBudgets} onOpen={openBudget} onCreate={createBudget} />}
        {isAdmin && tab === "builder" && activeBudgetId && (
          <BudgetBuilder
            budget={budgets.find(b => b.id === activeBudgetId)}
            allBudgets={budgets}
            categories={categories}
            recentItems={recentItems}
            setRecentItems={setRecentItems}
            bundles={bundles}
            onBack={() => setTab("budgets")}
            onOpenBudget={openBudget}
            onChange={(updated) => setBudgets(prev => prev.map(b => b.id === updated.id ? updated : b))}
          />
        )}
        {tab === "hotels" && (
          <HotelsView cities={cities} setCities={setCities} onOpenHotel={openHotel} logActivity={logActivity} />
        )}
        {tab === "hotelDetail" && activeHotel && (
          <HotelDetail
            city={cities.find(c => c.id === activeCityId)}
            hotel={activeHotel}
            cities={cities}
            quotes={corpQuotes}
            onOpenQuote={openQuote}
            onBack={() => setTab("hotels")}
            onChange={(updated) => setCities(prev => prev.map(c => c.id === activeCityId ? { ...c, hotels: c.hotels.map(h => h.id === updated.id ? updated : h) } : c))}
          />
        )}
        {tab === "quotes" && (
          <QuotesListView quotes={corpQuotes} setQuotes={setCorpQuotes} onOpen={openQuote} onCreate={createQuote} cities={cities} />
        )}
        {tab === "quoteBuilder" && activeQuoteId && (
          <CorporateQuoteBuilder
            quote={corpQuotes.find(q => q.id === activeQuoteId)}
            cities={cities}
            onBack={() => setTab("quotes")}
            onChange={(updated) => setCorpQuotes(prev => prev.map(q => q.id === updated.id ? updated : q))}
          />
        )}
        {isAdmin && tab === "vendors" && (
          <VendorsView vendors={vendors} setVendors={setVendors} onOpen={openVendor} logActivity={logActivity} />
        )}
        {isAdmin && tab === "vendorDetail" && activeVendorId && (
          <VendorDetail
            vendor={vendors.find(v => v.id === activeVendorId)}
            onBack={() => setTab("vendors")}
            onChange={(updated) => setVendors(prev => prev.map(v => v.id === updated.id ? updated : v))}
          />
        )}
        {isAdmin && tab === "ideas" && <IdeaBoxView ideas={ideas} setIdeas={setIdeas} logActivity={logActivity} />}
        {isAdmin && tab === "decor" && (
          <DecorView
            decorFunctions={decorFunctions}
            setDecorFunctions={setDecorFunctions}
            onOpenTheme={(funcId, themeId) => { setActiveFunctionId(funcId); setActiveThemeId(themeId); setTab("decorTheme"); }}
            logActivity={logActivity}
          />
        )}
        {isAdmin && tab === "decorTheme" && activeFunctionId && activeThemeId && (
          <DecorThemeDetail
            decorFunction={decorFunctions.find(f => f.id === activeFunctionId)}
            theme={(decorFunctions.find(f => f.id === activeFunctionId)?.themes || []).find(t => t.id === activeThemeId)}
            onBack={() => setTab("decor")}
            onChange={(updatedTheme) => setDecorFunctions(prev => prev.map(f => f.id === activeFunctionId ? { ...f, themes: f.themes.map(t => t.id === updatedTheme.id ? updatedTheme : t) } : f))}
          />
        )}
        {isAdmin && tab === "projects" && (
          <ProjectsView
            projects={projects}
            setProjects={setProjects}
            customerLeads={customerLeads}
            setCustomerLeads={setCustomerLeads}
            onOpen={(id) => { setActiveProjectId(id); setTab("projectDetail"); }}
            logActivity={logActivity}
          />
        )}
        {isAdmin && tab === "projectDetail" && activeProjectId && (
          <ProjectDetail
            project={projects.find(p => p.id === activeProjectId)}
            onBack={() => setTab("projects")}
            onChange={(updated) => setProjects(prev => prev.map(p => p.id === updated.id ? updated : p))}
          />
        )}
        {isAdmin && tab === "proposals" && (
          <ProposalsListView
            proposals={proposals}
            setProposals={setProposals}
            onOpen={(id) => { setActiveProposalId(id); setTab("proposalBuilder"); }}
            logActivity={logActivity}
          />
        )}
        {isAdmin && tab === "proposalBuilder" && activeProposalId && (
          <ProposalBuilder
            proposal={proposals.find(p => p.id === activeProposalId)}
            budgets={budgets}
            companySettings={companySettings}
            onBack={() => setTab("proposals")}
            onChange={(updated) => setProposals(prev => prev.map(p => p.id === updated.id ? updated : p))}
          />
        )}
        {isAdmin && tab === "catering" && (
          <CateringListView
            templates={cateringTemplates}
            setTemplates={setCateringTemplates}
            onOpen={(id) => { setActiveCateringId(id); setTab("cateringDetail"); }}
            logActivity={logActivity}
          />
        )}
        {isAdmin && tab === "cateringDetail" && activeCateringId && (
          <CateringTemplateDetail
            template={cateringTemplates.find(t => t.id === activeCateringId)}
            budgets={budgets}
            setBudgets={setBudgets}
            onBack={() => setTab("catering")}
            onChange={(updated) => setCateringTemplates(prev => prev.map(t => t.id === updated.id ? updated : t))}
          />
        )}
      </div>
      </div>
      {companySettingsOpen && (
        <div onClick={() => setCompanySettingsOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div onClick={(e) => e.stopPropagation()} className="beo-card" style={{ padding: 24, maxWidth: 560, width: "100%", maxHeight: "85vh", overflowY: "auto" }}>
            <CompanySettingsForm settings={companySettings} onChange={setCompanySettings} onClose={() => setCompanySettingsOpen(false)} />
          </div>
        </div>
      )}
      {activityLogOpen && (
        <div onClick={() => setActivityLogOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div onClick={(e) => e.stopPropagation()} className="beo-card" style={{ padding: 24, maxWidth: 600, width: "100%", maxHeight: "80vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div className="beo-serif" style={{ fontSize: 20, fontWeight: 700, color: "#6B1E23" }}>Activity Log</div>
              <span onClick={() => setActivityLogOpen(false)} style={{ cursor: "pointer", fontSize: 18, color: "#8a8071" }}>×</span>

              <div key={a.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 4px", borderTop: "1px solid #F1EADA", fontSize: 12.5 }}>
                <div><b style={{ color: "#6B1E23" }}>{a.who}</b>: {a.what}</div>
                <span style={{ color: "#a39a89" }}>{new Date(a.when).toLocaleString("en-IN")}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function TabBtn({ active, onClick, children }) {
  return (
    <button
      className="beo-btn beo-tab-btn"
      onClick={onClick}
      style={{
        padding: "8px 13px", borderRadius: 6, fontSize: 13.5, whiteSpace: "nowrap", flexShrink: 0,
        background: active ? "#FAF3E3" : "transparent", color: active ? "#6B1E23" : "#7d7568",
        fontWeight: active ? 700 : 500, borderBottom: active ? "2px solid #B8934A" : "2px solid transparent"
      }}
    >
      {children}
    </button>
  );
}

function SidebarIcon({ title, label, expanded, active, onClick, children }) {
  return (
    <button
      onClick={onClick}
      title={title}
      style={{
        width: expanded ? "100%" : 40, height: 40, borderRadius: 8, border: "none", cursor: "pointer",
        display: "flex", alignItems: "center", justifyContent: expanded ? "flex-start" : "center",
        gap: 10, paddingLeft: expanded ? 10 : 0, fontSize: 19, flexShrink: 0,
        background: active ? "#6B1E23" : "transparent", color: active ? "#FAF6EE" : "#6B1E23",
        transition: "background 0.15s ease"
      }}
      onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "#F1EADA"; }}
      onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}
    >
      <span style={{ flexShrink: 0 }}>{children}</span>
      {expanded && <span style={{ fontSize: 13.5, fontWeight: active ? 700 : 500, whiteSpace: "nowrap" }}>{label}</span>}
    </button>
  );
}

function InventoryView({ categories, setCategories, bundles, setBundles }) {
  const [openCat, setOpenCat] = useState(categories[0]?.id || null);
  const [newCatName, setNewCatName] = useState("");
  const [itemDraft, setItemDraft] = useState({});
  const [selectedForBundle, setSelectedForBundle] = useState([]);
  const [bundleName, setBundleName] = useState("");
  const [editingPhotoFor, setEditingPhotoFor] = useState(null);
  const [photoUrlDraft, setPhotoUrlDraft] = useState("");

  useEffect(() => { if ((!openCat || !categories.find(c => c.id === openCat)) && categories[0]) setOpenCat(categories[0].id); }, [categories]);

  const toggleBundleItem = (catName, item) => {
    setSelectedForBundle(prev => {
      const exists = prev.find(x => x.itemRef === item.id);
      if (exists) return prev.filter(x => x.itemRef !== item.id);
      return [...prev, { itemRef: item.id, name: item.name, cost: item.cost, category: catName }];
    });
  };
  const createBundle = () => {
    if (!bundleName.trim() || selectedForBundle.length === 0 || !setBundles) return;
    setBundles(prev => [...(prev || []), { id: uid(), name: bundleName.trim(), items: selectedForBundle }]);
    setBundleName(""); setSelectedForBundle([]);
  };
  const removeBundle = (id) => setBundles(prev => (prev || []).filter(b => b.id !== id));

  const addCategory = () => {
    if (!newCatName.trim()) return;
    const c = { id: uid(), name: newCatName.trim(), items: [] };
    setCategories(prev => [...prev, c]);
    setNewCatName(""); setOpenCat(c.id);
  };
  const removeCategory = (id) => setCategories(prev => prev.filter(c => c.id !== id));
  const addItem = (catId) => {
    const draft = itemDraft[catId];
    if (!draft || !draft.name?.trim()) return;
    const item = { id: uid(), name: draft.name.trim(), cost: Number(draft.cost) || 0 };
    setCategories(prev => prev.map(c => c.id === catId ? { ...c, items: [...c.items, item] } : c));
    setItemDraft(prev => ({ ...prev, [catId]: { name: "", cost: "" } }));
  };
  const removeItem = (catId, itemId) => setCategories(prev => prev.map(c => c.id === catId ? { ...c, items: c.items.filter(i => i.id !== itemId) } : c));
  const updateItem = (catId, itemId, patch) => setCategories(prev => prev.map(c => c.id === catId ? { ...c, items: c.items.map(i => i.id === itemId ? { ...i, ...patch } : i) } : c));

  return (
    <React.Fragment>
    <div className="two-col">
      <div className="beo-card" style={{ padding: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#8a8071", textTransform: "uppercase", marginBottom: 10 }}>Folders</div>
        {categories.map(c => (
          <div key={c.id} onClick={() => setOpenCat(c.id)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", borderRadius: 6, cursor: "pointer", background: openCat === c.id ? "#F1EADA" : "transparent", marginBottom: 2 }}>
            <span style={{ fontSize: 14 }}>📁 {c.name} <span style={{ fontSize: 11, color: "#a39a89" }}>({c.items.length})</span></span>
            <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); removeCategory(c.id); }}>🗑</span>
          </div>
        ))}
        <div style={{ display: "flex", gap: 6, marginTop: 12 }}>
          <input className="beo-input" placeholder="New folder" value={newCatName} onChange={e => setNewCatName(e.target.value)} onKeyDown={e => e.key === "Enter" && addCategory()} style={{ fontSize: 13 }} />
          <button className="beo-btn beo-btn-gold" onClick={addCategory}>＋</button>
        </div>
      </div>
      <div className="beo-card" style={{ padding: 20 }}>
        {!openCat ? <div style={{ color: "#a39a89" }}>Create a folder to start adding items.</div> : (() => {
          const cat = categories.find(c => c.id === openCat);
          if (!cat) return null;
          return (
            <React.Fragment>
              <div className="beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 14 }}>{cat.name}</div>
              {cat.items.length === 0 && <div style={{ color: "#a39a89", fontSize: 14, marginBottom: 10 }}>No items yet.</div>}
              {cat.items.map(item => (
                <div key={item.id}>
                  <div style={{ display: "grid", gridTemplateColumns: "36px 24px 1fr 120px 30px", gap: 8, alignItems: "center", padding: "8px 4px", borderTop: "1px solid #F1EADA" }}>
                    <div onClick={() => setEditingPhotoFor(editingPhotoFor === item.id ? null : item.id)} style={{ width: 32, height: 32, borderRadius: 6, overflow: "hidden", background: "#F1EADA", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }} title="Click to add/change photo">
                      {item.photoUrl ? <img src={item.photoUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={e => e.target.style.opacity = 0.2} /> : <span style={{ fontSize: 14, color: "#a39a89" }}>📷</span>}
                    </div>
                    <input type="checkbox" checked={!!selectedForBundle.find(x => x.itemRef === item.id)} onChange={() => toggleBundleItem(cat.name, item)} title="Select for bundle" />
                    <input className="beo-input" value={item.name} onChange={e => updateItem(cat.id, item.id, { name: e.target.value })} />
                    <input className="beo-input" type="number" value={nz(item.cost)} onChange={e => updateItem(cat.id, item.id, { cost: Number(e.target.value) })} />
                    <span style={{ color: "#c98b8e", cursor: "pointer", textAlign: "center" }} onClick={() => removeItem(cat.id, item.id)}>🗑</span>
                  </div>
                  {editingPhotoFor === item.id && (
                    <div style={{ display: "flex", gap: 6, padding: "4px 4px 10px 44px" }}>
                      <input className="beo-input" placeholder="Paste photo link (Drive, Imgur, or direct image URL)" value={photoUrlDraft} onChange={e => setPhotoUrlDraft(e.target.value)} style={{ fontSize: 12.5 }} />
                      <button className="beo-btn beo-btn-primary" style={{ fontSize: 12 }} onClick={() => { updateItem(cat.id, item.id, { photoUrl: toDirectImageUrl(photoUrlDraft) }); setPhotoUrlDraft(""); setEditingPhotoFor(null); }}>Save</button>
                    </div>
                  )}
                </div>
              ))}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 120px auto", gap: 8, alignItems: "center", paddingTop: 10, marginTop: 10, borderTop: "1px dashed #E4DCC8" }}>
                <input className="beo-input" placeholder="New item name" value={itemDraft[cat.id]?.name || ""} onChange={e => setItemDraft(p => ({ ...p, [cat.id]: { ...p[cat.id], name: e.target.value } }))} onKeyDown={e => e.key === "Enter" && addItem(cat.id)} />
                <input className="beo-input" type="number" placeholder="Cost ₹" value={itemDraft[cat.id]?.cost || ""} onChange={e => setItemDraft(p => ({ ...p, [cat.id]: { ...p[cat.id], cost: e.target.value } }))} onKeyDown={e => e.key === "Enter" && addItem(cat.id)} />
                <button className="beo-btn beo-btn-primary" onClick={() => addItem(cat.id)}>＋ Add</button>
              </div>
            </React.Fragment>
          );
        })()}
      </div>
    </div>

    <div className="beo-card" style={{ padding: 20, marginTop: 16 }}>
      <div style={{ fontWeight: 700, marginBottom: 4 }}>Bundles</div>
      <div style={{ fontSize: 12, color: "#8a8071", marginBottom: 14 }}>Check items above (any folder) to group them into a reusable bundle — one click adds all of them to a budget event.</div>

      {selectedForBundle.length > 0 && (
        <div style={{ background: "#FAF6EE", borderRadius: 8, padding: 14, marginBottom: 16 }}>
          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8 }}>{selectedForBundle.length} item(s) selected: {selectedForBundle.map(x => x.name).join(", ")}</div>
          <div style={{ display: "flex", gap: 8 }}>
            <input className="beo-input" placeholder="Bundle name (e.g. Fog Package)" value={bundleName} onChange={e => setBundleName(e.target.value)} />
            <button className="beo-btn beo-btn-primary" onClick={createBundle}>＋ Create Bundle</button>
            <button className="beo-btn beo-btn-ghost" onClick={() => setSelectedForBundle([])}>Clear</button>
          </div>
        </div>
      )}

      {(bundles || []).length === 0 ? (
        <div style={{ color: "#a39a89", fontSize: 13 }}>No bundles yet.</div>
      ) : (bundles || []).map(b => (
        <div key={b.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 4px", borderTop: "1px solid #F1EADA" }}>
          <div>
            <div style={{ fontWeight: 600, fontSize: 14 }}>{b.name}</div>
            <div style={{ fontSize: 11.5, color: "#8a8071" }}>{b.items.map(i => i.name).join(", ")}</div>
          </div>
          <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={() => removeBundle(b.id)}>🗑</span>
        </div>
      ))}
    </div>
    </React.Fragment>
  );
}

function QuickQuoteView({ categories, onSave }) {
  const [search, setSearch] = useState("");
  const [selected, setSelected] = useState([]);
  const [clientName, setClientName] = useState("");

  const allItems = categories.flatMap(c => c.items.map(i => ({ ...i, category: c.name })));
  const filtered = search.trim() ? allItems.filter(i => i.name.toLowerCase().includes(search.trim().toLowerCase())) : allItems;

  const addItem = (item) => {
    setSelected(prev => {
      const exists = prev.find(l => l.itemRef === item.id);
      if (exists) return prev.map(l => l.itemRef === item.id ? { ...l, qty: l.qty + 1 } : l);
      return [...prev, { id: uid(), itemRef: item.id, category: item.category, name: item.name, cost: item.cost, qty: 1 }];
    });
  };
  const changeQty = (id, delta) => {
    setSelected(prev => prev.map(l => l.id === id ? { ...l, qty: Math.max(1, l.qty + delta) } : l).filter(l => l.qty > 0));
  };
  const removeItem = (id) => setSelected(prev => prev.filter(l => l.id !== id));

  const total = selected.reduce((s, l) => s + l.cost * l.qty, 0);

  return (
    <div>
      <div className="beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 6 }}>⚡ Quick Quote</div>
      <div style={{ fontSize: 12.5, color: "#8a8071", marginBottom: 16 }}>Tap items to build a rough quote live with a client — save it as a draft to refine fully later.</div>

      <input className="beo-input" placeholder="Client name (optional)" value={clientName} onChange={e => setClientName(e.target.value)} style={{ marginBottom: 12, fontSize: 15, padding: "12px 14px" }} />
      <input className="beo-input" placeholder="🔍 Search items…" value={search} onChange={e => setSearch(e.target.value)} style={{ marginBottom: 16, fontSize: 15, padding: "12px 14px" }} />

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10, marginBottom: 100 }}>
        {filtered.map(item => (
          <button key={item.id} onClick={() => addItem(item)} className="beo-btn" style={{ background: "#F1EADA", padding: "16px 10px", borderRadius: 10, fontSize: 14, fontWeight: 600, textAlign: "center", display: "block", lineHeight: 1.4 }}>
            {item.name}
            <div style={{ fontSize: 12, color: "#8a8071", fontWeight: 400 }}>{inr(item.cost)}</div>
          </button>
        ))}
        {filtered.length === 0 && <div style={{ color: "#a39a89", gridColumn: "1/-1" }}>No items match.</div>}
      </div>

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff", borderTop: "2px solid #E4DCC8", padding: "14px 20px", boxShadow: "0 -4px 20px rgba(0,0,0,0.08)", zIndex: 100 }}>
        <div style={{ maxWidth: "none" }}>
          {selected.length > 0 && (
            <div style={{ display: "flex", gap: 10, overflowX: "auto", marginBottom: 10, paddingBottom: 4 }}>
              {selected.map(l => (
                <div key={l.id} style={{ display: "flex", alignItems: "center", gap: 6, background: "#FAF6EE", borderRadius: 8, padding: "6px 10px", flexShrink: 0, fontSize: 13 }}>
                  <span>{l.name}</span>
                  <button className="beo-btn beo-btn-ghost" style={{ padding: "2px 8px", fontSize: 14 }} onClick={() => changeQty(l.id, -1)}>−</button>
                  <span style={{ fontWeight: 700 }}>{l.qty}</span>
                  <button className="beo-btn beo-btn-ghost" style={{ padding: "2px 8px", fontSize: 14 }} onClick={() => changeQty(l.id, 1)}>＋</button>
                  <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={() => removeItem(l.id)}>×</span>
                </div>
              ))}
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div className="beo-serif" style={{ fontSize: 20, fontWeight: 700, color: "#6B1E23" }}>Total: {inr(total)}</div>
            <button className="beo-btn beo-btn-primary" disabled={selected.length === 0} style={{ opacity: selected.length === 0 ? 0.5 : 1, padding: "12px 24px", fontSize: 15 }} onClick={() => onSave(selected, clientName)}>Save as Draft Budget →</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function StatusDonutChart({ data }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !window.Chart) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new window.Chart(canvasRef.current, {
      type: "doughnut",
      data: {
        labels: data.labels,
        datasets: [{ data: data.values, backgroundColor: data.colors, borderWidth: 2, borderColor: "#fff" }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { font: { family: "Inter", size: 12 }, padding: 12 } } },
        cutout: "62%"
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data.values)]);

  const total = data.values.reduce((a, b) => a + b, 0);
  if (total === 0) return <div style={{ color: "#a39a89", fontSize: 13, textAlign: "center", padding: "40px 0" }}>No budgets yet.</div>;

  return <div style={{ height: 240, position: "relative" }}><canvas ref={canvasRef}></canvas></div>;
}

function IncomeBarChart({ data }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !window.Chart) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new window.Chart(canvasRef.current, {
      type: "bar",
      data: {
        labels: data.map(d => d.label),
        datasets: [
          { label: "Revenue", data: data.map(d => d.revenue), backgroundColor: "#6B1E23" },
          { label: "Profit", data: data.map(d => d.profit), backgroundColor: "#2E7D32" },
          { label: "Commission Paid", data: data.map(d => d.commission), backgroundColor: "#B8712A" },
          { label: "Taxes", data: data.map(d => d.taxes), backgroundColor: "#2A6A9E" },
          { label: "Expenses", data: data.map(d => d.expenses), backgroundColor: "#7A4A6B" }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { font: { family: "Inter", size: 11.5 }, padding: 10 } } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { family: "Inter", size: 11.5 } } },
          y: { ticks: { font: { family: "Inter", size: 11 }, callback: (v) => "₹" + (v >= 1000 ? (v / 1000) + "k" : v) } }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data)]);

  return <div style={{ height: 240, position: "relative" }}><canvas ref={canvasRef}></canvas></div>;
}

function StatCard({ label, value, sub, color }) {
  return (
    <div className="beo-card" style={{ padding: 18 }}>
      <div style={{ fontSize: 11.5, color: "#8a8071", textTransform: "uppercase", fontWeight: 700, marginBottom: 6 }}>{label}</div>
      <div className="beo-serif" style={{ fontSize: 26, fontWeight: 700, color: color || "#6B1E23" }}>{value}</div>
      {sub && <div style={{ fontSize: 11.5, color: "#a39a89", marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

function DashboardView({ budgets, onOpen, activityLog }) {
  const now = new Date();
  const curMonth = now.getMonth(), curYear = now.getFullYear();

  const withFin = budgets.map(b => ({ b, fin: computeBudgetFinancials(b) }));
  const leads = withFin.filter(x => (x.b.status || "Lead") === "Lead");
  const connected = withFin.filter(x => x.b.status === "Connected");
  const converted = withFin.filter(x => x.b.status === "Converted");

  const safeSum = (arr) => arr.reduce((s, x) => s + (isFinite(x.fin.finalBudget) ? x.fin.finalBudget : 0), 0);
  const pipelineValue = safeSum([...leads, ...connected]);
  const convertedRevenue = safeSum(converted);
  const totalReceived = converted.reduce((s, x) => s + x.fin.totalReceived, 0);
  const balanceDue = convertedRevenue - totalReceived;

  const thisMonthEvents = budgets
    .filter(b => {
      if (!b.date) return false;
      const d = new Date(b.date);
      return d.getMonth() === curMonth && d.getFullYear() === curYear;
    })
    .sort((a, b) => new Date(a.date) - new Date(b.date));

  const totalDeals = leads.length + connected.length + converted.length;
  const conversionRate = totalDeals > 0 ? Math.round((converted.length / totalDeals) * 100) : 0;
  const avgDealSize = converted.length > 0 ? convertedRevenue / converted.length : 0;

  const monthCounts = {};
  budgets.forEach(b => {
    if (!b.date) return;
    const d = new Date(b.date);
    if (isNaN(d)) return;
    const key = d.toLocaleString("en-IN", { month: "long", year: "numeric" });
    monthCounts[key] = (monthCounts[key] || 0) + 1;
  });
  const busiestMonths = Object.entries(monthCounts).sort((a, b) => b[1] - a[1]).slice(0, 3);

  const statusChartData = {
    labels: ["Lead", "Connected", "Converted"],
    values: [leads.length, connected.length, converted.length],
    colors: ["#8a8071", "#2A6A9E", "#2E7D32"]
  };

  // Monthly income breakdown for the last 6 months, from converted budgets by event date
  const monthKeys = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(curYear, curMonth - i, 1);
    monthKeys.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleString("en-IN", { month: "short" }) });
  }
  const monthlyIncome = monthKeys.map(({ key, label }) => {
    const [y, m] = key.split("-").map(Number);
    const inMonth = converted.filter(x => {
      if (!x.b.date) return false;
      const d = new Date(x.b.date);
      return d.getFullYear() === y && d.getMonth() === m;
    });
    return {
      label,
      revenue: inMonth.reduce((s, x) => s + (isFinite(x.fin.finalBudget) ? x.fin.finalBudget : 0), 0),
      profit: inMonth.reduce((s, x) => s + x.fin.profit, 0),
      commission: inMonth.reduce((s, x) => s + x.fin.commissionAmount, 0),
      taxes: inMonth.reduce((s, x) => s + x.fin.gstAmount, 0),
      expenses: inMonth.reduce((s, x) => s + x.fin.expensesTotal, 0),
    };
  });

  return (
    <div>
      <div className="beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 18 }}>Dashboard</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 14, marginBottom: 14 }}>
        <StatCard label="Pipeline Value" value={inr(pipelineValue)} sub={`${leads.length} lead${leads.length === 1 ? "" : "s"} + ${connected.length} connected`} color="#8a8071" />
        <StatCard label="Converted Revenue" value={inr(convertedRevenue)} sub={`${converted.length} converted deal${converted.length === 1 ? "" : "s"}`} color="#2E7D32" />
        <StatCard label="Advance Received" value={inr(totalReceived)} sub="from converted deals" color="#2A6A9E" />
        <StatCard label="Balance Due" value={inr(balanceDue)} sub="from converted deals" color="#B8712A" />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 14, marginBottom: 20 }}>
        <StatCard label="Conversion Rate" value={`${conversionRate}%`} sub={`${converted.length} of ${totalDeals} total deals`} color="#6B1E23" />
        <StatCard label="Average Deal Size" value={inr(avgDealSize)} sub="per converted deal" color="#7A4A6B" />
        <div className="beo-card" style={{ padding: 18 }}>
          <div style={{ fontSize: 11.5, color: "#8a8071", textTransform: "uppercase", fontWeight: 700, marginBottom: 8 }}>Busiest Months</div>
          {busiestMonths.length === 0 ? <div style={{ color: "#a39a89", fontSize: 13 }}>Not enough data yet.</div> : busiestMonths.map(([month, count]) => (
            <div key={month} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0" }}>
              <span>{month}</span><span style={{ fontWeight: 700, color: "#6B1E23" }}>{count} event{count === 1 ? "" : "s"}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "300px 1fr", gap: 14, marginBottom: 20 }}>
        <div className="beo-card" style={{ padding: 18 }}>
          <div style={{ fontSize: 11.5, color: "#8a8071", textTransform: "uppercase", fontWeight: 700, marginBottom: 10 }}>Pipeline by Status</div>
          <StatusDonutChart data={statusChartData} />
        </div>
        <div className="beo-card" style={{ padding: 18 }}>
          <div style={{ fontSize: 11.5, color: "#8a8071", textTransform: "uppercase", fontWeight: 700, marginBottom: 10 }}>Income Breakdown — Last 6 Months</div>
          <IncomeBarChart data={monthlyIncome} />
        </div>
      </div>

      <div className="beo-card" style={{ padding: 20 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Events this month</div>
        {thisMonthEvents.length === 0 ? (
          <div style={{ color: "#a39a89", fontSize: 13.5 }}>No events scheduled this month.</div>
        ) : thisMonthEvents.map(b => (
          <div key={b.id} onClick={() => onOpen(b.id)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 4px", borderTop: "1px solid #F1EADA", cursor: "pointer", fontSize: 13.5 }}>
            <div>{b.name} <span style={{ color: "#8a8071", fontSize: 12 }}>({b.clientName || "no client name"})</span></div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 10, background: budgetStatusColor(b.status).bg, color: budgetStatusColor(b.status).fg }}>{b.status || "Lead"}</span>
              <span style={{ fontSize: 12.5, color: "#6B1E23" }}>{b.date}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
