      {budgets.length === 0 ? (
        <div className="beo-card" style={{ padding: 30, textAlign: "center", color: "#a39a89" }}>No client budgets yet.</div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 14 }}>
          {budgets.map(b => {
            const base = (b.lines || []).reduce((s, l) => s + l.cost * l.qty, 0) +
              (b.days || []).reduce((s, d) => s + d.events.reduce((s2, e) => s2 + e.lines.reduce((s3, l) => s3 + l.cost * l.qty, 0), 0), 0);
            return (
              <div key={b.id} className="beo-card" style={{ padding: 16, cursor: "pointer" }} onClick={() => onOpen(b.id)}>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{b.name}</div>
                <div style={{ fontSize: 12, color: "#8a8071", marginTop: 2 }}>{b.clientName || "No client name"} · {b.date}</div>
                <div style={{ marginTop: 10, fontSize: 13, color: "#6B1E23" }}>Base cost: {inr(base)}</div>
                <span style={{ display: "inline-block", marginTop: 6, fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 10, background: budgetStatusColor(b.status).bg, color: budgetStatusColor(b.status).fg }}>{b.status || "Lead"}</span>
                <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                  <button className="beo-btn beo-btn-ghost" onClick={(e) => { e.stopPropagation(); duplicateBudget(b); }}>Duplicate</button>
                  <button className="beo-btn beo-btn-ghost" style={{ color: "#c9585d" }} onClick={(e) => { e.stopPropagation(); removeBudget(b.id); }}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function BudgetBuilder({ budget, allBudgets, categories, recentItems, setRecentItems, bundles, onBack, onOpenBudget, onChange }) {
  const [search, setSearch] = useState("");
  const [activeDayId, setActiveDayId] = useState(null);
  const [activeEventId, setActiveEventId] = useState(null);
  const [newDayLabel, setNewDayLabel] = useState("");
  const [newDayDate, setNewDayDate] = useState("");
  const [newEventName, setNewEventName] = useState("");
  const [newEventTime, setNewEventTime] = useState("");
  const [newNoteText, setNewNoteText] = useState("");
  const [sharing, setSharing] = useState(false);
  const migratedRef = useRef(false);

  if (!budget) return null;
  const update = (patch) => onChange({ ...budget, ...patch });
  const days = budget.days || [];

  // One-time migration: old flat `lines` budgets become a single Day 1 / Event with those lines
  useEffect(() => {
    if (migratedRef.current) return;
    migratedRef.current = true;
    if ((!budget.days || budget.days.length === 0) && budget.lines && budget.lines.length > 0) {
      const day = { id: uid(), date: budget.date || "", label: "Day 1", events: [{ id: uid(), name: "Event", time: "", lines: budget.lines }] };
      update({ days: [day], lines: [] });
    }
  }, []);

  useEffect(() => {
    if (days.length > 0 && (!activeDayId || !days.find(d => d.id === activeDayId))) setActiveDayId(days[0].id);
  }, [days]);
  const activeDay = days.find(d => d.id === activeDayId);
  useEffect(() => {
    if (activeDay && activeDay.events.length > 0 && (!activeEventId || !activeDay.events.find(e => e.id === activeEventId))) {
      setActiveEventId(activeDay.events[0].id);
    }
    if (activeDay && activeDay.events.length === 0) setActiveEventId(null);
  }, [activeDay]);
  const activeEvent = activeDay && activeDay.events.find(e => e.id === activeEventId);

  const updateDays = (newDays) => update({ days: newDays });

  const addDay = () => {
    if (!newDayLabel.trim()) return;
    const day = { id: uid(), date: newDayDate, label: newDayLabel.trim(), events: [] };
    updateDays([...days, day]);
    setActiveDayId(day.id);
    setNewDayLabel(""); setNewDayDate("");
  };
  const removeDay = (dayId) => {
    updateDays(days.filter(d => d.id !== dayId));
  };
  const addEvent = () => {
    if (!newEventName.trim() || !activeDay) return;
    const ev = { id: uid(), name: newEventName.trim(), time: newEventTime.trim(), lines: [] };
    updateDays(days.map(d => d.id === activeDay.id ? { ...d, events: [...d.events, ev] } : d));
    setActiveEventId(ev.id);
    setNewEventName(""); setNewEventTime("");
  };
  const removeEvent = (eventId) => {
    updateDays(days.map(d => d.id === activeDay.id ? { ...d, events: d.events.filter(e => e.id !== eventId) } : d));
  };

  const addLine = (catName, item) => {
    if (!activeEvent) return;
    const exists = activeEvent.lines.find(l => l.itemRef === item.id);
    const newLines = exists
      ? activeEvent.lines.map(l => l.itemRef === item.id ? { ...l, qty: l.qty + 1 } : l)
      : [...activeEvent.lines, { id: uid(), itemRef: item.id, category: catName, name: item.name, cost: item.cost, qty: 1 }];
    updateDays(days.map(d => d.id === activeDay.id ? { ...d, events: d.events.map(e => e.id === activeEvent.id ? { ...e, lines: newLines } : e) } : d));
    if (setRecentItems) {
      setRecentItems(prev => {
        const withoutDupe = (prev || []).filter(r => r.id !== item.id);
        return [{ id: item.id, name: item.name, cost: item.cost, category: catName }, ...withoutDupe].slice(0, 10);
      });
    }
  };
  const addBundle = (bundle) => {
    bundle.items.forEach(bi => addLine(bi.category, { id: bi.itemRef, name: bi.name, cost: bi.cost }));
  };
  const updateLine = (id, patch) => {
    const newLines = activeEvent.lines.map(l => l.id === id ? { ...l, ...patch } : l);
    updateDays(days.map(d => d.id === activeDay.id ? { ...d, events: d.events.map(e => e.id === activeEvent.id ? { ...e, lines: newLines } : e) } : d));
  };
  const removeLine = (id) => {
    const newLines = activeEvent.lines.filter(l => l.id !== id);
    updateDays(days.map(d => d.id === activeDay.id ? { ...d, events: d.events.map(e => e.id === activeEvent.id ? { ...e, lines: newLines } : e) } : d));
  };

  const otherExpenses = budget.otherExpenses || [];
  const addExpense = () => update({ otherExpenses: [...otherExpenses, { id: uid(), label: "", amount: 0 }] });
  const updateExpense = (id, patch) => update({ otherExpenses: otherExpenses.map(x => x.id === id ? { ...x, ...patch } : x) });
  const removeExpense = (id) => update({ otherExpenses: otherExpenses.filter(x => x.id !== id) });
  const expensesTotal = otherExpenses.reduce((s, x) => s + (Number(x.amount) || 0), 0);

  const advancePayments = budget.advancePayments || [];
  const addPayment = () => update({ advancePayments: [{ id: uid(), date: new Date().toISOString().slice(0, 10), amount: 0 }, ...advancePayments] });
  const updatePayment = (id, patch) => update({ advancePayments: advancePayments.map(p => p.id === id ? { ...p, ...patch } : p) });
  const removePayment = (id) => update({ advancePayments: advancePayments.filter(p => p.id !== id) });
  const totalReceived = advancePayments.reduce((s, p) => s + (Number(p.amount) || 0), 0);

  const notes = budget.notes || [];
  const addNote = () => {
    if (!newNoteText.trim()) return;
    update({ notes: [{ id: uid(), date: new Date().toISOString().slice(0, 10), text: newNoteText.trim() }, ...notes] });
    setNewNoteText("");
  };
  const removeNote = (id) => update({ notes: notes.filter(n => n.id !== id) });

  const itemsCost = days.reduce((s, d) => s + d.events.reduce((s2, e) => s2 + e.lines.reduce((s3, l) => s3 + l.cost * l.qty, 0), 0), 0);
  const baseCost = itemsCost + expensesTotal;
  const profit = Number(budget.profit) || 0;
  const hotelPct = Number(budget.commissionPercent) || 0;
  const individualPct = Number(budget.individualCommissionPercent) || 0;
  const totalPct = hotelPct + individualPct;
  const mode = budget.commissionMode || "final";
  let finalBudget, hotelCommissionAmount, individualCommissionAmount;
  if (mode === "final") {
    if (totalPct >= 100) { finalBudget = Infinity; hotelCommissionAmount = Infinity; individualCommissionAmount = Infinity; }
    else {
      finalBudget = (baseCost + profit) / (1 - totalPct / 100);
      hotelCommissionAmount = finalBudget * (hotelPct / 100);
      individualCommissionAmount = finalBudget * (individualPct / 100);
    }
  } else {
    hotelCommissionAmount = baseCost * (hotelPct / 100);
    individualCommissionAmount = baseCost * (individualPct / 100);
    finalBudget = baseCost + profit + hotelCommissionAmount + individualCommissionAmount;
  }
  const commissionPct = hotelPct; // kept for any legacy reference below
  const discountAmount = Number(budget.discountAmount) || 0;
  const gstPercent = Number(budget.gstPercent) || 0;
  const afterDiscount = isFinite(finalBudget) ? Math.max(0, finalBudget - discountAmount) : finalBudget;
  const gstAmount = isFinite(afterDiscount) ? afterDiscount * (gstPercent / 100) : afterDiscount;
  const grandTotal = isFinite(afterDiscount) ? afterDiscount + gstAmount : afterDiscount;

  const filteredCats = categories.map(c => ({ ...c, items: c.items.filter(i => i.name.toLowerCase().includes(search.toLowerCase())) })).filter(c => c.items.length > 0 || !search);

  const activeTheme = PDF_THEMES[budget.pdfTheme || "royal"];
  const DAY_COLORS = activeTheme.dayColors;

  const hexToRgb = (hex) => {
    const m = hex.replace("#", "").match(/.{1,2}/g);
    return m.map(h => parseInt(h, 16));
  };

  const buildQuoteConfig = () => {
    const companyName = budget.pdfCompanyName || "";
    const sections = days.map((d, di) => ({
      title: `${d.label}${d.date ? ` — ${d.date}` : ""}`,
      color: hexToRgb(DAY_COLORS[di % DAY_COLORS.length]),
      subsections: d.events.map(ev => ({
        title: `${ev.name}${ev.time ? ` — ${ev.time}` : ""}`,
        items: ev.lines.map(l => ({ name: l.name, qty: l.qty }))
      }))
    }));

    if (otherExpenses.filter(x => x.label).length > 0) {
      sections.push({
        title: "Other Charges",
        color: [74, 85, 104],
        subsections: [{ title: "", items: otherExpenses.filter(x => x.label).map(x => ({ name: x.label, qty: inrPdf(x.amount) })) }]
      });
    }

    const totalRows = [];
    if (discountAmount > 0 || gstPercent > 0) {
      totalRows.push({ label: "Subtotal", value: (totalPct >= 100 && mode === "final") ? "—" : inrPdf(finalBudget) });
      if (discountAmount > 0) totalRows.push({ label: "Special Discount", value: "-" + inrPdf(discountAmount), color: [179, 58, 58] });
      if (gstPercent > 0) totalRows.push({ label: `GST (${gstPercent}%)`, value: inrPdf(gstAmount) });
    }

    return {
      companyName,
      title: budget.name || "Event Quotation",
      client: budget.clientName || "—",
      date: budget.date,
      sections,
      totalRows,
      grandTotalLabel: "Total Budget",
      grandTotal: (totalPct >= 100 && mode === "final") ? "—" : inrPdf(grandTotal),
      themePrimary: activeTheme.primary,
      themeAccent: activeTheme.accent
    };
  };

  const getOrCreateShareLink = async () => {
    setSharing(true);
    const id = budget.shareId || uid();
    const config = buildQuoteConfig();
    try {
      await db.collection("publicQuotes").doc(id).set({ ...config, updatedAt: Date.now() });
      if (!budget.shareId) update({ shareId: id });
      setSharing(false);
      return `${window.location.origin}${window.location.pathname}?share=${id}`;
    } catch (e) {
      setSharing(false);
      alert("Could not create share link: " + e.message);
      return null;
    }
  };

  const history = budget.history || [];
  const otherClientBudgets = (budget.clientPhone && budget.clientPhone.trim())
    ? (allBudgets || []).filter(b => b.id !== budget.id && b.clientPhone && b.clientPhone.trim() === budget.clientPhone.trim())
    : [];
  const buildVersionEntry = (label) => {
    const snapshot = {
      days: budget.days || [], otherExpenses: budget.otherExpenses || [], profit: budget.profit || 0,
      commissionPercent: budget.commissionPercent || 0, individualCommissionPercent: budget.individualCommissionPercent || 0,
      commissionMode: budget.commissionMode || "final", discountAmount: budget.discountAmount || 0, gstPercent: budget.gstPercent || 0
    };
    return { id: uid(), timestamp: Date.now(), label: label || "Saved version", total: (totalPct >= 100 && mode === "final") ? "—" : inr(grandTotal), snapshot };
  };
  const saveVersion = (label) => {
    update({ history: [buildVersionEntry(label), ...history].slice(0, 20) });
  };
  const restoreVersion = (entry) => {
    if (!window.confirm(`Restore this version from ${new Date(entry.timestamp).toLocaleString("en-IN")}? Your current unsaved changes to days/events/pricing will be replaced.`)) return;
    onChange({ ...budget, ...entry.snapshot });
  };

  const exportQuotation = () => {
    const config = buildQuoteConfig();
    const newEntry = buildVersionEntry("Sent to client");
    update({ history: [newEntry, ...history].slice(0, 20), quoteSentAt: Date.now() });
    window.generatePdf({ ...config, filename: (budget.clientName || budget.name || "quotation").replace(/[^a-z0-9]/gi, "_") });
  };

  return (
    <div>
      <button className="beo-btn beo-btn-ghost" onClick={onBack} style={{ marginBottom: 16 }}>← Back to budgets</button>
      <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <input className="beo-input" style={{ fontSize: 18, fontWeight: 600, flex: "1 1 220px" }} value={budget.name} onChange={e => update({ name: e.target.value })} />
        <input className="beo-input" placeholder="Client name" value={budget.clientName} onChange={e => update({ clientName: e.target.value })} style={{ width: 180 }} />
        <input className="beo-input" type="date" value={budget.date} onChange={e => update({ date: e.target.value })} style={{ width: 160 }} />
      </div>
      <div style={{ display: "flex", gap: 12, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
        <input className="beo-input" placeholder="Company name for PDF (optional, blank if none)" value={budget.pdfCompanyName || ""} onChange={e => update({ pdfCompanyName: e.target.value })} style={{ flex: "1 1 260px" }} />
        <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
          <span style={{ fontSize: 11, color: "#8a8071" }}>Theme:</span>
          {Object.keys(PDF_THEMES).map(key => (
            <span key={key} title={PDF_THEMES[key].label} onClick={() => update({ pdfTheme: key })} style={{ width: 22, height: 22, borderRadius: "50%", background: PDF_THEMES[key].swatch, cursor: "pointer", display: "inline-block", border: (budget.pdfTheme || "royal") === key ? "3px solid #B8934A" : "2px solid #fff", boxShadow: "0 0 0 1px #E4DCC8" }} />
          ))}
        </div>
        <button className="beo-btn beo-btn-gold" onClick={exportQuotation}>📄 Export Quotation</button>
        <button
          className="beo-btn"
          disabled={sharing}
          style={{ background: "#25D366", color: "#fff", padding: "9px 16px", fontSize: 14, fontWeight: 600, opacity: sharing ? 0.6 : 1 }}
          title="Generates a shareable link and opens WhatsApp with it pre-filled"
          onClick={async () => {
            const url = await getOrCreateShareLink();
            if (!url) return;
            const msg = `Hi ${budget.clientName || ""}, please find your event quotation here: ${url}\n\nTotal: ${(totalPct >= 100 && mode === "final") ? "" : inr(grandTotal)}. Let us know if you have any questions!\n\n— ${budget.pdfCompanyName || "The Executive Events"}`;
            window.open(waLinkWithText(budget.clientPhone, msg), "_blank");
          }}
        >{sharing ? "Generating link…" : "💬 Send via WhatsApp"}</button>
        {budget.shareId && (
          <button className="beo-btn beo-btn-ghost" onClick={async () => { const url = await getOrCreateShareLink(); if (url) { navigator.clipboard.writeText(url); alert("Link copied to clipboard:\n" + url); } }}>🔗 Copy Link</button>
        )}
      </div>
      <div style={{ fontSize: 11, color: "#a39a89", marginTop: -12, marginBottom: 16 }}>"Send via WhatsApp" now sends a clickable link — no manual PDF attaching needed. The link updates automatically each time you send.</div>

      <div className="beo-card" style={{ padding: 16, marginBottom: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Client Info</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 10, marginBottom: 14 }}>
          <div>
            <label style={{ fontSize: 11.5, color: "#8a8071" }}>Client phone</label>
            <input className="beo-input" value={budget.clientPhone || ""} onChange={e => update({ clientPhone: e.target.value })} style={{ marginTop: 4 }} />
          </div>
          <div>
            <label style={{ fontSize: 11.5, color: "#8a8071" }}>Alternate number</label>
            <input className="beo-input" value={budget.clientAltPhone || ""} onChange={e => update({ clientAltPhone: e.target.value })} style={{ marginTop: 4 }} />
          </div>
          <div>
            <label style={{ fontSize: 11.5, color: "#8a8071" }}>Managed by (our team)</label>
            <input className="beo-input" value={budget.managerName || ""} onChange={e => update({ managerName: e.target.value })} style={{ marginTop: 4 }} />
          </div>
          <div>
            <label style={{ fontSize: 11.5, color: "#8a8071" }}>Next follow-up date</label>
            <input className="beo-input" type="date" value={budget.followUpDate || ""} onChange={e => update({ followUpDate: e.target.value })} style={{ marginTop: 4 }} />
          </div>
        </div>
        <label style={{ fontSize: 11.5, color: "#8a8071", display: "block", marginBottom: 6 }}>Status</label>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {BUDGET_STATUSES.map(s => (
            <button key={s} className="beo-btn" onClick={() => update({ status: s })} style={{ padding: "7px 14px", fontSize: 12.5, borderRadius: 6, background: (budget.status || "Lead") === s ? budgetStatusColor(s).fg : "#F1EADA", color: (budget.status || "Lead") === s ? "#fff" : "#211D17" }}>{s}</button>
          ))}
        </div>

        <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, cursor: "pointer" }}>
            <input type="checkbox" checked={!!budget.clientApproved} onChange={e => update({ clientApproved: e.target.checked, clientApprovedDate: e.target.checked ? (budget.clientApprovedDate || new Date().toISOString().slice(0, 10)) : "" })} />
            Client approved this quote
          </label>
          {budget.clientApproved && (
            <input className="beo-input" type="date" value={budget.clientApprovedDate || ""} onChange={e => update({ clientApprovedDate: e.target.value })} style={{ width: 150, fontSize: 12.5, padding: "5px 8px" }} />
          )}
          {budget.quoteSentAt && (
            <span style={{ fontSize: 11.5, color: "#a39a89" }}>Last sent: {new Date(budget.quoteSentAt).toLocaleString("en-IN")}</span>
          )}
        </div>

        {budget.status === "Converted" && (
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px dashed #E4DCC8" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontWeight: 700, fontSize: 14 }}>Advance Payments Received</div>
              <button className="beo-btn beo-btn-primary" style={{ fontSize: 12, padding: "6px 10px" }} onClick={addPayment}>＋ Add payment</button>
            </div>
            {advancePayments.length === 0 ? <div style={{ color: "#a39a89", fontSize: 12.5, marginBottom: 10 }}>No payments logged yet.</div> : advancePayments.map(p => (
              <div key={p.id} style={{ display: "grid", gridTemplateColumns: "140px 1fr 24px", gap: 8, alignItems: "center", padding: "6px 4px", borderTop: "1px solid #F1EADA" }}>
                <input className="beo-input" type="date" value={p.date} onChange={e => updatePayment(p.id, { date: e.target.value })} style={{ padding: "5px 6px", fontSize: 12.5 }} />
                <input className="beo-input" type="number" placeholder="Amount ₹" value={nz(p.amount)} onChange={e => updatePayment(p.id, { amount: Number(e.target.value) || 0 })} style={{ padding: "5px 6px", fontSize: 12.5 }} />
                <span style={{ color: "#c98b8e", cursor: "pointer", textAlign: "center" }} onClick={() => removePayment(p.id)}>🗑</span>
              </div>
            ))}
            {advancePayments.length > 0 && <div style={{ textAlign: "right", fontSize: 12.5, fontWeight: 700, color: "#2E7D32", marginTop: 8 }}>Total received: {inr(totalReceived)}</div>}

            <div style={{ fontWeight: 700, fontSize: 14, marginTop: 16, marginBottom: 8 }}>Notes</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              <input className="beo-input" placeholder="Add a note…" value={newNoteText} onChange={e => setNewNoteText(e.target.value)} onKeyDown={e => e.key === "Enter" && addNote()} />
              <button className="beo-btn beo-btn-primary" onClick={addNote}>＋</button>
            </div>
            {notes.length === 0 ? <div style={{ color: "#a39a89", fontSize: 12.5 }}>No notes yet.</div> : notes.map(n => (
              <div key={n.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 4px", borderTop: "1px solid #F1EADA", fontSize: 12.5 }}>
                <div><b style={{ color: "#6B1E23" }}>{n.date}:</b> {n.text}</div>
                <span style={{ color: "#c98b8e", cursor: "pointer", marginLeft: 10 }} onClick={() => removeNote(n.id)}>🗑</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="beo-card" style={{ padding: 16, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div style={{ fontWeight: 700 }}>Version History</div>
          <button className="beo-btn beo-btn-ghost" style={{ fontSize: 12 }} onClick={() => saveVersion("Manual save")}>📸 Save version</button>
        </div>
        {history.length === 0 ? (
          <div style={{ color: "#a39a89", fontSize: 12.5 }}>No versions saved yet. One is saved automatically every time you export a quotation.</div>
        ) : history.map(h => (
          <div key={h.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 4px", borderTop: "1px solid #F1EADA", fontSize: 12.5 }}>
            <div><b>{h.label}</b> · {new Date(h.timestamp).toLocaleString("en-IN")} · Total: {h.total}</div>
            <button className="beo-btn beo-btn-ghost" style={{ fontSize: 11, padding: "4px 8px" }} onClick={() => restoreVersion(h)}>Restore</button>
          </div>
        ))}
      </div>

      {otherClientBudgets.length > 0 && (
        <div className="beo-card" style={{ padding: 16, marginBottom: 16 }}>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Client History — {budget.clientName || "this client"}'s other events</div>
          {otherClientBudgets.map(b => (
            <div key={b.id} onClick={() => onOpenBudget && onOpenBudget(b.id)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 4px", borderTop: "1px solid #F1EADA", cursor: "pointer", fontSize: 13.5 }}>
              <div>{b.name} <span style={{ color: "#8a8071", fontSize: 12 }}>({b.date})</span></div>
              <span style={{ fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 10, background: budgetStatusColor(b.status).bg, color: budgetStatusColor(b.status).fg }}>{b.status || "Lead"}</span>
            </div>
          ))}
        </div>
      )}

      <div className="beo-card" style={{ padding: 16, marginBottom: 16 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Days</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
          {days.map((d, i) => (
            <div key={d.id} onClick={() => setActiveDayId(d.id)} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, cursor: "pointer", background: activeDayId === d.id ? "#6B1E23" : "#F1EADA", color: activeDayId === d.id ? "#FAF6EE" : "#211D17" }}>
              <span style={{ fontSize: 13.5, fontWeight: 600 }}>{d.label}{d.date ? ` (${d.date})` : ""}</span>
              <span style={{ cursor: "pointer", opacity: 0.7 }} onClick={(e) => { e.stopPropagation(); removeDay(d.id); }}>×</span>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          <input className="beo-input" placeholder="Day label (e.g. Day 1)" value={newDayLabel} onChange={e => setNewDayLabel(e.target.value)} style={{ width: 160 }} />
          <input className="beo-input" type="date" value={newDayDate} onChange={e => setNewDayDate(e.target.value)} style={{ width: 160 }} />
          <button className="beo-btn beo-btn-primary" onClick={addDay}>＋ Add day</button>
        </div>
      </div>

      {activeDay && (
        <div className="beo-card" style={{ padding: 16, marginBottom: 16 }}>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Events in {activeDay.label}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
            {activeDay.events.map(ev => (
              <div key={ev.id} onClick={() => setActiveEventId(ev.id)} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, cursor: "pointer", background: activeEventId === ev.id ? "#B8934A" : "#F1EADA", color: activeEventId === ev.id ? "#FAF6EE" : "#211D17" }}>
                <span style={{ fontSize: 13.5, fontWeight: 600 }}>{ev.name}{ev.time ? ` — ${ev.time}` : ""}</span>
                <span style={{ cursor: "pointer", opacity: 0.7 }} onClick={(e) => { e.stopPropagation(); removeEvent(ev.id); }}>×</span>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            <input className="beo-input" placeholder="Event name (e.g. Haldi)" value={newEventName} onChange={e => setNewEventName(e.target.value)} style={{ width: 180 }} />
            <input className="beo-input" placeholder="Time (e.g. Morning)" value={newEventTime} onChange={e => setNewEventTime(e.target.value)} style={{ width: 140 }} />
            <button className="beo-btn beo-btn-primary" onClick={addEvent}>＋ Add event</button>
          </div>
        </div>
      )}

      {days.length === 0 && (
        <div className="beo-card" style={{ padding: 20, marginBottom: 16, color: "#a39a89" }}>Add a day above to start building the budget (e.g. "Day 1" — 18 Feb).</div>
      )}

      <div className="builder-col">
        <div>
          {activeEvent ? (
            <React.Fragment>
              <div className="beo-card" style={{ padding: 16, marginBottom: 16 }}>
                <div style={{ fontSize: 12, color: "#8a8071", marginBottom: 8 }}>Adding items to: <b style={{ color: "#6B1E23" }}>{activeDay.label} → {activeEvent.name}</b></div>
                {bundles && bundles.length > 0 && (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: "#8a8071", textTransform: "uppercase", marginBottom: 6 }}>Bundles</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {bundles.map(b => (
                        <span key={b.id} onClick={() => addBundle(b)} title={b.items.map(i => i.name).join(", ")} style={{ padding: "5px 10px", borderRadius: 14, background: "#EADFC2", fontSize: 12, cursor: "pointer", fontWeight: 600, color: "#6B1E23" }}>📦 {b.name}</span>
                      ))}
                    </div>
                  </div>
                )}
                {recentItems && recentItems.length > 0 && (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: "#8a8071", textTransform: "uppercase", marginBottom: 6 }}>Recently Used</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {recentItems.map(r => (
                        <span key={r.id} onClick={() => addLine(r.category, r)} style={{ padding: "5px 10px", borderRadius: 14, background: "#F1EADA", fontSize: 12, cursor: "pointer" }}>{r.name} <span style={{ color: "#8a8071" }}>{inr(r.cost)}</span></span>
                      ))}
                    </div>
                  </div>
                )}
                <input className="beo-input" placeholder="Search items across all folders…" value={search} onChange={e => setSearch(e.target.value)} style={{ marginBottom: 12 }} />
                <div style={{ maxHeight: 320, overflowY: "auto" }}>
                  {filteredCats.map(c => (
                    <div key={c.id} style={{ marginBottom: 10 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: "#8a8071", textTransform: "uppercase", margin: "6px 0" }}>{c.name}</div>
                      {c.items.map(item => (
                        <div key={item.id} onClick={() => addLine(c.name, item)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 8px", borderRadius: 6, cursor: "pointer", fontSize: 13.5 }}>
                          <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            {item.photoUrl && <img src={item.photoUrl} alt="" style={{ width: 22, height: 22, borderRadius: 4, objectFit: "cover" }} onError={e => e.target.style.display = "none"} />}
                            {item.name}
                          </span>
                          <span style={{ color: "#8a8071" }}>{inr(item.cost)} ＋</span>
                        </div>
                      ))}
                    </div>
                  ))}
                  {filteredCats.length === 0 && <div style={{ color: "#a39a89", fontSize: 13 }}>No items match.</div>}
                </div>
              </div>
              <div className="beo-card" style={{ padding: 16 }}>
                <div style={{ fontWeight: 700, marginBottom: 10 }}>Selected items ({activeEvent.lines.length})</div>
                {activeEvent.lines.length === 0 ? <div style={{ color: "#a39a89", fontSize: 13 }}>Click items above to add them to {activeEvent.name}.</div> : activeEvent.lines.map(l => (
                  <div key={l.id} style={{ display: "grid", gridTemplateColumns: "1fr 60px 90px 90px 24px", gap: 6, alignItems: "center", padding: "6px 4px", borderTop: "1px solid #F1EADA", fontSize: 13 }}>
                    <div>{l.name} <span style={{ color: "#a39a89", fontSize: 10.5 }}>({l.category})</span></div>
                    <input className="beo-input" type="number" min="1" value={l.qty} onChange={e => updateLine(l.id, { qty: Number(e.target.value) || 1 })} style={{ padding: "5px 6px" }} />
                    <input className="beo-input" type="number" value={nz(l.cost)} onChange={e => updateLine(l.id, { cost: Number(e.target.value) })} style={{ padding: "5px 6px" }} />
                    <div>{inr(l.cost * l.qty)}</div>
                    <span style={{ color: "#c98b8e", cursor: "pointer", textAlign: "center" }} onClick={() => removeLine(l.id)}>×</span>
                  </div>
                ))}
              </div>
            </React.Fragment>
          ) : (
            <div className="beo-card" style={{ padding: 20, color: "#a39a89" }}>Add a day and an event above, then pick it to start adding items.</div>
          )}
        </div>
        <div className="beo-card" style={{ padding: 20, alignSelf: "start" }}>
          <div className="beo-serif" style={{ fontSize: 20, fontWeight: 700, color: "#6B1E23", marginBottom: 4 }}>Final Budget Calculator</div>
          <div style={{ fontSize: 12, color: "#8a8071", marginBottom: 16 }}>Totals across all days & events. Commission on the final client budget by default.</div>
          <Row label="Items cost (all days)" value={inr(itemsCost)} />
          <Row label="Other expenses" value={inr(expensesTotal)} />
          <div style={{ margin: "14px 0" }}>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}>Your desired profit (₹)</label>
            <input className="beo-input" type="number" value={nz(budget.profit)} onChange={e => update({ profit: Number(e.target.value) || 0 })} style={{ marginTop: 6 }} />
          </div>

          <div style={{ margin: "14px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <label style={{ fontSize: 12.5, fontWeight: 600 }}>Other expenses</label>
              <button className="beo-btn beo-btn-ghost" style={{ fontSize: 11, padding: "4px 8px" }} onClick={addExpense}>＋ Add</button>
            </div>
            {otherExpenses.map(x => (
              <div key={x.id} style={{ display: "grid", gridTemplateColumns: "1fr 90px 22px", gap: 6, marginBottom: 6 }}>
                <input className="beo-input" placeholder="e.g. Transport, GST" value={x.label} onChange={e => updateExpense(x.id, { label: e.target.value })} style={{ padding: "6px 8px", fontSize: 12.5 }} />
                <input className="beo-input" type="number" placeholder="₹" value={nz(x.amount)} onChange={e => updateExpense(x.id, { amount: Number(e.target.value) || 0 })} style={{ padding: "6px 8px", fontSize: 12.5 }} />
                <span style={{ color: "#c98b8e", cursor: "pointer", textAlign: "center" }} onClick={() => removeExpense(x.id)}>×</span>
              </div>
            ))}
          </div>

          <div style={{ margin: "14px 0" }}>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}>Hotel commission (%)</label>
            <input className="beo-input" type="number" value={nz(budget.commissionPercent)} onChange={e => update({ commissionPercent: Number(e.target.value) || 0 })} style={{ marginTop: 6 }} />
          </div>
          <div style={{ margin: "14px 0" }}>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}>Individual commission (%)</label>
            <input className="beo-input" type="number" value={nz(budget.individualCommissionPercent)} onChange={e => update({ individualCommissionPercent: Number(e.target.value) || 0 })} style={{ marginTop: 6 }} />
          </div>
          <div style={{ margin: "14px 0" }}>
            <label style={{ fontSize: 12.5, fontWeight: 600, display: "block", marginBottom: 6 }}>Commission is calculated on</label>
            <div style={{ display: "flex", gap: 6 }}>
              <button className="beo-btn" onClick={() => update({ commissionMode: "final" })} style={{ flex: 1, padding: "8px 6px", fontSize: 12.5, borderRadius: 6, background: mode === "final" ? "#6B1E23" : "#F1EADA", color: mode === "final" ? "#FAF6EE" : "#6B1E23" }}>Final client budget</button>
              <button className="beo-btn" onClick={() => update({ commissionMode: "base" })} style={{ flex: 1, padding: "8px 6px", fontSize: 12.5, borderRadius: 6, background: mode === "base" ? "#6B1E23" : "#F1EADA", color: mode === "base" ? "#FAF6EE" : "#6B1E23" }}>Your base cost</button>
            </div>
          </div>
          <div style={{ borderTop: "1px dashed #E4DCC8", margin: "16px 0", paddingTop: 14 }}>
            <Row label="Base cost (items + expenses)" value={inr(baseCost)} />
            <Row label="Your profit" value={inr(profit)} />
            <Row label={`Hotel commission (${hotelPct}%)`} value={(totalPct >= 100 && mode === "final") ? "—" : inr(hotelCommissionAmount)} />
            <Row label={`Individual commission (${individualPct}%)`} value={(totalPct >= 100 && mode === "final") ? "—" : inr(individualCommissionAmount)} />
          </div>

          <div style={{ margin: "14px 0" }}>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}>Special discount (₹)</label>
            <input className="beo-input" type="number" value={nz(budget.discountAmount)} onChange={e => update({ discountAmount: Number(e.target.value) || 0 })} style={{ marginTop: 6 }} />
          </div>
          <div style={{ margin: "14px 0" }}>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}>GST (%)</label>
            <input className="beo-input" type="number" value={nz(budget.gstPercent)} onChange={e => update({ gstPercent: Number(e.target.value) || 0 })} style={{ marginTop: 6 }} />
          </div>
          <div style={{ borderTop: "1px dashed #E4DCC8", margin: "14px 0", paddingTop: 12 }}>
            <Row label="Subtotal" value={(totalPct >= 100 && mode === "final") ? "—" : inr(finalBudget)} />
            {discountAmount > 0 && <Row label="Special discount" value={"−" + inr(discountAmount)} />}
            {gstPercent > 0 && <Row label={`GST (${gstPercent}%)`} value={inr(gstAmount)} />}
          </div>
          <div style={{ background: "#6B1E23", borderRadius: 8, padding: "14px 16px" }}>
            <div style={{ fontSize: 12, color: "#E9D9B8" }}>Quote to client</div>
            <div className="beo-serif" style={{ fontSize: 28, fontWeight: 700, color: "#FAF6EE" }}>
              {(totalPct >= 100 && mode === "final") ? "Set commission < 100%" : inr(grandTotal)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================= HOTELS (city-wise database) ============================= */

function HotelsView({ cities, setCities, onOpenHotel, logActivity }) {
  const [openCityId, setOpenCityId] = useState(cities[0]?.id || null);
  const [newCityName, setNewCityName] = useState("");
  const [newCityRegion, setNewCityRegion] = useState("");
  const [newCityCountry, setNewCityCountry] = useState("India");
  const [newHotelName, setNewHotelName] = useState("");
  const [search, setSearch] = useState("");
  const [countryFilter, setCountryFilter] = useState("All");
  const [regionFilter, setRegionFilter] = useState("All");
  const [brandFilter, setBrandFilter] = useState("All");
  const [editingRegionId, setEditingRegionId] = useState(null);
  const [editRegionDraft, setEditRegionDraft] = useState("");
  const [editCountryDraft, setEditCountryDraft] = useState("");

  useEffect(() => { if ((!openCityId || !cities.find(c => c.id === openCityId)) && cities[0]) setOpenCityId(cities[0].id); }, [cities]);

  const cityCountry = (c) => (c.country && c.country.trim()) ? c.country.trim() : "India";
  const cityRegion = (c) => (c.region && c.region.trim()) ? c.region.trim() : "Unassigned";

  const allCountries = Array.from(new Set(cities.map(cityCountry)));
  if (allCountries.length === 0) allCountries.push("India");
  const countryOptions = ["All", ...allCountries];

  const regionsForCountry = Array.from(new Set(
    cities.filter(c => countryFilter === "All" || cityCountry(c) === countryFilter).map(cityRegion)
  ));
  const regionOptions = ["All", ...regionsForCountry];

  const allBrands = Array.from(new Set(
    cities.flatMap(c => c.hotels.map(h => (h.brand || "").trim())).filter(Boolean)
  )).sort();
  const brandOptions = ["All", ...allBrands];

  const q = search.trim().toLowerCase();
  const filtersActive = q.length > 0 || countryFilter !== "All" || regionFilter !== "All" || brandFilter !== "All";

  const filteredResults = filtersActive ? cities.flatMap(c => {
    if (countryFilter !== "All" && cityCountry(c) !== countryFilter) return [];
    if (regionFilter !== "All" && cityRegion(c) !== regionFilter) return [];
    const cityNameMatches = q.length > 0 && c.name.toLowerCase().includes(q);
    return c.hotels
      .filter(h => {
        if (brandFilter !== "All" && (h.brand || "").trim() !== brandFilter) return false;
        if (q.length === 0) return true;
        return cityNameMatches || h.name.toLowerCase().includes(q);
      })
      .map(h => ({ ...h, __cityId: c.id, __cityName: c.name }));
  }) : [];

  const addCity = () => {
    if (!newCityName.trim()) return;
    const c = { id: uid(), name: newCityName.trim(), region: newCityRegion.trim(), country: newCityCountry.trim() || "India", hotels: [] };
    setCities(prev => [...prev, c]);
    setNewCityName(""); setNewCityRegion(""); setOpenCityId(c.id);
  };
  const removeCity = (id) => setCities(prev => prev.filter(c => c.id !== id));

  const saveRegionEdit = (cityId) => {
    setCities(prev => prev.map(c => c.id === cityId ? { ...c, region: editRegionDraft.trim(), country: editCountryDraft.trim() || "India" } : c));
    setEditingRegionId(null);
  };

  const addHotel = (cityId) => {
    const name = newHotelName.trim();
    if (!name) return;
    const dupe = cities.flatMap(c => c.hotels.map(h => ({ h, cName: c.name }))).find(({ h }) => h.name.trim().toLowerCase() === name.toLowerCase());
    if (dupe && !window.confirm(`A hotel named "${dupe.h.name}" already exists in ${dupe.cName}. Add "${name}" here anyway?`)) return;
    const h = {
      id: uid(), name: name, description: "", brand: "", mapUrl: "",
      photos: [], documents: [],
      salesManager: { name: "", phone: "" },
      altContact: { name: "", phone: "" },
      status: "Not contacted", lastContactedDate: "", notes: []
    };
    setCities(prev => prev.map(c => c.id === cityId ? { ...c, hotels: [...c.hotels, h] } : c));
    if (logActivity) logActivity(`Added hotel "${name}"`);
    setNewHotelName("");
  };
  const removeHotel = (cityId, hotelId) => setCities(prev => prev.map(c => c.id === cityId ? { ...c, hotels: c.hotels.filter(h => h.id !== hotelId) } : c));

  const csvFileInputRef = useRef(null);
  const importCsv = (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    window.Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        let added = 0, skipped = 0;
        let nextCities = cities.map(c => ({ ...c, hotels: [...c.hotels] }));
        results.data.forEach(row => {
          const get = (...keys) => {
            for (const k of keys) {
              const found = Object.keys(row).find(rk => rk.trim().toLowerCase() === k.toLowerCase());
              if (found && row[found]) return row[found].trim();
            }
            return "";
          };
          const cityName = get("City/Area", "City", "Area");
          const hotelName = get("Hotel", "Hotel Name");
          if (!cityName || !hotelName) { skipped++; return; }
          const region = get("Region");
          const country = get("Country") || "India";
          let city = nextCities.find(c => c.name.toLowerCase() === cityName.toLowerCase());
          if (!city) {
            city = { id: uid(), name: cityName, region, country, hotels: [] };
            nextCities.push(city);
          }
          const dupe = city.hotels.find(h => h.name.toLowerCase() === hotelName.toLowerCase());
          if (dupe) { skipped++; return; }
          city.hotels.push({
            id: uid(), name: hotelName, brand: get("Brand"), description: get("Description"), mapUrl: "",
            photos: [], documents: [],
            salesManager: { name: get("Sales Manager", "SalesManagerName"), phone: get("Sales Phone", "SalesManagerPhone") },
            altContact: { name: get("Alt Contact", "AltContactName"), phone: get("Alt Phone", "AltContactPhone") },
            extraContacts: [], status: "Not contacted", lastContactedDate: "", notes: []
          });
          added++;
        });
        setCities(nextCities);
        alert(`Import complete: ${added} hotel(s) added, ${skipped} skipped (duplicates or missing city/hotel name).`);
      },
      error: (err) => alert("CSV parse error: " + err.message)
    });
  };

  const exportCsv = () => {
    const rows = [["Country", "Region", "City/Area", "Hotel", "Brand", "Status", "Last Contacted", "Sales Manager", "Sales Phone", "Alt Contact", "Alt Phone", "Description"]];
    cities.forEach(c => {
      c.hotels.forEach(h => {
        rows.push([
          cityCountry(c), cityRegion(c), c.name, h.name, h.brand || "", h.status || "Not contacted", h.lastContactedDate || "",
          h.salesManager?.name || "", h.salesManager?.phone || "", h.altContact?.name || "", h.altContact?.phone || "",
          (h.description || "").replace(/\n/g, " ")
        ]);
      });
    });
    const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "hotel_database.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const openCity = cities.find(c => c.id === openCityId);

  const groupedByRegion = {};
  cities.forEach(c => {
    const r = cityRegion(c);
    if (!groupedByRegion[r]) groupedByRegion[r] = [];
    groupedByRegion[r].push(c);
  });
  const regionGroupNames = Object.keys(groupedByRegion).sort((a, b) => (a === "Unassigned" ? 1 : b === "Unassigned" ? -1 : a.localeCompare(b)));

  return (
    <div>
      <div className="beo-card" style={{ padding: 14, marginBottom: 12 }}>
        <input
          className="beo-input"
          placeholder="Search by hotel name or city (e.g. 'Taj' or 'East Delhi')…"
          value={search}
          onChange={e => setSearch(e.target.value)}
          style={{ fontSize: 14 }}
        />
      </div>

      <div className="beo-card" style={{ padding: 14, marginBottom: 16, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <div style={{ fontSize: 11.5, fontWeight: 700, color: "#8a8071", textTransform: "uppercase" }}>Filters:</div>
        <select className="beo-input" style={{ width: "auto", minWidth: 140 }} value={countryFilter} onChange={e => { setCountryFilter(e.target.value); setRegionFilter("All"); }}>
          {countryOptions.map(o => <option key={o} value={o}>{o === "All" ? "All Countries" : o}</option>)}
        </select>
        <select className="beo-input" style={{ width: "auto", minWidth: 160 }} value={regionFilter} onChange={e => setRegionFilter(e.target.value)}>
          {regionOptions.map(o => <option key={o} value={o}>{o === "All" ? "All Regions" : o}</option>)}
        </select>
        <select className="beo-input" style={{ width: "auto", minWidth: 160 }} value={brandFilter} onChange={e => setBrandFilter(e.target.value)}>
          {brandOptions.map(o => <option key={o} value={o}>{o === "All" ? "All Brands" : o}</option>)}
        </select>
        {filtersActive && (
          <button className="beo-btn beo-btn-ghost" onClick={() => { setSearch(""); setCountryFilter("All"); setRegionFilter("All"); setBrandFilter("All"); }}>Clear filters</button>
        )}
        <button className="beo-btn beo-btn-gold" style={{ marginLeft: "auto" }} onClick={() => csvFileInputRef.current && csvFileInputRef.current.click()}>⬆ Import CSV</button>
        <input ref={csvFileInputRef} type="file" accept=".csv" onChange={importCsv} style={{ display: "none" }} />
        <button className="beo-btn beo-btn-gold" onClick={exportCsv}>⬇ Export CSV</button>
      </div>
      <div style={{ fontSize: 11, color: "#a39a89", marginBottom: 16, marginTop: -8 }}>
        CSV import expects columns: City/Area, Region, Country, Hotel, Brand, Description, Sales Manager, Sales Phone, Alt Contact, Alt Phone (matches the Export CSV format — export once to see the exact template).
      </div>

      {filtersActive ? (
        <div className="beo-card" style={{ padding: 20 }}>
          <div className="beo-serif" style={{ fontSize: 20, fontWeight: 700, color: "#6B1E23", marginBottom: 4 }}>
            {filteredResults.length} result{filteredResults.length === 1 ? "" : "s"}
          </div>
          <div style={{ fontSize: 12, color: "#8a8071", marginBottom: 16 }}>Clear filters to go back to browsing by region/city.</div>
          {filteredResults.length === 0 ? (
            <div style={{ color: "#a39a89" }}>No hotels match these filters.</div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 12 }}>
              {filteredResults.map(h => (
                <div key={h.id} className="beo-card" style={{ padding: 14, cursor: "pointer", position: "relative" }} onClick={() => onOpenHotel(h.__cityId, h.id)}>
                  {h.photos && h.photos[0] && (
                    <img src={photoUrlOf(h.photos[0])} alt="" style={{ width: "100%", height: 100, objectFit: "cover", borderRadius: 6, marginBottom: 8 }} onError={e => e.target.style.display = "none"} />
                  )}
                  <div style={{ fontSize: 11, color: "#B8934A", fontWeight: 700, textTransform: "uppercase", marginBottom: 2 }}>📍 {h.__cityName}</div>
                  <div style={{ fontWeight: 700, fontSize: 14.5 }}>{h.name}</div>
                  {h.brand && <div style={{ fontSize: 11, color: "#6B1E23", fontWeight: 600, marginTop: 2 }}>{h.brand}</div>}
                  <div style={{ fontSize: 11.5, color: "#8a8071", marginTop: 3 }}>
                    {h.salesManager?.name ? `Sales: ${h.salesManager.name}` : "No sales contact yet"}
                  </div>
                  <span style={{ display: "inline-block", marginTop: 6, fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 10, background: statusColor(h.status).bg, color: statusColor(h.status).fg }}>{h.status || "Not contacted"}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      ) : (
        <div className="two-col">
          <div className="beo-card" style={{ padding: 14 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#8a8071", textTransform: "uppercase", marginBottom: 10 }}>Cities, by region</div>
            {regionGroupNames.map(region => (
              <div key={region} style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#B8934A", textTransform: "uppercase", margin: "8px 0 4px" }}>📁 {region}</div>
                {groupedByRegion[region].map(c => (
                  <div key={c.id}>
                    <div onClick={() => setOpenCityId(c.id)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", borderRadius: 6, cursor: "pointer", background: openCityId === c.id ? "#F1EADA" : "transparent", marginBottom: 2 }}>
                      <span style={{ fontSize: 14 }}>📍 {c.name} <span style={{ fontSize: 11, color: "#a39a89" }}>({c.hotels.length})</span></span>
                      <span style={{ display: "flex", gap: 6 }}>
                        <span style={{ color: "#B8934A", cursor: "pointer", fontSize: 12 }} onClick={(e) => { e.stopPropagation(); setEditingRegionId(c.id); setEditRegionDraft(c.region || ""); setEditCountryDraft(c.country || "India"); }}>✎</span>
                        <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); removeCity(c.id); }}>🗑</span>
                      </span>
                    </div>
                    {editingRegionId === c.id && (
                      <div style={{ padding: "6px 10px 10px", background: "#FAF6EE", borderRadius: 6, marginBottom: 6 }}>
                        <input className="beo-input" placeholder="Region (e.g. Delhi NCR)" value={editRegionDraft} onChange={e => setEditRegionDraft(e.target.value)} style={{ marginBottom: 6, fontSize: 12.5 }} />
                        <input className="beo-input" placeholder="Country" value={editCountryDraft} onChange={e => setEditCountryDraft(e.target.value)} style={{ marginBottom: 6, fontSize: 12.5 }} />
                        <div style={{ display: "flex", gap: 6 }}>
                          <button className="beo-btn beo-btn-primary" style={{ fontSize: 12, padding: "6px 10px" }} onClick={() => saveRegionEdit(c.id)}>Save</button>
                          <button className="beo-btn beo-btn-ghost" style={{ fontSize: 12, padding: "6px 10px" }} onClick={() => setEditingRegionId(null)}>Cancel</button>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            ))}
            <div style={{ marginTop: 12, paddingTop: 10, borderTop: "1px dashed #E4DCC8" }}>
              <div style={{ fontSize: 11, color: "#a39a89", marginBottom: 6 }}>Add new city/area</div>
              <input className="beo-input" placeholder="Region (e.g. Delhi NCR, Jaipur)" value={newCityRegion} onChange={e => setNewCityRegion(e.target.value)} style={{ marginBottom: 6, fontSize: 13 }} />
              <input className="beo-input" placeholder="Country" value={newCityCountry} onChange={e => setNewCityCountry(e.target.value)} style={{ marginBottom: 6, fontSize: 13 }} />
              <div style={{ display: "flex", gap: 6 }}>
                <input className="beo-input" placeholder="City/area name (e.g. East Delhi)" value={newCityName} onChange={e => setNewCityName(e.target.value)} onKeyDown={e => e.key === "Enter" && addCity()} style={{ fontSize: 13 }} />
                <button className="beo-btn beo-btn-gold" onClick={addCity}>＋</button>
              </div>
            </div>
          </div>
          <div className="beo-card" style={{ padding: 20 }}>
            {!openCity ? <div style={{ color: "#a39a89" }}>Create a city to start adding hotels.</div> : (
              <React.Fragment>
                <div className="beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 2 }}>{openCity.name}</div>
                <div style={{ fontSize: 12, color: "#8a8071", marginBottom: 14 }}>{cityRegion(openCity)} · {cityCountry(openCity)}</div>
                {openCity.hotels.length === 0 && <div style={{ color: "#a39a89", fontSize: 14, marginBottom: 14 }}>No hotels yet in this city.</div>}
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 12, marginBottom: 18 }}>
                  {openCity.hotels.map(h => (
                    <div key={h.id} className="beo-card" style={{ padding: 14, cursor: "pointer", position: "relative" }} onClick={() => onOpenHotel(openCity.id, h.id)}>
                      {h.photos && h.photos[0] && (
                        <img src={photoUrlOf(h.photos[0])} alt="" style={{ width: "100%", height: 100, objectFit: "cover", borderRadius: 6, marginBottom: 8 }} onError={e => e.target.style.display = "none"} />
                      )}
                      <div style={{ fontWeight: 700, fontSize: 14.5 }}>{h.name}</div>
                      {h.brand && <div style={{ fontSize: 11, color: "#6B1E23", fontWeight: 600, marginTop: 2 }}>{h.brand}</div>}
                      <div style={{ fontSize: 11.5, color: "#8a8071", marginTop: 3 }}>
                        {h.salesManager?.name ? `Sales: ${h.salesManager.name}` : "No sales contact yet"}
                      </div>
                      <span style={{ display: "inline-block", marginTop: 6, fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 10, background: statusColor(h.status).bg, color: statusColor(h.status).fg }}>{h.status || "Not contacted"}</span>
                      <span style={{ position: "absolute", top: 10, right: 10, color: "#c98b8e", cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); removeHotel(openCity.id, h.id); }}>🗑</span>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 8, paddingTop: 10, borderTop: "1px dashed #E4DCC8" }}>
                  <input className="beo-input" placeholder="New hotel name" value={newHotelName} onChange={e => setNewHotelName(e.target.value)} onKeyDown={e => e.key === "Enter" && addHotel(openCity.id)} />
                  <button className="beo-btn beo-btn-primary" onClick={() => addHotel(openCity.id)}>＋ Add hotel</button>
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function HotelDetail({ city, hotel, cities, quotes, onOpenQuote, onBack, onChange }) {
  const [photoIdx, setPhotoIdx] = useState(0);
  const [newPhotoUrl, setNewPhotoUrl] = useState("");
  const [newDocLabel, setNewDocLabel] = useState("");
  const [newDocUrl, setNewDocUrl] = useState("");
  const [newNoteText, setNewNoteText] = useState("");
  const [uploadingPhoto, setUploadingPhoto] = useState(false);
  const [uploadingDoc, setUploadingDoc] = useState(false);
  const [uploadError, setUploadError] = useState("");

  if (!hotel) return null;
  const update = (patch) => onChange({ ...hotel, ...patch });
  const photos = hotel.photos || [];
  const documents = hotel.documents || [];
  const notes = hotel.notes || [];
  const extraContacts = hotel.extraContacts || [];
  const relatedQuotes = (quotes || []).filter(q => q.hotelId === hotel.id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const photoUrl = (p) => (typeof p === "string" ? p : p.url);
  const allBrands = Array.from(new Set((cities || []).flatMap(c => c.hotels.map(h => (h.brand || "").trim())).filter(Boolean))).sort();

  const addExtraContact = () => update({ extraContacts: [...extraContacts, { id: uid(), name: "", phone: "", position: "" }] });
  const updateExtraContact = (id, patch) => update({ extraContacts: extraContacts.map(c => c.id === id ? { ...c, ...patch } : c) });
  const removeExtraContact = (id) => update({ extraContacts: extraContacts.filter(c => c.id !== id) });

  const addNote = () => {
    if (!newNoteText.trim()) return;
    const note = { id: uid(), date: new Date().toISOString().slice(0, 10), text: newNoteText.trim() };
    update({ notes: [note, ...notes] });
    setNewNoteText("");
  };
  const removeNote = (id) => update({ notes: notes.filter(n => n.id !== id) });

  const addPhoto = () => {
    if (!newPhotoUrl.trim()) return;
    update({ photos: [...photos, toDirectImageUrl(newPhotoUrl)] });
    setNewPhotoUrl("");
  };
  const uploadPhotoFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setUploadError("");
    setUploadingPhoto(true);
    try {
      const path = `hotels/${hotel.id}/photos/${Date.now()}_${file.name}`;
      const ref = window.__storage.ref().child(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      update({ photos: [...photos, { url, storagePath: path }] });
    } catch (err) {
      setUploadError("Upload failed: " + err.message);
    }
    setUploadingPhoto(false);
  };
  const removePhoto = (i) => {
    const target = photos[i];
    if (target && typeof target === "object" && target.storagePath) {
      window.__storage.ref().child(target.storagePath).delete().catch(() => {});
    }
    update({ photos: photos.filter((_, idx) => idx !== i) });
    setPhotoIdx(0);
  };
  const addDoc = () => {
    if (!newDocUrl.trim() || documents.length >= 4) return;
    update({ documents: [...documents, { id: uid(), label: newDocLabel.trim() || "Document", url: newDocUrl.trim() }] });
    setNewDocLabel(""); setNewDocUrl("");
  };
  const uploadDocFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || documents.length >= 4) return;
    setUploadError("");
    setUploadingDoc(true);
    try {
      const path = `hotels/${hotel.id}/documents/${Date.now()}_${file.name}`;
      const ref = window.__storage.ref().child(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      update({ documents: [...documents, { id: uid(), label: newDocLabel.trim() || file.name, url, storagePath: path }] });
      setNewDocLabel("");
    } catch (err) {
      setUploadError("Upload failed: " + err.message);
    }
    setUploadingDoc(false);
  };
  const removeDoc = (id) => {
    const target = documents.find(d => d.id === id);
    if (target && target.storagePath) {
      window.__storage.ref().child(target.storagePath).delete().catch(() => {});
    }
    update({ documents: documents.filter(d => d.id !== id) });
  };

  const exportProfile = () => {
    const items = [];
    items.push({ name: `Sales Manager: ${hotel.salesManager?.name || "—"}${hotel.salesManager?.phone ? " — " + hotel.salesManager.phone : ""}`, qty: "" });
    items.push({ name: `Alternate Contact: ${hotel.altContact?.name || "—"}${hotel.altContact?.phone ? " — " + hotel.altContact.phone : ""}`, qty: "" });
    (extraContacts || []).forEach(c => items.push({ name: `${c.position || "Contact"}: ${c.name || "—"}${c.phone ? " — " + c.phone : ""}`, qty: "" }));

    const docItems = documents.length ? documents.map(d => ({ name: `${d.label}: ${d.url}`, qty: "" })) : [{ name: "None added", qty: "" }];
    const noteItems = notes.length ? notes.map(n => ({ name: `${n.date}: ${n.text}`, qty: "" })) : [{ name: "None added", qty: "" }];

    window.generatePdf({
      title: hotel.name,
      client: "",
      date: `${hotel.brand || ""}${city ? " · " + city.name : ""}`,
      sections: [
        { title: "Description", color: [107, 30, 35], subsections: [{ title: "", items: [{ name: hotel.description || "No description added", qty: "" }] }] },
        { title: "Contacts", color: [140, 90, 43], subsections: [{ title: "", items }] },
        { title: "Documents", color: [62, 92, 74], subsections: [{ title: "", items: docItems }] },
        { title: "Notes", color: [74, 85, 104], subsections: [{ title: "", items: noteItems }] }
      ],
      totalRows: [],
      grandTotalLabel: "",
      grandTotal: "",
      filename: hotel.name.replace(/[^a-z0-9]/gi, "_")
    });
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <button className="beo-btn beo-btn-ghost" onClick={onBack}>← Back to {city ? city.name : "Hotels"}</button>
        <button className="beo-btn beo-btn-gold" onClick={exportProfile}>📄 Export Profile PDF</button>
      </div>
      <div className="builder-col">
        <div>
          <div className="beo-card" style={{ padding: 20, marginBottom: 16 }}>
            <input className="beo-input beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 8, border: "none", padding: "4px 0" }} value={hotel.name} onChange={e => update({ name: e.target.value })} />
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Brand / Group (e.g. Taj, Marriott, Hyatt, Oberoi)</label>
            <input className="beo-input" list="brand-options" placeholder="Choose existing or type a new one" value={hotel.brand || ""} onChange={e => update({ brand: e.target.value })} style={{ marginTop: 4, marginBottom: 12, maxWidth: 260 }} />
            <datalist id="brand-options">
              {allBrands.map(b => <option key={b} value={b} />)}
            </datalist>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}>Description (capacity, key points, venues, etc.)</label>
            <textarea className="beo-input" rows={5} value={hotel.description} onChange={e => update({ description: e.target.value })} style={{ marginTop: 6, resize: "vertical", fontFamily: "inherit" }} placeholder="e.g. 442 rooms, 7,500 sqm event space across 15 venues, largest ballroom seats 1200 pax…" />
          </div>

          <div className="beo-card" style={{ padding: 20, marginBottom: 16 }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Photos ({photos.length})</div>
            {photos.length > 0 ? (
              <div style={{ marginBottom: 12 }}>
                <div style={{ position: "relative", width: "100%", height: 260, borderRadius: 8, overflow: "hidden", background: "#F1EADA" }}>
                  <img src={photoUrl(photos[photoIdx])} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={e => e.target.style.opacity = 0.2} />
                  {photos.length > 1 && (
                    <React.Fragment>
                      <button onClick={() => setPhotoIdx((photoIdx - 1 + photos.length) % photos.length)} style={{ position: "absolute", left: 8, top: "50%", transform: "translateY(-50%)", background: "rgba(0,0,0,0.5)", color: "#fff", border: "none", borderRadius: "50%", width: 32, height: 32, cursor: "pointer" }}>‹</button>
                      <button onClick={() => setPhotoIdx((photoIdx + 1) % photos.length)} style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", background: "rgba(0,0,0,0.5)", color: "#fff", border: "none", borderRadius: "50%", width: 32, height: 32, cursor: "pointer" }}>›</button>
                    </React.Fragment>
                  )}
                  <span onClick={() => removePhoto(photoIdx)} style={{ position: "absolute", top: 8, right: 8, background: "rgba(0,0,0,0.55)", color: "#fff", borderRadius: 6, padding: "3px 8px", fontSize: 11, cursor: "pointer" }}>Remove</span>
                </div>
                <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                  {photos.map((p, i) => (
                    <div key={i} onClick={() => setPhotoIdx(i)} style={{ width: 44, height: 44, borderRadius: 6, overflow: "hidden", cursor: "pointer", border: i === photoIdx ? "2px solid #6B1E23" : "2px solid transparent" }}>
                      <img src={photoUrl(p)} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={e => e.target.style.opacity = 0.2} />
                    </div>
                  ))}
                </div>
              </div>
            ) : <div style={{ color: "#a39a89", fontSize: 13, marginBottom: 12 }}>No photos yet.</div>}

            <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
              <label className="beo-btn beo-btn-primary" style={{ cursor: uploadingPhoto ? "default" : "pointer", opacity: uploadingPhoto ? 0.6 : 1 }}>
                {uploadingPhoto ? "Uploading…" : "⬆ Upload from PC"}
                <input type="file" accept="image/*" onChange={uploadPhotoFile} disabled={uploadingPhoto} style={{ display: "none" }} />
              </label>
              <span style={{ fontSize: 11.5, color: "#a39a89" }}>or paste a link below</span>
            </div>
            <div style={{ fontSize: 11.5, color: "#a39a89", marginBottom: 6 }}>Paste an image link (Google Drive share link, Imgur, or any direct image URL)</div>
            <div style={{ display: "flex", gap: 6 }}>
              <input className="beo-input" placeholder="https://…" value={newPhotoUrl} onChange={e => setNewPhotoUrl(e.target.value)} onKeyDown={e => e.key === "Enter" && addPhoto()} />
              <button className="beo-btn beo-btn-gold" onClick={addPhoto}>＋ Add</button>
            </div>
          </div>

          <div className="beo-card" style={{ padding: 20 }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Documents ({documents.length}/4)</div>
            {documents.length === 0 && <div style={{ color: "#a39a89", fontSize: 13, marginBottom: 10 }}>No documents yet — e.g. Fact Sheet PDF, Room Rates PDF.</div>}
            {documents.map(d => (
              <div key={d.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 4px", borderTop: "1px solid #F1EADA", fontSize: 13.5 }}>
                <a href={d.url} target="_blank" rel="noreferrer" style={{ color: "#6B1E23", fontWeight: 600, textDecoration: "none" }}>📄 {d.label}</a>
                <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={() => removeDoc(d.id)}>🗑</span>
              </div>
            ))}
            {documents.length < 4 && (
              <div style={{ marginTop: 12, paddingTop: 10, borderTop: "1px dashed #E4DCC8" }}>
                <input className="beo-input" placeholder="Label (e.g. Fact Sheet)" value={newDocLabel} onChange={e => setNewDocLabel(e.target.value)} style={{ marginBottom: 8 }} />
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
                  <label className="beo-btn beo-btn-primary" style={{ cursor: uploadingDoc ? "default" : "pointer", opacity: uploadingDoc ? 0.6 : 1 }}>
                    {uploadingDoc ? "Uploading…" : "⬆ Upload PDF from PC"}
                    <input type="file" accept="application/pdf" onChange={uploadDocFile} disabled={uploadingDoc} style={{ display: "none" }} />
                  </label>
                  <span style={{ fontSize: 11.5, color: "#a39a89" }}>or paste a link below</span>
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input className="beo-input" placeholder="https://… (PDF link)" value={newDocUrl} onChange={e => setNewDocUrl(e.target.value)} onKeyDown={e => e.key === "Enter" && addDoc()} />
                  <button className="beo-btn beo-btn-gold" onClick={addDoc}>＋</button>
                </div>
              </div>
            )}
            {uploadError && <div style={{ color: "#c9585d", fontSize: 12, marginTop: 10 }}>{uploadError}</div>}
          </div>

          <div className="beo-card" style={{ padding: 20, marginTop: 16 }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Location</div>
            <div style={{ borderRadius: 8, overflow: "hidden", border: "1px solid #EDE6D6", marginBottom: 10 }}>
              <iframe
                title="Hotel location map"
                width="100%"
                height="220"
                style={{ border: 0, display: "block" }}
                loading="lazy"
                src={`https://maps.google.com/maps?q=${encodeURIComponent(hotel.name + " " + (city ? city.name : ""))}&output=embed`}
              ></iframe>
            </div>
            <div style={{ fontSize: 11.5, color: "#a39a89", marginBottom: 6 }}>
              Map above is auto-generated from the hotel name. If it's not pinpointing the right spot, paste the exact Google Maps link below.
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <input className="beo-input" placeholder="Paste exact Google Maps link (optional)" value={hotel.mapUrl || ""} onChange={e => update({ mapUrl: e.target.value })} />
            </div>
            {hotel.mapUrl && (
              <a href={hotel.mapUrl} target="_blank" rel="noreferrer" style={{ display: "inline-block", marginTop: 10, fontSize: 13, color: "#6B1E23", fontWeight: 600, textDecoration: "none" }}>
                📍 Open exact saved location on Google Maps ↗
              </a>
            )}
          </div>
        </div>

        <div className="beo-card" style={{ padding: 20, alignSelf: "start" }}>
          <div className="beo-serif" style={{ fontSize: 20, fontWeight: 700, color: "#6B1E23", marginBottom: 14 }}>Contacts</div>
          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 6 }}>Sales Manager</div>
          <input className="beo-input" placeholder="Name" value={hotel.salesManager?.name || ""} onChange={e => update({ salesManager: { ...hotel.salesManager, name: e.target.value } })} style={{ marginBottom: 8 }} />
          <input className="beo-input" placeholder="Phone number" value={hotel.salesManager?.phone || ""} onChange={e => update({ salesManager: { ...hotel.salesManager, phone: e.target.value } })} style={{ marginBottom: 8 }} />
          {hotel.salesManager?.phone && (
            <a href={waLink(hotel.salesManager.phone)} target="_blank" rel="noreferrer" style={{ display: "inline-block", marginBottom: 18, fontSize: 12.5, color: "#2E7D32", fontWeight: 600, textDecoration: "none" }}>💬 WhatsApp {hotel.salesManager.name || "Sales Manager"}</a>
          )}
          {!hotel.salesManager?.phone && <div style={{ marginBottom: 18 }} />}

          <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 6 }}>Alternate Contact</div>
          <input className="beo-input" placeholder="Name" value={hotel.altContact?.name || ""} onChange={e => update({ altContact: { ...hotel.altContact, name: e.target.value } })} style={{ marginBottom: 8 }} />
          <input className="beo-input" placeholder="Phone number" value={hotel.altContact?.phone || ""} onChange={e => update({ altContact: { ...hotel.altContact, phone: e.target.value } })} style={{ marginBottom: 8 }} />
          {hotel.altContact?.phone && (
            <a href={waLink(hotel.altContact.phone)} target="_blank" rel="noreferrer" style={{ display: "inline-block", fontSize: 12.5, color: "#2E7D32", fontWeight: 600, textDecoration: "none" }}>💬 WhatsApp {hotel.altContact.name || "Alternate Contact"}</a>
          )}

          <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1px dashed #E4DCC8" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 12.5, fontWeight: 600 }}>Additional Contacts</div>
              <button className="beo-btn beo-btn-ghost" style={{ fontSize: 11, padding: "4px 8px" }} onClick={addExtraContact}>＋ Add</button>
            </div>
            {extraContacts.length === 0 && <div style={{ color: "#a39a89", fontSize: 12 }}>None added.</div>}
            {extraContacts.map(c => (
              <div key={c.id} style={{ marginBottom: 12, paddingBottom: 12, borderBottom: "1px solid #F1EADA" }}>
                <input className="beo-input" placeholder="Name" value={c.name} onChange={e => updateExtraContact(c.id, { name: e.target.value })} style={{ marginBottom: 6 }} />
                <input className="beo-input" placeholder="Position (e.g. Banquet Manager)" value={c.position || ""} onChange={e => updateExtraContact(c.id, { position: e.target.value })} style={{ marginBottom: 6 }} />

      <div className="beo-card" style={{ padding: 20, marginTop: 16 }}>

        ) : relatedQuotes.map(q => (
          <div key={q.id} onClick={() => onOpenQuote(q.id)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 8px", borderTop: "1px solid #F1EADA", cursor: "pointer", fontSize: 13.5 }}>
            <div>
              <div style={{ fontWeight: 600 }}>{q.name}</div>

            </div>

          </div>
        ))}
      </div>
    </div>
  );
}

const VENDOR_CATEGORIES = ["Anchor", "Music Band", "Live Band", "Singer", "Other Artist", "Vendor", "Other"];

function VendorsView({ vendors, setVendors, onOpen, logActivity }) {
  const [search, setSearch] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("All");
  const [newName, setNewName] = useState("");
  const [newCategory, setNewCategory] = useState("Anchor");

  const q = search.trim().toLowerCase();
  const filtered = vendors.filter(v => {
    if (categoryFilter !== "All" && v.category !== categoryFilter) return false;
    if (q && !v.name.toLowerCase().includes(q)) return false;
    return true;
  });

  const addVendor = () => {
    const name = newName.trim();
    if (!name) return;
    const v = {
      id: uid(), name, category: newCategory, officeLocation: "", mapUrl: "",
      metNote: "", costing: "", phones: [], photos: [], documents: [], workHistory: []
    };
    setVendors(prev => [v, ...prev]);
    if (logActivity) logActivity(`Added vendor/artist "${name}" (${newCategory})`);
    setNewName("");
  };
  const removeVendor = (id) => setVendors(prev => prev.filter(v => v.id !== id));

  return (
    <div>
      <div className="beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 14 }}>Vendors & Artists</div>

      <div className="beo-card" style={{ padding: 14, marginBottom: 14, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <input className="beo-input" placeholder="🔍 Search by name…" value={search} onChange={e => setSearch(e.target.value)} style={{ flex: "1 1 220px" }} />
        <select className="beo-input" style={{ width: "auto" }} value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}>
          <option value="All">All Categories</option>
          {VENDOR_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>

      <div className="beo-card" style={{ padding: 14, marginBottom: 16, display: "flex", gap: 8, flexWrap: "wrap" }}>
        <input className="beo-input" placeholder="Name" value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === "Enter" && addVendor()} style={{ flex: "1 1 200px" }} />
        <select className="beo-input" style={{ width: "auto" }} value={newCategory} onChange={e => setNewCategory(e.target.value)}>
          {VENDOR_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <button className="beo-btn beo-btn-primary" onClick={addVendor}>＋ Add</button>
      </div>

      {filtered.length === 0 ? (
        <div className="beo-card" style={{ padding: 30, textAlign: "center", color: "#a39a89" }}>No vendors or artists match.</div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 14 }}>

            <div key={v.id} className="beo-card" style={{ padding: 16, cursor: "pointer", position: "relative" }} onClick={() => onOpen(v.id)}>
              {v.photos && v.photos[0] && (
                <img src={photoUrlOf(v.photos[0])} alt="" style={{ width: "100%", height: 100, objectFit: "cover", borderRadius: 6, marginBottom: 8 }} onError={e => e.target.style.display = "none"} />
              )}

              <div style={{ fontWeight: 700, fontSize: 14.5 }}>{v.name}</div>
              <div style={{ fontSize: 11.5, color: "#8a8071", marginTop: 3 }}>{v.officeLocation || "No location added"}</div>

            </div>
          ))}
