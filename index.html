      )}
    </div>
  );
}

function VendorDetail({ vendor, onBack, onChange }) {
  const [photoIdx, setPhotoIdx] = useState(0);
  const [newPhotoUrl, setNewPhotoUrl] = useState("");
  const [newDocLabel, setNewDocLabel] = useState("");
  const [newDocUrl, setNewDocUrl] = useState("");
  const [newHistoryText, setNewHistoryText] = useState("");
  const [uploadingPhoto, setUploadingPhoto] = useState(false);
  const [uploadingDoc, setUploadingDoc] = useState(false);
  const [uploadError, setUploadError] = useState("");

  if (!vendor) return null;
  const update = (patch) => onChange({ ...vendor, ...patch });
  const photos = vendor.photos || [];
  const documents = vendor.documents || [];
  const phones = vendor.phones || [];
  const workHistory = vendor.workHistory || [];
  const photoUrl = (p) => (typeof p === "string" ? p : p.url);

  const addPhone = () => update({ phones: [...phones, { id: uid(), name: "", phone: "" }] });
  const updatePhone = (id, patch) => update({ phones: phones.map(p => p.id === id ? { ...p, ...patch } : p) });
  const removePhone = (id) => update({ phones: phones.filter(p => p.id !== id) });

  const addHistory = () => {
    if (!newHistoryText.trim()) return;
    update({ workHistory: [{ id: uid(), date: new Date().toISOString().slice(0, 10), text: newHistoryText.trim() }, ...workHistory] });
    setNewHistoryText("");
  };
  const removeHistory = (id) => update({ workHistory: workHistory.filter(h => h.id !== id) });

  const addPhoto = () => {
    if (!newPhotoUrl.trim()) return;
    update({ photos: [...photos, toDirectImageUrl(newPhotoUrl)] });
    setNewPhotoUrl("");
  };
  const uploadPhotoFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setUploadError(""); setUploadingPhoto(true);
    try {
      const path = `vendors/${vendor.id}/photos/${Date.now()}_${file.name}`;
      const ref = window.__storage.ref().child(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      update({ photos: [...photos, { url, storagePath: path }] });
    } catch (err) { setUploadError("Upload failed: " + err.message); }
    setUploadingPhoto(false);
  };
  const removePhoto = (i) => {
    const target = photos[i];
    if (target && typeof target === "object" && target.storagePath) window.__storage.ref().child(target.storagePath).delete().catch(() => {});
    update({ photos: photos.filter((_, idx) => idx !== i) });
    setPhotoIdx(0);
  };
  const addDoc = () => {
    if (!newDocUrl.trim() || documents.length >= 6) return;
    update({ documents: [...documents, { id: uid(), label: newDocLabel.trim() || "Document", url: newDocUrl.trim() }] });
    setNewDocLabel(""); setNewDocUrl("");
  };
  const uploadDocFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || documents.length >= 6) return;
    setUploadError(""); setUploadingDoc(true);
    try {
      const path = `vendors/${vendor.id}/documents/${Date.now()}_${file.name}`;
      const ref = window.__storage.ref().child(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      update({ documents: [...documents, { id: uid(), label: newDocLabel.trim() || file.name, url, storagePath: path }] });
      setNewDocLabel("");
    } catch (err) { setUploadError("Upload failed: " + err.message); }
    setUploadingDoc(false);
  };
  const removeDoc = (id) => {
    const target = documents.find(d => d.id === id);
    if (target && target.storagePath) window.__storage.ref().child(target.storagePath).delete().catch(() => {});
    update({ documents: documents.filter(d => d.id !== id) });
  };

  return (
    <div>
      <button className="beo-btn beo-btn-ghost" onClick={onBack} style={{ marginBottom: 16 }}>← Back to Vendors & Artists</button>
      <div className="builder-col">
        <div>
          <div className="beo-card" style={{ padding: 20, marginBottom: 16 }}>
            <input className="beo-input beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 8, border: "none", padding: "4px 0" }} value={vendor.name} onChange={e => update({ name: e.target.value })} />
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Category</label>
            <select className="beo-input" value={vendor.category} onChange={e => update({ category: e.target.value })} style={{ marginTop: 4, marginBottom: 12, maxWidth: 220 }}>
              {VENDOR_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Office Location</label>
            <input className="beo-input" value={vendor.officeLocation || ""} onChange={e => update({ officeLocation: e.target.value })} style={{ marginTop: 4, marginBottom: 12 }} />
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Where we met</label>
            <input className="beo-input" value={vendor.metNote || ""} onChange={e => update({ metNote: e.target.value })} style={{ marginTop: 4, marginBottom: 12 }} placeholder="e.g. Referred by Elegant Planner, met at a wedding in March" />
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Costing</label>
            <textarea className="beo-input" rows={3} value={vendor.costing || ""} onChange={e => update({ costing: e.target.value })} style={{ marginTop: 4, resize: "vertical", fontFamily: "inherit" }} placeholder="e.g. ₹25,000 for a 2-hour anchoring slot, ₹40,000 for full-day" />
          </div>

          <div className="beo-card" style={{ padding: 20, marginBottom: 16 }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Photos ({photos.length})</div>
            {photos.length > 0 ? (
              <div style={{ marginBottom: 12 }}>
                <div style={{ position: "relative", width: "100%", height: 220, borderRadius: 8, overflow: "hidden", background: "#F1EADA" }}>
                  <img src={photoUrl(photos[photoIdx])} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={e => e.target.style.opacity = 0.2} />
                  {photos.length > 1 && (
                    <React.Fragment>
                      <button onClick={() => setPhotoIdx((photoIdx - 1 + photos.length) % photos.length)} style={{ position: "absolute", left: 8, top: "50%", transform: "translateY(-50%)", background: "rgba(0,0,0,0.5)", color: "#fff", border: "none", borderRadius: "50%", width: 32, height: 32, cursor: "pointer" }}>‹</button>
                      <button onClick={() => setPhotoIdx((photoIdx + 1) % photos.length)} style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", background: "rgba(0,0,0,0.5)", color: "#fff", border: "none", borderRadius: "50%", width: 32, height: 32, cursor: "pointer" }}>›</button>
                    </React.Fragment>
                  )}
                  <span onClick={() => removePhoto(photoIdx)} style={{ position: "absolute", top: 8, right: 8, background: "rgba(0,0,0,0.55)", color: "#fff", borderRadius: 6, padding: "3px 8px", fontSize: 11, cursor: "pointer" }}>Remove</span>
                </div>
              </div>
            ) : <div style={{ color: "#a39a89", fontSize: 13, marginBottom: 12 }}>No photos yet.</div>}
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
              <label className="beo-btn beo-btn-primary" style={{ cursor: uploadingPhoto ? "default" : "pointer", opacity: uploadingPhoto ? 0.6 : 1 }}>
                {uploadingPhoto ? "Uploading…" : "⬆ Upload from PC"}
                <input type="file" accept="image/*" onChange={uploadPhotoFile} disabled={uploadingPhoto} style={{ display: "none" }} />
              </label>
              <span style={{ fontSize: 11.5, color: "#a39a89" }}>or paste a link below</span>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <input className="beo-input" placeholder="https://…" value={newPhotoUrl} onChange={e => setNewPhotoUrl(e.target.value)} onKeyDown={e => e.key === "Enter" && addPhoto()} />
              <button className="beo-btn beo-btn-gold" onClick={addPhoto}>＋ Add</button>
            </div>
          </div>

          <div className="beo-card" style={{ padding: 20 }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Documents ({documents.length}/6)</div>
            {documents.length === 0 && <div style={{ color: "#a39a89", fontSize: 13, marginBottom: 10 }}>No documents yet.</div>}
            {documents.map(d => (
              <div key={d.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 4px", borderTop: "1px solid #F1EADA", fontSize: 13.5 }}>
                <a href={d.url} target="_blank" rel="noreferrer" style={{ color: "#6B1E23", fontWeight: 600, textDecoration: "none" }}>📄 {d.label}</a>
                <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={() => removeDoc(d.id)}>🗑</span>
              </div>
            ))}
            {documents.length < 6 && (
              <div style={{ marginTop: 12, paddingTop: 10, borderTop: "1px dashed #E4DCC8" }}>
                <input className="beo-input" placeholder="Label" value={newDocLabel} onChange={e => setNewDocLabel(e.target.value)} style={{ marginBottom: 8 }} />
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
                  <label className="beo-btn beo-btn-primary" style={{ cursor: uploadingDoc ? "default" : "pointer", opacity: uploadingDoc ? 0.6 : 1 }}>
                    {uploadingDoc ? "Uploading…" : "⬆ Upload from PC"}
                    <input type="file" onChange={uploadDocFile} disabled={uploadingDoc} style={{ display: "none" }} />
                  </label>
                  <span style={{ fontSize: 11.5, color: "#a39a89" }}>or paste a link below</span>
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input className="beo-input" placeholder="https://…" value={newDocUrl} onChange={e => setNewDocUrl(e.target.value)} onKeyDown={e => e.key === "Enter" && addDoc()} />
                  <button className="beo-btn beo-btn-gold" onClick={addDoc}>＋</button>
                </div>
              </div>
            )}
            {uploadError && <div style={{ color: "#c9585d", fontSize: 12, marginTop: 10 }}>{uploadError}</div>}
          </div>
        </div>

        <div>
          <div className="beo-card" style={{ padding: 20, marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div className="beo-serif" style={{ fontSize: 20, fontWeight: 700, color: "#6B1E23" }}>Phone Numbers</div>
              <button className="beo-btn beo-btn-ghost" style={{ fontSize: 12 }} onClick={addPhone}>＋ Add</button>
            </div>
            {phones.length === 0 && <div style={{ color: "#a39a89", fontSize: 12.5 }}>None added.</div>}
            {phones.map(p => (
              <div key={p.id} style={{ marginBottom: 12, paddingBottom: 12, borderBottom: "1px solid #F1EADA" }}>
                <input className="beo-input" placeholder="Name / role" value={p.name} onChange={e => updatePhone(p.id, { name: e.target.value })} style={{ marginBottom: 6 }} />
                <input className="beo-input" placeholder="Phone number" value={p.phone} onChange={e => updatePhone(p.id, { phone: e.target.value })} style={{ marginBottom: 6 }} />
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  {p.phone ? <a href={waLink(p.phone)} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: "#2E7D32", fontWeight: 600, textDecoration: "none" }}>💬 WhatsApp</a> : <span />}
                  <span style={{ color: "#c98b8e", cursor: "pointer", fontSize: 12 }} onClick={() => removePhone(p.id)}>🗑 Remove</span>
                </div>
              </div>
            ))}
          </div>

          <div className="beo-card" style={{ padding: 20 }}>
            <div className="beo-serif" style={{ fontSize: 20, fontWeight: 700, color: "#6B1E23", marginBottom: 14 }}>Work History With Us</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
              <input className="beo-input" placeholder="e.g. Anchored the Sharma Sangeet, 12 March 2026" value={newHistoryText} onChange={e => setNewHistoryText(e.target.value)} onKeyDown={e => e.key === "Enter" && addHistory()} />
              <button className="beo-btn beo-btn-primary" onClick={addHistory}>＋</button>
            </div>
            {workHistory.length === 0 ? <div style={{ color: "#a39a89", fontSize: 12.5 }}>No history logged yet.</div> : workHistory.map(h => (
              <div key={h.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 4px", borderTop: "1px solid #F1EADA", fontSize: 12.5 }}>
                <div><b style={{ color: "#6B1E23" }}>{h.date}:</b> {h.text}</div>
                <span style={{ color: "#c98b8e", cursor: "pointer", marginLeft: 10 }} onClick={() => removeHistory(h.id)}>🗑</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

const getYoutubeEmbedUrl = (url) => {
  try {
    const u = new URL(url);
    let id = "";
    if (u.hostname.includes("youtu.be")) id = u.pathname.slice(1);
    else if (u.hostname.includes("youtube.com")) id = u.searchParams.get("v") || (u.pathname.includes("/shorts/") ? u.pathname.split("/shorts/")[1] : "");
    return id ? `https://www.youtube.com/embed/${id}` : null;
  } catch (e) { return null; }
};

function IdeaBoxView({ ideas, setIdeas, logActivity }) {

  const [title, setTitle] = useState("");
  const [description, setDescription] = useState("");
  const [imageUrlDraft, setImageUrlDraft] = useState("");
  const [linkDraft, setLinkDraft] = useState("");
  const [draftImages, setDraftImages] = useState([]);
  const [draftLinks, setDraftLinks] = useState([]);

  const addDraftImage = () => {
    if (!imageUrlDraft.trim()) return;
    setDraftImages(prev => [...prev, toDirectImageUrl(imageUrlDraft)]);
    setImageUrlDraft("");
  };
  const addDraftLink = () => {
    if (!linkDraft.trim()) return;
    setDraftLinks(prev => [...prev, linkDraft.trim()]);
    setLinkDraft("");
  };

  const submitIdea = () => {
    if (!title.trim()) return;
    const idea = {
      id: uid(), submittedBy: submittedBy.trim() || "Anonymous", title: title.trim(), description: description.trim(),
      images: draftImages, links: draftLinks, createdAt: Date.now()
    };
    setIdeas(prev => [idea, ...prev]);
    if (logActivity) logActivity(`Added an idea: "${idea.title}"`);
    setTitle(""); setDescription(""); setDraftImages([]); setDraftLinks([]);
  };
  const removeIdea = (id) => setIdeas(prev => prev.filter(i => i.id !== id));

  return (
    <div>
      <div className="beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 6 }}>💡 Idea Box</div>
      <div style={{ fontSize: 12.5, color: "#8a8071", marginBottom: 16 }}>Share an idea for the team — reference photos, YouTube/Instagram links, and a description.</div>

      <div className="beo-card" style={{ padding: 18, marginBottom: 20 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Add a new idea</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
          <input className="beo-input" placeholder="Your name" value={submittedBy} onChange={e => setSubmittedBy(e.target.value)} />
          <input className="beo-input" placeholder="Idea title" value={title} onChange={e => setTitle(e.target.value)} />
        </div>
        <textarea className="beo-input" rows={3} placeholder="Describe the idea…" value={description} onChange={e => setDescription(e.target.value)} style={{ marginBottom: 10, resize: "vertical", fontFamily: "inherit" }} />

        <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>

function DecorView({ decorFunctions, setDecorFunctions, onOpenTheme, logActivity }) {
  const [openFuncId, setOpenFuncId] = useState(decorFunctions[0]?.id || null);
  const [newFuncName, setNewFuncName] = useState("");
  const [newThemeName, setNewThemeName] = useState("");

  useEffect(() => { if ((!openFuncId || !decorFunctions.find(f => f.id === openFuncId)) && decorFunctions[0]) setOpenFuncId(decorFunctions[0].id); }, [decorFunctions]);

  const addFunction = () => {
    if (!newFuncName.trim()) return;
    const f = { id: uid(), name: newFuncName.trim(), themes: [] };
    setDecorFunctions(prev => [...prev, f]);
    if (logActivity) logActivity(`Added decor function "${f.name}"`);
    setNewFuncName(""); setOpenFuncId(f.id);
  };
  const removeFunction = (id) => setDecorFunctions(prev => prev.filter(f => f.id !== id));

  const addTheme = (funcId) => {
    if (!newThemeName.trim()) return;
    const t = { id: uid(), name: newThemeName.trim(), description: "", costMin: 0, costMax: 0, media: [] };
    setDecorFunctions(prev => prev.map(f => f.id === funcId ? { ...f, themes: [...f.themes, t] } : f));
    if (logActivity) logActivity(`Added decor theme "${t.name}"`);
    setNewThemeName("");
  };
  const removeTheme = (funcId, themeId) => setDecorFunctions(prev => prev.map(f => f.id === funcId ? { ...f, themes: f.themes.filter(t => t.id !== themeId) } : f));

  const openFunc = decorFunctions.find(f => f.id === openFuncId);

  return (
    <div className="two-col">
      <div className="beo-card" style={{ padding: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#8a8071", textTransform: "uppercase", marginBottom: 10 }}>Functions</div>
        {decorFunctions.map(f => (
          <div key={f.id} onClick={() => setOpenFuncId(f.id)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", borderRadius: 6, cursor: "pointer", background: openFuncId === f.id ? "#F1EADA" : "transparent", marginBottom: 2 }}>
            <span style={{ fontSize: 14 }}>📁 {f.name} <span style={{ fontSize: 11, color: "#a39a89" }}>({f.themes.length})</span></span>
            <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); removeFunction(f.id); }}>🗑</span>
          </div>

          <input className="beo-input" placeholder="New function (e.g. Haldi)" value={newFuncName} onChange={e => setNewFuncName(e.target.value)} onKeyDown={e => e.key === "Enter" && addFunction()} style={{ fontSize: 13 }} />

function DecorThemeDetail({ decorFunction, theme, onBack, onChange }) {
  const [uploading, setUploading] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const [lightboxIdx, setLightboxIdx] = useState(null);

  if (!theme) return null;
  const update = (patch) => onChange({ ...theme, ...patch });
  const media = theme.media || [];

  const uploadMedia = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    setUploadError(""); setUploading(true);
    try {
      const newItems = [];
      for (const file of files) {
        const type = file.type.startsWith("image/") ? "image" : file.type.startsWith("video/") ? "video" : "pdf";
        const path = `decor/${theme.id}/${Date.now()}_${file.name}`;
        const ref = window.__storage.ref().child(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        newItems.push({ id: uid(), type, url, storagePath: path, name: file.name });
      }
      update({ media: [...media, ...newItems] });
    } catch (err) { setUploadError("Upload failed: " + err.message); }
    setUploading(false);
  };
  const removeMedia = (id) => {
    const target = media.find(m => m.id === id);
    if (target && target.storagePath) window.__storage.ref().child(target.storagePath).delete().catch(() => {});
    update({ media: media.filter(m => m.id !== id) });
  };

  const images = media.filter(m => m.type === "image");

  return (
    <div>
      <button className="beo-btn beo-btn-ghost" onClick={onBack} style={{ marginBottom: 16 }}>← Back to {decorFunction ? decorFunction.name : "Decor"}</button>
      <div className="beo-card" style={{ padding: 20, marginBottom: 16 }}>
        <input className="beo-input beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 12, border: "none", padding: "4px 0" }} value={theme.name} onChange={e => update({ name: e.target.value })} />
        <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Description</label>
        <textarea className="beo-input" rows={3} value={theme.description || ""} onChange={e => update({ description: e.target.value })} style={{ marginTop: 4, marginBottom: 12, resize: "vertical", fontFamily: "inherit" }} />
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Cost from (₹)</label>
            <input className="beo-input" type="number" value={nz(theme.costMin)} onChange={e => update({ costMin: Number(e.target.value) || 0 })} style={{ marginTop: 4 }} />
          </div>
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Cost to (₹)</label>
            <input className="beo-input" type="number" value={nz(theme.costMax)} onChange={e => update({ costMax: Number(e.target.value) || 0 })} style={{ marginTop: 4 }} />
          </div>
        </div>
      </div>

      <div className="beo-card" style={{ padding: 20 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Media ({media.length})</div>
        {images.length > 0 && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
            {images.map((m, i) => (
              <img key={m.id} src={photoUrlOf(m)} alt="" onClick={() => setLightboxIdx(i)} style={{ width: 90, height: 90, objectFit: "cover", borderRadius: 8, cursor: "pointer" }} onError={e => e.target.style.opacity = 0.2} />
            ))}
          </div>
        )}
        {media.filter(m => m.type === "video").map(m => (
          <div key={m.id} style={{ marginBottom: 14 }}>
            <video src={m.url} controls style={{ width: "100%", maxWidth: 400, borderRadius: 8 }} />
          </div>
        ))}
        {media.filter(m => m.type === "pdf").map(m => (
          <div key={m.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 4px", borderTop: "1px solid #F1EADA", fontSize: 13.5 }}>
            <a href={m.url} target="_blank" rel="noreferrer" style={{ color: "#6B1E23", fontWeight: 600, textDecoration: "none" }}>📄 {m.name}</a>
            <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={() => removeMedia(m.id)}>🗑</span>
          </div>
        ))}
        {media.filter(m => m.type === "image").length > 0 && (
          <div style={{ marginBottom: 10 }}>
            {media.filter(m => m.type === "image").map(m => (
              <div key={"rm-" + m.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#8a8071", padding: "2px 0" }}>
                <span>{m.name || "Photo"}</span>
                <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={() => removeMedia(m.id)}>🗑 remove</span>
              </div>
            ))}
          </div>
        )}
        <label className="beo-btn beo-btn-primary" style={{ cursor: uploading ? "default" : "pointer", opacity: uploading ? 0.6 : 1 }}>
          {uploading ? "Uploading…" : "⬆ Upload photos, videos, or PDFs from PC"}
          <input type="file" accept="image/*,video/*,application/pdf" multiple onChange={uploadMedia} disabled={uploading} style={{ display: "none" }} />
        </label>
        {uploadError && <div style={{ color: "#c9585d", fontSize: 12, marginTop: 10 }}>{uploadError}</div>}
      </div>

      {lightboxIdx !== null && (
        <div onClick={() => setLightboxIdx(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 9999, cursor: "pointer" }}>
          <img src={photoUrlOf(images[lightboxIdx])} alt="" style={{ maxWidth: "90vw", maxHeight: "90vh", borderRadius: 8 }} />
        </div>
      )}
    </div>
  );
}

          <div key={m.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 4px", borderTop: "1px solid #F1EADA", fontSize: 13.5 }}>
            <a href={m.url} target="_blank" rel="noreferrer" style={{ color: "#6B1E23", fontWeight: 600, textDecoration: "none" }}>📄 {m.name}</a>
            <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={() => removeMedia(m.id)}>🗑</span>
          </div>
        ))}
        {images.length > 0 && (
          <div style={{ marginBottom: 10 }}>
            {images.map(m => (
              <div key={"rm-" + m.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#8a8071", padding: "2px 0" }}>
                <span>{m.name || "Photo"}</span>
                <span style={{ color: "#c98b8e", cursor: "pointer" }} onClick={() => removeMedia(m.id)}>🗑 remove</span>
              </div>
            ))}
          </div>
        )}
        <label className="beo-btn beo-btn-primary" style={{ cursor: uploading ? "default" : "pointer", opacity: uploading ? 0.6 : 1 }}>
          {uploading ? "Uploading…" : "⬆ Upload photos, videos, or PDFs from PC"}
          <input type="file" accept="image/*,video/*,application/pdf" multiple onChange={uploadMedia} disabled={uploading} style={{ display: "none" }} />
        </label>
        {uploadError && <div style={{ color: "#c9585d", fontSize: 12, marginTop: 10 }}>{uploadError}</div>}
      </div>

      {lightboxIdx !== null && (
        <div onClick={() => setLightboxIdx(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 9999, cursor: "pointer" }}>
          <img src={photoUrlOf(images[lightboxIdx])} alt="" style={{ maxWidth: "90vw", maxHeight: "90vh", borderRadius: 8 }} />
        </div>
      )}
    </div>
  );
}

function ProposalBuilder({ proposal, budgets, companySettings, onBack, onChange }) {
  const [uploadingHero, setUploadingHero] = useState(false);
  const [uploadingVenue, setUploadingVenue] = useState(false);
  const [uploadingDecor, setUploadingDecor] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const [generating, setGenerating] = useState(false);
  const [highlightDraft, setHighlightDraft] = useState("");

  if (!proposal) return null;
  const update = (patch) => onChange({ ...proposal, ...patch });

  const uploadSingle = async (e, pathPrefix, field, setUploading) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setUploadError(""); setUploading(true);
    try {
      const path = `${pathPrefix}/${proposal.id}/${Date.now()}_${file.name}`;
      const ref = window.__storage.ref().child(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      update({ [field]: url });
    } catch (err) { setUploadError("Upload failed: " + err.message); }
    setUploading(false);
  };

  const uploadGallery = async (e, pathPrefix, field, setUploading, captionField) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    setUploadError(""); setUploading(true);
    try {
      const current = proposal[field] || [];
      const newItems = [];
      for (const file of files) {
        const path = `${pathPrefix}/${proposal.id}/${Date.now()}_${file.name}`;
        const ref = window.__storage.ref().child(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        newItems.push({ id: uid(), url, storagePath: path, caption: "" });
      }
      update({ [field]: [...current, ...newItems] });
    } catch (err) { setUploadError("Upload failed: " + err.message); }
    setUploading(false);
  };

  const removeGalleryItem = (field, id) => {
    const item = (proposal[field] || []).find(x => x.id === id);
    if (item && item.storagePath) window.__storage.ref().child(item.storagePath).delete().catch(() => {});
    update({ [field]: (proposal[field] || []).filter(x => x.id !== id) });
  };
  const updateGalleryCaption = (field, id, caption) => {
    update({ [field]: (proposal[field] || []).map(x => x.id === id ? { ...x, caption } : x) });
  };

  // Facilities
  const legacyHighlights = proposal.legacyHighlights || [];
  const addHighlight = () => { if (!highlightDraft.trim()) return; update({ legacyHighlights: [...legacyHighlights, highlightDraft.trim()] }); setHighlightDraft(""); };
  const removeHighlight = (idx) => update({ legacyHighlights: legacyHighlights.filter((_, i) => i !== idx) });

  const facilities = proposal.venueFacilities || [];
  const addFacility = () => update({ venueFacilities: [...facilities, { id: uid(), label: "", detail: "" }] });
  const updateFacility = (id, patch) => update({ venueFacilities: facilities.map(f => f.id === id ? { ...f, ...patch } : f) });
  const removeFacility = (id) => update({ venueFacilities: facilities.filter(f => f.id !== id) });

  // Programme
  const programme = proposal.programme || [];
  const addProgrammeItem = () => update({ programme: [...programme, { id: uid(), time: "", title: "", description: "" }] });
  const updateProgrammeItem = (id, patch) => update({ programme: programme.map(x => x.id === id ? { ...x, ...patch } : x) });
  const removeProgrammeItem = (id) => update({ programme: programme.filter(x => x.id !== id) });

  // Menus
  const makeMenuHandlers = (field) => {
    const items = proposal[field] || [];
    return {
      items,
      add: (text) => { if (!text.trim()) return; update({ [field]: [...items, text.trim()] }); },
      remove: (idx) => update({ [field]: items.filter((_, i) => i !== idx) })
    };
  };
  const breakfastH = makeMenuHandlers("menuBreakfast");
  const lunchH = makeMenuHandlers("menuLunch");
  const dinnerH = makeMenuHandlers("menuDinner");
  const [menuDraft, setMenuDraft] = useState({ menuBreakfast: "", menuLunch: "", menuDinner: "" });

  // Delivery schedule
  const deliverySchedule = proposal.deliverySchedule || [];
  const addDelivery = () => update({ deliverySchedule: [...deliverySchedule, { id: uid(), date: "", item: "" }] });
  const updateDelivery = (id, patch) => update({ deliverySchedule: deliverySchedule.map(x => x.id === id ? { ...x, ...patch } : x) });
  const removeDelivery = (id) => update({ deliverySchedule: deliverySchedule.filter(x => x.id !== id) });

  // Payment schedule
  const paymentSchedule = proposal.paymentSchedule || [];
  const addPayment = () => update({ paymentSchedule: [...paymentSchedule, { id: uid(), percent: 0, label: "" }] });
  const updatePaymentRow = (id, patch) => update({ paymentSchedule: paymentSchedule.map(x => x.id === id ? { ...x, ...patch } : x) });
  const removePaymentRow = (id) => update({ paymentSchedule: paymentSchedule.filter(x => x.id !== id) });

  const linkedBudget = budgets.find(b => b.id === proposal.linkedBudgetId);
  const linkedBudgetFin = linkedBudget ? computeBudgetFinancials(linkedBudget) : null;

  const handleGenerate = async () => {
    setGenerating(true);
    try {
      const result = await window.generateProposalPdf(proposal, companySettings, linkedBudget, linkedBudgetFin);
      if (result && result.loadErrors && result.loadErrors.length > 0) {
        alert("PDF generated, but some images couldn't be loaded and were skipped:\n\n" + result.loadErrors.join("\n"));
      }
    } catch (err) {
      alert("Could not generate the proposal PDF: " + err.message);
    }
    setGenerating(false);
  };

  const sectionCard = (title, children) => (
    <div className="beo-card" style={{ padding: 20, marginBottom: 16 }}>
      <div className="beo-serif" style={{ fontSize: 18, fontWeight: 700, color: "#6B1E23", marginBottom: 12 }}>{title}</div>
      {children}
    </div>
  );

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <button className="beo-btn beo-btn-ghost" onClick={onBack}>← Back to Proposals</button>
        <button className="beo-btn beo-btn-gold" disabled={generating} onClick={handleGenerate}>{generating ? "Generating…" : "✦ Generate Proposal PDF"}</button>
      </div>
      {uploadError && <div style={{ color: "#c9585d", fontSize: 12, marginBottom: 10 }}>{uploadError}</div>}
      {!companySettings.companyName && (
        <div style={{ background: "#FBE8CC", border: "1px solid #E4C48A", borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 12.5, color: "#6B4A1A" }}>
          ⚠ Your Company Settings aren't filled in yet — the PDF will show placeholder text like "Your Company" instead of your real name/logo. Open the ⋮ menu → <b>Company Settings</b> to set it up once (takes a minute, reused on every proposal).
        </div>
      )}

      {sectionCard("Basic Info", (
        <React.Fragment>
          <input className="beo-input beo-serif" style={{ fontSize: 18, fontWeight: 700, color: "#6B1E23", marginBottom: 10, border: "none", padding: "4px 0" }} value={proposal.title} onChange={e => update({ title: e.target.value })} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
            <input className="beo-input" placeholder="Bride's name" value={proposal.brideNam || ""} onChange={e => update({ brideNam: e.target.value })} />
            <input className="beo-input" placeholder="Groom's name" value={proposal.groomName || ""} onChange={e => update({ groomName: e.target.value })} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10 }}>
            <div><label style={{ fontSize: 11.5, color: "#8a8071" }}>Wedding Date</label><input className="beo-input" type="date" value={proposal.weddingDate || ""} onChange={e => update({ weddingDate: e.target.value })} style={{ marginTop: 4 }} /></div>
            <div><label style={{ fontSize: 11.5, color: "#8a8071" }}>Proposal Date</label><input className="beo-input" type="date" value={proposal.proposalDate || ""} onChange={e => update({ proposalDate: e.target.value })} style={{ marginTop: 4 }} /></div>
            <div><label style={{ fontSize: 11.5, color: "#8a8071" }}>Venue Name</label><input className="beo-input" value={proposal.venueName || ""} onChange={e => update({ venueName: e.target.value })} style={{ marginTop: 4 }} /></div>
            <div><label style={{ fontSize: 11.5, color: "#8a8071" }}>Client Contact</label><input className="beo-input" value={proposal.clientContact || ""} onChange={e => update({ clientContact: e.target.value })} style={{ marginTop: 4 }} /></div>
          </div>
        </React.Fragment>
      ))}

      {sectionCard("Cover Photo", (
        <React.Fragment>
