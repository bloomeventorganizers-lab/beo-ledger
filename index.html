              <textarea className="beo-input" placeholder="Description" value={item.description} onChange={e => updateProgrammeItem(item.id, { description: e.target.value })} style={{ gridColumn: "1 / span 3", fontSize: 12.5, resize: "vertical", fontFamily: "inherit" }} rows={2} />
            </div>
          ))}
          <button className="beo-btn beo-btn-ghost" style={{ fontSize: 12 }} onClick={addProgrammeItem}>＋ Add Programme Moment</button>
        </React.Fragment>
      ))}

      {sectionCard("Menus", (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}>
          {[{ label: "Breakfast", h: breakfastH, field: "menuBreakfast" }, { label: "Lunch", h: lunchH, field: "menuLunch" }, { label: "Dinner", h: dinnerH, field: "menuDinner" }].map(({ label, h, field }) => (
            <div key={field}>
              <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 6 }}>{label}</div>
              {h.items.map((it, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "2px 0" }}>
                  <span>{it}</span><span onClick={() => h.remove(i)} style={{ color: "#c98b8e", cursor: "pointer" }}>×</span>
                </div>
              ))}
              <div style={{ display: "flex", gap: 4, marginTop: 6 }}>
                <input className="beo-input" placeholder="Add item" value={menuDraft[field]} onChange={e => setMenuDraft(prev => ({ ...prev, [field]: e.target.value }))} onKeyDown={e => { if (e.key === "Enter") { h.add(menuDraft[field]); setMenuDraft(prev => ({ ...prev, [field]: "" })); } }} style={{ fontSize: 12, padding: "4px 6px" }} />
              </div>
            </div>
          ))}
        </div>
      ))}

      {sectionCard("Photography & Cinematography", (
        <React.Fragment>
          <textarea className="beo-input" rows={3} placeholder="Team & coverage description…" value={proposal.photographyText || ""} onChange={e => update({ photographyText: e.target.value })} style={{ marginBottom: 12, resize: "vertical", fontFamily: "inherit" }} />
          <div style={{ fontWeight: 600, fontSize: 13.5, marginBottom: 8 }}>Delivery Schedule</div>
          {deliverySchedule.map(d => (
            <div key={d.id} style={{ display: "grid", gridTemplateColumns: "140px 1fr 24px", gap: 6, marginBottom: 6 }}>
              <input className="beo-input" placeholder="Date" value={d.date} onChange={e => updateDelivery(d.id, { date: e.target.value })} style={{ fontSize: 12.5, padding: "5px 8px" }} />
              <input className="beo-input" placeholder="Item (e.g. Highlights Film)" value={d.item} onChange={e => updateDelivery(d.id, { item: e.target.value })} style={{ fontSize: 12.5, padding: "5px 8px" }} />
              <span onClick={() => removeDelivery(d.id)} style={{ color: "#c98b8e", cursor: "pointer", textAlign: "center" }}>🗑</span>
            </div>
          ))}
          <button className="beo-btn beo-btn-ghost" style={{ fontSize: 12 }} onClick={addDelivery}>＋ Add Delivery Item</button>
        </React.Fragment>
      ))}

      {sectionCard("Budget", (
        <React.Fragment>
          <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Link an existing Client Budget</label>
          <select className="beo-input" value={proposal.linkedBudgetId || ""} onChange={e => update({ linkedBudgetId: e.target.value })} style={{ marginTop: 4 }}>
            <option value="">— None selected —</option>
            {budgets.map(b => <option key={b.id} value={b.id}>{b.name} ({b.clientName || "no client"})</option>)}
          </select>
          {linkedBudget && linkedBudgetFin && (
            <div style={{ background: "#FAF6EE", borderRadius: 8, padding: 12, marginTop: 10, fontSize: 13 }}>
              This budget's full item breakdown and total ({inr(linkedBudgetFin.finalBudget)}) will be pulled into the proposal automatically.
            </div>
          )}
        </React.Fragment>
      ))}

      {sectionCard("Payment Schedule", (
        <React.Fragment>
          {paymentSchedule.map(p => (
            <div key={p.id} style={{ display: "grid", gridTemplateColumns: "80px 2fr 24px", gap: 6, marginBottom: 6 }}>
              <input className="beo-input" type="number" placeholder="%" value={nz(p.percent)} onChange={e => updatePaymentRow(p.id, { percent: Number(e.target.value) || 0 })} style={{ fontSize: 12.5, padding: "5px 8px" }} />
              <input className="beo-input" placeholder="e.g. Advance at booking confirmation" value={p.label} onChange={e => updatePaymentRow(p.id, { label: e.target.value })} style={{ fontSize: 12.5, padding: "5px 8px" }} />
              <span onClick={() => removePaymentRow(p.id)} style={{ color: "#c98b8e", cursor: "pointer", textAlign: "center" }}>🗑</span>
            </div>
          ))}
          <button className="beo-btn beo-btn-ghost" style={{ fontSize: 12 }} onClick={addPayment}>＋ Add Payment Milestone</button>
        </React.Fragment>
      ))}
    </div>
  );
}

function PublicMenuPreviewBody({ data }) {
  const [selections, setSelections] = useState({});
  const toggleItem = (section, itemName) => {
    setSelections(prev => {
      const current = prev[section.id] || [];
      const isSelected = current.includes(itemName);
      if (isSelected) return { ...prev, [section.id]: current.filter(n => n !== itemName) };
      if (section.selectLimit && current.length >= section.selectLimit) return prev;
      return { ...prev, [section.id]: [...current, itemName] };
    });
  };
  return (
    <div style={{ maxWidth: 660, margin: "0 auto", padding: "10px 20px" }}>
      <div className="beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", textAlign: "center", marginBottom: 4 }}>{data.name}</div>
      <div style={{ fontSize: 12, color: "#8a8071", textAlign: "center", marginBottom: 20 }}>Select your items below, then submit.</div>
      {(data.sections || []).map(s => {
        const current = selections[s.id] || [];
        return (
          <div key={s.id} className="beo-card" style={{ padding: 16, marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div className="beo-serif" style={{ fontSize: 15, fontWeight: 700, color: "#6B1E23" }}>{s.name}</div>
              <div style={{ fontSize: 11, color: current.length >= s.selectLimit ? "#2E7D32" : "#8a8071", fontWeight: 600 }}>{current.length} / {s.selectLimit} selected</div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 6 }}>
              {(s.items || []).map(it => {
                const checked = current.includes(it.name);
                const disabled = !checked && s.selectLimit && current.length >= s.selectLimit;
                return (
                  <label key={it.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, padding: "5px 6px", borderRadius: 6, background: checked ? "#F3EBD8" : "transparent", opacity: disabled ? 0.4 : 1 }}>
                    <input type="checkbox" checked={checked} disabled={disabled} onChange={() => toggleItem(s, it.name)} />
                    <span>{it.name}{s.isLiveCounter && it.price ? ` — ₹${it.price}/pax` : ""}</span>
                  </label>
                );
              })}
            </div>
          </div>
        );
      })}
      <div className="beo-card" style={{ padding: 16, marginBottom: 10 }}>
        <div style={{ fontWeight: 700, marginBottom: 6, fontSize: 13 }}>Suggestions / items not on this menu</div>
        <textarea className="beo-input" rows={2} disabled placeholder="Client can type custom requests here…" style={{ resize: "none", fontFamily: "inherit" }} />
      </div>
      <div style={{ textAlign: "center", fontSize: 11.5, color: "#a39a89" }}>(Preview only — this is exactly what your client will see and interact with.)</div>
    </div>
  );
}

function CateringListView({ templates, setTemplates, onOpen, logActivity }) {
  const [newName, setNewName] = useState("");

  const addTemplate = () => {
    if (!newName.trim()) return;
    const t = { id: uid(), name: newName.trim(), sections: [], shareId: "" };
    setTemplates(prev => [t, ...prev]);
    if (logActivity) logActivity(`Created catering menu template "${t.name}"`);
    setNewName("");
    onOpen(t.id);
  };
  const duplicateTemplate = (t) => {
    const copy = { ...t, id: uid(), name: t.name + " (copy)", shareId: "" };
    setTemplates(prev => [copy, ...prev]);
  };
  const removeTemplate = (id) => setTemplates(prev => prev.filter(t => t.id !== id));

  return (
    <div>
      <div className="beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23", marginBottom: 6 }}>🍽️ Catering Menus</div>
      <div style={{ fontSize: 12.5, color: "#8a8071", marginBottom: 16 }}>Build named menu templates (Premium, Standard, etc.) and share a link so clients can select items directly.</div>

      <div className="beo-card" style={{ padding: 14, marginBottom: 18, display: "flex", gap: 8 }}>
        <input className="beo-input" placeholder="New template name (e.g. Premium Menu)" value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === "Enter" && addTemplate()} />
        <button className="beo-btn beo-btn-primary" onClick={addTemplate}>＋ Add</button>
      </div>

      {templates.length === 0 ? (
        <div className="beo-card" style={{ padding: 30, textAlign: "center", color: "#a39a89" }}>No menu templates yet.</div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 14 }}>
          {templates.map(t => (
            <div key={t.id} className="beo-card" style={{ padding: 16, cursor: "pointer", position: "relative" }} onClick={() => onOpen(t.id)}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{t.name}</div>
              <div style={{ fontSize: 12, color: "#8a8071", marginTop: 4 }}>{(t.sections || []).length} section{(t.sections || []).length === 1 ? "" : "s"}</div>
              {t.shareId && <div style={{ fontSize: 11, color: "#2E7D32", marginTop: 4 }}>🔗 Shared</div>}
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button className="beo-btn beo-btn-ghost" style={{ fontSize: 11 }} onClick={(e) => { e.stopPropagation(); duplicateTemplate(t); }}>Duplicate</button>
                <button className="beo-btn beo-btn-ghost" style={{ fontSize: 11, color: "#c9585d" }} onClick={(e) => { e.stopPropagation(); removeTemplate(t.id); }}>Delete</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CateringTemplateDetail({ template, budgets, setBudgets, onBack, onChange }) {
  const [newSectionName, setNewSectionName] = useState("");
  const [itemDraft, setItemDraft] = useState({});
  const [priceDraft, setPriceDraft] = useState({});
  const [bulkDraft, setBulkDraft] = useState({});
  const [bulkOpenFor, setBulkOpenFor] = useState(null);
  const [sharing, setSharing] = useState(false);
  const [responses, setResponses] = useState([]);
  const [responsesLoading, setResponsesLoading] = useState(true);
  const [previewOpen, setPreviewOpen] = useState(false);
  const [compareMode, setCompareMode] = useState(false);
  const [addToBudgetFor, setAddToBudgetFor] = useState(null);
  const [budgetPickerId, setBudgetPickerId] = useState("");

  useEffect(() => {
    if (!template || !template.shareId) { setResponses([]); setResponsesLoading(false); return; }
    setResponsesLoading(true);
    const unsub = db.collection("menuResponses").where("templateShareId", "==", template.shareId).onSnapshot(snap => {
      const list = [];
      snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
      list.sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
      setResponses(list);
      setResponsesLoading(false);
    }, () => setResponsesLoading(false));
    return unsub;
  }, [template && template.shareId]);

  if (!template) return null;
  const update = (patch) => onChange({ ...template, ...patch });
  const sections = template.sections || [];

  const addSection = () => {
    if (!newSectionName.trim()) return;
    update({ sections: [...sections, { id: uid(), name: newSectionName.trim(), selectLimit: 1, isLiveCounter: false, items: [] }] });
    setNewSectionName("");
  };
  const updateSection = (id, patch) => update({ sections: sections.map(s => s.id === id ? { ...s, ...patch } : s) });
  const removeSection = (id) => update({ sections: sections.filter(s => s.id !== id) });
  const duplicateSection = (s) => {
    const copy = { ...s, id: uid(), name: s.name + " (copy)", items: s.items.map(i => ({ ...i, id: uid() })) };
    const idx = sections.findIndex(x => x.id === s.id);
    const newSections = [...sections];
    newSections.splice(idx + 1, 0, copy);
    update({ sections: newSections });
  };

  const addItem = (sectionId) => {
    const name = (itemDraft[sectionId] || "").trim();
    if (!name) return;
    const price = Number(priceDraft[sectionId]) || 0;
    update({ sections: sections.map(s => s.id === sectionId ? { ...s, items: [...s.items, { id: uid(), name, price }] } : s) });
    setItemDraft(prev => ({ ...prev, [sectionId]: "" }));
    setPriceDraft(prev => ({ ...prev, [sectionId]: "" }));
  };
  const removeItem = (sectionId, itemId) => {
    update({ sections: sections.map(s => s.id === sectionId ? { ...s, items: s.items.filter(i => i.id !== itemId) } : s) });
  };

  const addBulkItems = (sectionId) => {
    const text = bulkDraft[sectionId] || "";
    // Split on newlines or commas, trim, drop empties, drop exact duplicates already in the section
    const existing = new Set((sections.find(s => s.id === sectionId)?.items || []).map(i => i.name.trim().toLowerCase()));
    const names = text.split(/[\n,]+/).map(n => n.trim()).filter(n => n && !existing.has(n.toLowerCase()));
    if (names.length === 0) return;
    const newItems = names.map(name => ({ id: uid(), name, price: 0 }));
    update({ sections: sections.map(s => s.id === sectionId ? { ...s, items: [...s.items, ...newItems] } : s) });
    setBulkDraft(prev => ({ ...prev, [sectionId]: "" }));
    setBulkOpenFor(null);
  };

  const addResponseToBudget = (response, budgetId) => {
    if (!budgetId) return;
    const budget = budgets.find(b => b.id === budgetId);
    if (!budget) return;
    const lines = [];
    Object.entries(response.selections || {}).forEach(([sectionName, items]) => {
      items.forEach(itemName => lines.push({ id: uid(), itemRef: uid(), category: "Catering", name: `${itemName} (${sectionName})`, cost: 0, qty: 1 }));
    });
    if (response.suggestions) lines.push({ id: uid(), itemRef: uid(), category: "Catering", name: `Client suggestion: ${response.suggestions}`, cost: 0, qty: 1 });
    if (lines.length === 0) { alert("No selected items to add."); return; }
    const newDay = { id: uid(), date: budget.date || "", label: `Catering — ${response.clientName || "Client"}`, events: [{ id: uid(), name: "Catering Selection", time: "", lines }] };
    const updatedBudget = { ...budget, days: [...(budget.days || []), newDay] };
    setBudgets(prev => prev.map(b => b.id === budgetId ? updatedBudget : b));
    setAddToBudgetFor(null);
    setBudgetPickerId("");
    alert(`Added to "${budget.name}" as a new day. You can edit costs/quantities there.`);
  };

  const paxCount = Number(template.paxCount) || 0;
  const liveCounterTotal = sections.filter(s => s.isLiveCounter).reduce((sum, s) => sum + s.items.reduce((s2, it) => s2 + (Number(it.price) || 0) * paxCount, 0), 0);

  const getOrCreateShareLink = async () => {
    setSharing(true);
    const id = template.shareId || uid();
    try {
      await db.collection("publicMenus").doc(id).set({
        name: template.name,
        sections: sections.map(s => ({ id: s.id, name: s.name, selectLimit: s.selectLimit, isLiveCounter: !!s.isLiveCounter, items: s.items })),
        updatedAt: Date.now()
      });
      if (!template.shareId) update({ shareId: id });
      setSharing(false);
      return `${window.location.origin}${window.location.pathname}?menu=${id}`;
    } catch (e) {
      setSharing(false);
      alert("Could not create share link: " + e.message);
      return null;
    }
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <button className="beo-btn beo-btn-ghost" onClick={onBack}>← Back to Catering Menus</button>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className="beo-btn beo-btn-ghost" onClick={() => setPreviewOpen(true)}>👁 Preview as Client</button>
          <button
            className="beo-btn beo-btn-gold"
            disabled={sharing}
            onClick={async () => {
              const url = await getOrCreateShareLink();
              if (url) { navigator.clipboard.writeText(url); alert("Shareable link copied to clipboard:\n\n" + url); }
            }}
          >{sharing ? "Generating…" : "🔗 Get / Update Shareable Link"}</button>
        </div>
      </div>

      <div className="beo-card" style={{ padding: 20, marginBottom: 16 }}>
        <input className="beo-input beo-serif" style={{ fontSize: 20, fontWeight: 700, color: "#6B1E23", border: "none", padding: "4px 0" }} value={template.name} onChange={e => update({ name: e.target.value })} />
        {template.shareId && <div style={{ fontSize: 11.5, color: "#8a8071", marginTop: 6, marginBottom: 10 }}>Note: if you edit sections/items after sharing, click "Get / Update Shareable Link" again to push the changes to the live link.</div>}
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 12 }}>
          <label style={{ fontSize: 12, fontWeight: 600, color: "#8a8071" }}>Pax count</label>
          <input className="beo-input" type="number" value={nz(template.paxCount)} onChange={e => update({ paxCount: Number(e.target.value) || 0 })} style={{ width: 100 }} />
          {paxCount > 0 && liveCounterTotal > 0 && (
            <div style={{ fontSize: 12.5, color: "#2E7D32", fontWeight: 600 }}>Live counter total: {inr(liveCounterTotal)} (all live counters × {paxCount} pax)</div>
          )}
        </div>
      </div>

      {sections.map(s => (
        <div key={s.id} className="beo-card" style={{ padding: 18, marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
            <input className="beo-input" value={s.name} onChange={e => updateSection(s.id, { name: e.target.value })} style={{ flex: "1 1 160px", fontWeight: 700 }} />
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <label style={{ fontSize: 11.5, color: "#8a8071" }}>Select</label>
              <input className="beo-input" type="number" value={nz(s.selectLimit)} onChange={e => updateSection(s.id, { selectLimit: Number(e.target.value) || 0 })} style={{ width: 60, padding: "5px 6px" }} />
            </div>
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
              <input type="checkbox" checked={!!s.isLiveCounter} onChange={e => updateSection(s.id, { isLiveCounter: e.target.checked })} /> Live counter (paid per pax)
            </label>
            <button className="beo-btn beo-btn-ghost" style={{ fontSize: 11 }} onClick={() => duplicateSection(s)}>Duplicate</button>
            <button className="beo-btn beo-btn-ghost" style={{ fontSize: 11, color: "#c9585d" }} onClick={() => removeSection(s.id)}>Delete section</button>
          </div>

          {s.items.length === 0 ? (
            <div style={{ color: "#a39a89", fontSize: 12.5, marginBottom: 10 }}>No items yet.</div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: s.isLiveCounter ? "1fr 90px 24px" : "1fr 24px", gap: 8, marginBottom: 10 }}>
              {s.items.map(it => (
                <React.Fragment key={it.id}>
                  <div style={{ fontSize: 13, padding: "4px 0" }}>{it.name}</div>
                  {s.isLiveCounter && <div style={{ fontSize: 12, color: "#8a8071" }}>{inr(it.price)}/pax</div>}
                  <span onClick={() => removeItem(s.id, it.id)} style={{ color: "#c98b8e", cursor: "pointer" }}>🗑</span>
                </React.Fragment>
              ))}
            </div>
          )}
          <div style={{ display: "flex", gap: 6 }}>
            <input className="beo-input" placeholder="New item name" value={itemDraft[s.id] || ""} onChange={e => setItemDraft(prev => ({ ...prev, [s.id]: e.target.value }))} onKeyDown={e => e.key === "Enter" && addItem(s.id)} />
            {s.isLiveCounter && <input className="beo-input" type="number" placeholder="₹/pax" value={priceDraft[s.id] || ""} onChange={e => setPriceDraft(prev => ({ ...prev, [s.id]: e.target.value }))} style={{ width: 90 }} />}
            <button className="beo-btn beo-btn-primary" onClick={() => addItem(s.id)}>＋</button>
            <button className="beo-btn beo-btn-ghost" style={{ fontSize: 12, whiteSpace: "nowrap" }} onClick={() => setBulkOpenFor(bulkOpenFor === s.id ? null : s.id)}>📋 Paste multiple</button>
          </div>
          {bulkOpenFor === s.id && (
            <div style={{ marginTop: 8 }}>
              <textarea
                className="beo-input"
                rows={4}
                placeholder={"Paste a whole list here — one item per line, or comma-separated:\n\nखस्ता कचौड़ी (दाल)\nखस्ता कचौड़ी (मटर)\nदाल बेड़ई"}
                value={bulkDraft[s.id] || ""}
                onChange={e => setBulkDraft(prev => ({ ...prev, [s.id]: e.target.value }))}
                style={{ resize: "vertical", fontFamily: "inherit", marginBottom: 8 }}
              />
              <button className="beo-btn beo-btn-primary" onClick={() => addBulkItems(s.id)}>＋ Add all lines as items</button>
            </div>
          )}
        </div>
      ))}

      <div className="beo-card" style={{ padding: 14, marginBottom: 20, display: "flex", gap: 8 }}>
        <input className="beo-input" placeholder="New section name (e.g. Starters)" value={newSectionName} onChange={e => setNewSectionName(e.target.value)} onKeyDown={e => e.key === "Enter" && addSection()} />
        <button className="beo-btn beo-btn-primary" onClick={addSection}>＋ Add Section</button>
      </div>

      {template.shareId && (
        <div className="beo-card" style={{ padding: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
            <div className="beo-serif" style={{ fontSize: 18, fontWeight: 700, color: "#6B1E23" }}>Client Selections</div>
            {responses.length > 1 && (
              <button className="beo-btn beo-btn-ghost" style={{ fontSize: 12 }} onClick={() => setCompareMode(!compareMode)}>{compareMode ? "☰ List View" : "⇄ Compare Side-by-Side"}</button>
            )}
          </div>
          {responsesLoading ? (
            <div style={{ color: "#a39a89", fontSize: 13 }}>Loading…</div>
          ) : responses.length === 0 ? (
            <div style={{ color: "#a39a89", fontSize: 13 }}>No submissions yet. Once a client submits their selection through the shared link, it'll appear here.</div>
          ) : compareMode ? (
            <div style={{ overflowX: "auto" }}>
              <table style={{ borderCollapse: "collapse", width: "100%", fontSize: 12.5 }}>
                <thead>
                  <tr>
                    <th style={{ textAlign: "left", padding: "6px 10px", borderBottom: "2px solid #E4DCC8", whiteSpace: "nowrap" }}>Section</th>
                    {responses.map(r => (
                      <th key={r.id} style={{ textAlign: "left", padding: "6px 10px", borderBottom: "2px solid #E4DCC8", whiteSpace: "nowrap" }}>{r.clientName || "Unnamed"}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {sections.map(s => (
                    <tr key={s.id}>
                      <td style={{ padding: "6px 10px", borderBottom: "1px solid #F1EADA", fontWeight: 600, whiteSpace: "nowrap" }}>{s.name}</td>
                      {responses.map(r => (
                        <td key={r.id} style={{ padding: "6px 10px", borderBottom: "1px solid #F1EADA" }}>{(r.selections && r.selections[s.name] || []).join(", ") || "—"}</td>
                      ))}
                    </tr>
                  ))}
                  <tr>
                    <td style={{ padding: "6px 10px", fontWeight: 600 }}>Suggestions</td>
                    {responses.map(r => (
                      <td key={r.id} style={{ padding: "6px 10px", fontStyle: "italic", color: "#6B1E23" }}>{r.suggestions || "—"}</td>
                    ))}
                  </tr>
                </tbody>
              </table>
            </div>
          ) : responses.map(r => (
            <div key={r.id} style={{ padding: "12px 0", borderTop: "1px solid #F1EADA" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{r.clientName || "Unnamed client"}</div>
                  <div style={{ fontSize: 11.5, color: "#8a8071" }}>{r.submittedAt ? new Date(r.submittedAt).toLocaleString("en-IN") : ""}</div>
                </div>
                <button className="beo-btn beo-btn-ghost" style={{ fontSize: 11.5 }} onClick={() => setAddToBudgetFor(addToBudgetFor === r.id ? null : r.id)}>💰 Add to Client Budget</button>
              </div>
              {addToBudgetFor === r.id && (
                <div style={{ display: "flex", gap: 6, margin: "8px 0", flexWrap: "wrap" }}>
                  <select className="beo-input" value={budgetPickerId} onChange={e => setBudgetPickerId(e.target.value)} style={{ flex: "1 1 200px" }}>
                    <option value="">— Choose a budget —</option>
                    {(budgets || []).map(b => <option key={b.id} value={b.id}>{b.name} ({b.clientName || "no client"})</option>)}
                  </select>
                  <button className="beo-btn beo-btn-primary" style={{ fontSize: 12 }} onClick={() => addResponseToBudget(r, budgetPickerId)}>Add as new day</button>
                </div>
              )}
              <div style={{ marginTop: 6 }}>
                {Object.entries(r.selections || {}).map(([sectionName, items]) => (
                  items.length > 0 && <div key={sectionName} style={{ fontSize: 12.5, marginBottom: 3 }}><b>{sectionName}:</b> {items.join(", ")}</div>
                ))}
                {r.suggestions && <div style={{ fontSize: 12.5, marginTop: 6, fontStyle: "italic", color: "#6B1E23" }}>Suggestions: {r.suggestions}</div>}
              </div>
            </div>
          ))}
        </div>
      )}

      {previewOpen && (
        <div onClick={() => setPreviewOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
          <div onClick={(e) => e.stopPropagation()} className="beo-card" style={{ padding: 0, maxWidth: 760, width: "100%", maxHeight: "88vh", overflowY: "auto", position: "relative" }}>
            <div style={{ position: "sticky", top: 0, background: "#fff", padding: "12px 20px", borderBottom: "1px solid #EDE6D6", display: "flex", justifyContent: "space-between", alignItems: "center", zIndex: 1 }}>
              <span style={{ fontWeight: 700, fontSize: 13 }}>Preview — this is what the client sees</span>
              <span onClick={() => setPreviewOpen(false)} style={{ cursor: "pointer", fontSize: 18 }}>×</span>
            </div>
            <div style={{ padding: "10px 0 30px" }}>
              <PublicMenuPreviewBody data={{ name: template.name, sections }} />
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function QuotesListView({ quotes, setQuotes, onOpen, onCreate, cities }) {
  const removeQuote = (id) => setQuotes(prev => prev.filter(q => q.id !== id));
  const hotelName = (q) => {
    const c = cities.find(c => c.id === q.cityId);
    const h = c && c.hotels.find(h => h.id === q.hotelId);
    return h ? h.name : "No hotel selected";
  };
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, flexWrap: "wrap", gap: 10 }}>
        <div className="beo-serif" style={{ fontSize: 22, fontWeight: 700, color: "#6B1E23" }}>Corporate Quotes</div>
        <button className="beo-btn beo-btn-primary" onClick={onCreate}>＋ New corporate quote</button>
      </div>
      {quotes.length === 0 ? (
        <div className="beo-card" style={{ padding: 30, textAlign: "center", color: "#a39a89" }}>No corporate quotes yet.</div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 14 }}>
          {quotes.map(q => (
            <div key={q.id} className="beo-card" style={{ padding: 16, cursor: "pointer" }} onClick={() => onOpen(q.id)}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>{q.name}</div>
              <div style={{ fontSize: 12, color: "#8a8071", marginTop: 2 }}>{q.clientName || "No client name"} · {q.date}</div>
              <div style={{ fontSize: 12.5, color: "#6B1E23", marginTop: 8 }}>🏨 {hotelName(q)}</div>
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <button className="beo-btn beo-btn-ghost" style={{ color: "#c9585d" }} onClick={(e) => { e.stopPropagation(); removeQuote(q.id); }}>Delete</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CorporateQuoteBuilder({ quote, cities, onBack, onChange }) {
  const [sharing, setSharing] = useState(false);
  if (!quote) return null;
  const update = (patch) => onChange({ ...quote, ...patch });

  const city = cities.find(c => c.id === quote.cityId);
  const hotel = city && city.hotels.find(h => h.id === quote.hotelId);

  const rooms = quote.rooms || { qty: 0, rate: 0, nights: 1 };
  const banquet = quote.banquet || { mode: "flat", pax: 0, rate: 0 };
  const extraLines = quote.extraLines || [];

  const roomsTotal = (Number(rooms.qty) || 0) * (Number(rooms.rate) || 0) * (Number(rooms.nights) || 0);
  const banquetTotal = banquet.mode === "perPax" ? (Number(banquet.pax) || 0) * (Number(banquet.rate) || 0) : (Number(banquet.rate) || 0);
  const extraTotal = extraLines.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.rate) || 0), 0);
  const baseCost = roomsTotal + banquetTotal + extraTotal;

  const profit = Number(quote.profit) || 0;
  const commissionPct = Number(quote.commissionPercent) || 0;
  const mode = quote.commissionMode || "final";
  let finalBudget, commissionAmount;
  if (mode === "final") {
    if (commissionPct >= 100) { finalBudget = Infinity; commissionAmount = Infinity; }
    else { finalBudget = (baseCost + profit) / (1 - commissionPct / 100); commissionAmount = finalBudget * (commissionPct / 100); }
  } else {
    commissionAmount = baseCost * (commissionPct / 100);
    finalBudget = baseCost + profit + commissionAmount;
  }

  const addExtraLine = () => update({ extraLines: [...extraLines, { id: uid(), label: "", qty: 1, rate: 0 }] });
  const updateExtraLine = (id, patch) => update({ extraLines: extraLines.map(l => l.id === id ? { ...l, ...patch } : l) });
  const removeExtraLine = (id) => update({ extraLines: extraLines.filter(l => l.id !== id) });

  const selectCity = (cityId) => update({ cityId, hotelId: "" });
  const selectHotel = (hotelId) => update({ hotelId });
  const currency = quote.currency || "₹";
  const cur = (n) => fmtCurrency(n, currency);

  const activeTheme = PDF_THEMES[quote.pdfTheme || "royal"];
  const buildQuoteConfig = () => {
    const items = [];
    if (rooms.qty) items.push({ name: `Rooms (${rooms.qty} rooms × ${rooms.nights} night${rooms.nights == 1 ? "" : "s"})`, qty: "" });
    if (banquet.rate) items.push({ name: `Banquet${banquet.mode === "perPax" ? ` (${banquet.pax} pax)` : ""}`, qty: "" });
    extraLines.filter(l => l.label).forEach(l => items.push({ name: l.label, qty: l.qty }));

    return {
      title: "The Executive Events",
      client: quote.clientName || "—",
      date: `${quote.date}${hotel ? "  ·  Venue: " + hotel.name + (city ? " · " + city.name : "") : ""}`,
      sections: [{ title: "Corporate Event Quotation", color: activeTheme.primary, subsections: [{ title: "", items }] }],
      totalRows: [],
      grandTotalLabel: "Total Budget",
      grandTotal: curPdf(finalBudget, currency),
      themePrimary: activeTheme.primary,
      themeAccent: activeTheme.accent
    };
  };

  const getOrCreateShareLink = async () => {
    setSharing(true);
    const id = quote.shareId || uid();
    const config = buildQuoteConfig();
    try {
      await db.collection("publicQuotes").doc(id).set({ ...config, updatedAt: Date.now() });
      if (!quote.shareId) update({ shareId: id });
      setSharing(false);
      return `${window.location.origin}${window.location.pathname}?share=${id}`;
    } catch (e) {
      setSharing(false);
      alert("Could not create share link: " + e.message);
      return null;
    }
  };

  const exportQuotation = () => {
    const config = buildQuoteConfig();
    window.generatePdf({ ...config, filename: (quote.clientName || quote.name || "quotation").replace(/[^a-z0-9]/gi, "_") });
  };

  return (
    <div>
      <button className="beo-btn beo-btn-ghost" onClick={onBack} style={{ marginBottom: 16 }}>← Back to corporate quotes</button>
      <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <input className="beo-input" style={{ fontSize: 18, fontWeight: 600, flex: "1 1 220px" }} value={quote.name} onChange={e => update({ name: e.target.value })} />
        <input className="beo-input" placeholder="Client name" value={quote.clientName} onChange={e => update({ clientName: e.target.value })} style={{ width: 180 }} />
        <input className="beo-input" placeholder="Client phone" value={quote.clientPhone || ""} onChange={e => update({ clientPhone: e.target.value })} style={{ width: 160 }} />
        <input className="beo-input" type="date" value={quote.date} onChange={e => update({ date: e.target.value })} style={{ width: 160 }} />
        <select className="beo-input" style={{ width: 90 }} value={currency} onChange={e => update({ currency: e.target.value })}>
          {CURRENCY_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
        <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
          <span style={{ fontSize: 11, color: "#8a8071" }}>Theme:</span>
          {Object.keys(PDF_THEMES).map(key => (
            <span key={key} title={PDF_THEMES[key].label} onClick={() => update({ pdfTheme: key })} style={{ width: 22, height: 22, borderRadius: "50%", background: PDF_THEMES[key].swatch, cursor: "pointer", display: "inline-block", border: (quote.pdfTheme || "royal") === key ? "3px solid #B8934A" : "2px solid #fff", boxShadow: "0 0 0 1px #E4DCC8" }} />
          ))}
        </div>
      </div>
      <div style={{ display: "flex", gap: 12, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
        <button className="beo-btn beo-btn-gold" onClick={exportQuotation}>📄 Export Quotation</button>
        <button
          className="beo-btn"
          disabled={sharing}
          style={{ background: "#25D366", color: "#fff", padding: "9px 16px", fontSize: 14, fontWeight: 600, opacity: sharing ? 0.6 : 1 }}
          title="Generates a shareable link and opens WhatsApp with it pre-filled"
          onClick={async () => {
            const url = await getOrCreateShareLink();
            if (!url) return;
            const msg = `Hi ${quote.clientName || ""}, please find your corporate event quotation here: ${url}\n\nTotal: ${(commissionPct >= 100 && mode === "final") ? "" : cur(finalBudget)}. Let us know if you have any questions!\n\n— The Executive Events`;
            window.open(waLinkWithText(quote.clientPhone, msg), "_blank");
          }}
        >{sharing ? "Generating link…" : "💬 Send via WhatsApp"}</button>
        {quote.shareId && (
          <button className="beo-btn beo-btn-ghost" onClick={async () => { const url = await getOrCreateShareLink(); if (url) { navigator.clipboard.writeText(url); alert("Link copied to clipboard:\n" + url); } }}>🔗 Copy Link</button>
        )}
      </div>
      <div style={{ fontSize: 11, color: "#a39a89", marginTop: -12, marginBottom: 16 }}>"Send via WhatsApp" now sends a clickable link — no manual PDF attaching needed.</div>


      <div className="builder-col">
        <div>
          <div className="beo-card" style={{ padding: 16, marginBottom: 16 }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Venue</div>
            <div style={{ display: "flex", gap: 8, marginBottom: hotel ? 12 : 0, flexWrap: "wrap" }}>
              <select className="beo-input" style={{ flex: 1 }} value={quote.cityId || ""} onChange={e => selectCity(e.target.value)}>
                <option value="">Select city…</option>
                {cities.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <select className="beo-input" style={{ flex: 1 }} value={quote.hotelId || ""} onChange={e => selectHotel(e.target.value)} disabled={!city}>
                <option value="">Select hotel…</option>
                {city && city.hotels.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
              </select>
            </div>
            {hotel && (
              <div style={{ background: "#FAF6EE", borderRadius: 8, padding: 12, fontSize: 13 }}>
                <div style={{ fontWeight: 700, marginBottom: 4 }}>{hotel.name}</div>
                {hotel.description && <div style={{ color: "#8a8071", marginBottom: 6, fontSize: 12.5 }}>{hotel.description.slice(0, 160)}{hotel.description.length > 160 ? "…" : ""}</div>}
                {hotel.salesManager?.name && <div style={{ fontSize: 12 }}>📞 {hotel.salesManager.name} — {hotel.salesManager.phone}</div>}
              </div>
            )}
          </div>

          <div className="beo-card" style={{ padding: 16, marginBottom: 16 }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Rooms</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
              <div>
                <label style={{ fontSize: 11.5, color: "#8a8071" }}>Rooms</label>
                <input className="beo-input" type="number" value={nz(rooms.qty)} onChange={e => update({ rooms: { ...rooms, qty: Number(e.target.value) || 0 } })} />
              </div>
              <div>
                <label style={{ fontSize: 11.5, color: "#8a8071" }}>Rate / night (₹)</label>
                <input className="beo-input" type="number" value={nz(rooms.rate)} onChange={e => update({ rooms: { ...rooms, rate: Number(e.target.value) || 0 } })} />
              </div>
              <div>
                <label style={{ fontSize: 11.5, color: "#8a8071" }}>Nights</label>
                <input className="beo-input" type="number" value={nz(rooms.nights)} onChange={e => update({ rooms: { ...rooms, nights: Number(e.target.value) || 0 } })} />
              </div>
            </div>
            <div style={{ textAlign: "right", fontSize: 13, marginTop: 8, color: "#6B1E23", fontWeight: 600 }}>Rooms total: {cur(roomsTotal)}</div>
          </div>

          <div className="beo-card" style={{ padding: 16, marginBottom: 16 }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Banquet</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              <button className="beo-btn" onClick={() => update({ banquet: { ...banquet, mode: "flat" } })} style={{ flex: 1, padding: "8px 6px", fontSize: 12.5, borderRadius: 6, background: banquet.mode === "flat" ? "#6B1E23" : "#F1EADA", color: banquet.mode === "flat" ? "#FAF6EE" : "#6B1E23" }}>Flat cost</button>
              <button className="beo-btn" onClick={() => update({ banquet: { ...banquet, mode: "perPax" } })} style={{ flex: 1, padding: "8px 6px", fontSize: 12.5, borderRadius: 6, background: banquet.mode === "perPax" ? "#6B1E23" : "#F1EADA", color: banquet.mode === "perPax" ? "#FAF6EE" : "#6B1E23" }}>Per pax</button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: banquet.mode === "perPax" ? "1fr 1fr" : "1fr", gap: 8 }}>
              {banquet.mode === "perPax" && (
                <div>
                  <label style={{ fontSize: 11.5, color: "#8a8071" }}>Pax</label>
                  <input className="beo-input" type="number" value={nz(banquet.pax)} onChange={e => update({ banquet: { ...banquet, pax: Number(e.target.value) || 0 } })} />
                </div>
              )}
              <div>
                <label style={{ fontSize: 11.5, color: "#8a8071" }}>{banquet.mode === "perPax" ? "Rate per pax (₹)" : "Flat banquet cost (₹)"}</label>
                <input className="beo-input" type="number" value={nz(banquet.rate)} onChange={e => update({ banquet: { ...banquet, rate: Number(e.target.value) || 0 } })} />
              </div>
            </div>
            <div style={{ textAlign: "right", fontSize: 13, marginTop: 8, color: "#6B1E23", fontWeight: 600 }}>Banquet total: {cur(banquetTotal)}</div>
          </div>

          <div className="beo-card" style={{ padding: 16 }}>
            <div style={{ fontWeight: 700, marginBottom: 10 }}>Other items (F&B, transport, decor, misc.)</div>
            {extraLines.length === 0 && <div style={{ color: "#a39a89", fontSize: 13, marginBottom: 8 }}>No extra items yet.</div>}
            {extraLines.map(l => (
              <div key={l.id} style={{ display: "grid", gridTemplateColumns: "1fr 60px 100px 90px 24px", gap: 6, alignItems: "center", padding: "6px 4px", borderTop: "1px solid #F1EADA", fontSize: 13 }}>
                <input className="beo-input" placeholder="Label" value={l.label} onChange={e => updateExtraLine(l.id, { label: e.target.value })} style={{ padding: "5px 6px" }} />
                <input className="beo-input" type="number" placeholder="Qty" value={nz(l.qty)} onChange={e => updateExtraLine(l.id, { qty: Number(e.target.value) || 0 })} style={{ padding: "5px 6px" }} />
                <input className="beo-input" type="number" placeholder="Rate ₹" value={nz(l.rate)} onChange={e => updateExtraLine(l.id, { rate: Number(e.target.value) || 0 })} style={{ padding: "5px 6px" }} />
                <div>{cur((Number(l.qty) || 0) * (Number(l.rate) || 0))}</div>
                <span style={{ color: "#c98b8e", cursor: "pointer", textAlign: "center" }} onClick={() => removeExtraLine(l.id)}>×</span>
              </div>
            ))}
            <button className="beo-btn beo-btn-ghost" onClick={addExtraLine} style={{ marginTop: 10 }}>＋ Add item</button>
          </div>
        </div>

        <div className="beo-card" style={{ padding: 20, alignSelf: "start" }}>
          <div className="beo-serif" style={{ fontSize: 20, fontWeight: 700, color: "#6B1E23", marginBottom: 4 }}>Final Budget Calculator</div>
          <div style={{ fontSize: 12, color: "#8a8071", marginBottom: 16 }}>Commission on the final client budget by default.</div>
          <Row label="Rooms" value={cur(roomsTotal)} />
          <Row label="Banquet" value={cur(banquetTotal)} />
          <Row label="Other items" value={cur(extraTotal)} />
          <div style={{ borderTop: "1px dashed #E4DCC8", margin: "10px 0" }} />
          <Row label="Base cost (total)" value={cur(baseCost)} />
          <div style={{ margin: "14px 0" }}>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}>Your desired profit (₹)</label>
            <input className="beo-input" type="number" value={nz(quote.profit)} onChange={e => update({ profit: Number(e.target.value) || 0 })} style={{ marginTop: 6 }} />
          </div>
          <div style={{ margin: "14px 0" }}>
            <label style={{ fontSize: 12.5, fontWeight: 600 }}>Hotel commission (%)</label>
            <input className="beo-input" type="number" value={nz(quote.commissionPercent)} onChange={e => update({ commissionPercent: Number(e.target.value) || 0 })} style={{ marginTop: 6 }} />
          </div>
          <div style={{ margin: "14px 0" }}>
            <label style={{ fontSize: 12.5, fontWeight: 600, display: "block", marginBottom: 6 }}>Commission is calculated on</label>
            <div style={{ display: "flex", gap: 6 }}>
              <button className="beo-btn" onClick={() => update({ commissionMode: "final" })} style={{ flex: 1, padding: "8px 6px", fontSize: 12.5, borderRadius: 6, background: mode === "final" ? "#6B1E23" : "#F1EADA", color: mode === "final" ? "#FAF6EE" : "#6B1E23" }}>Final client budget</button>
              <button className="beo-btn" onClick={() => update({ commissionMode: "base" })} style={{ flex: 1, padding: "8px 6px", fontSize: 12.5, borderRadius: 6, background: mode === "base" ? "#6B1E23" : "#F1EADA", color: mode === "base" ? "#FAF6EE" : "#6B1E23" }}>Your base cost</button>
            </div>
          </div>
          <div style={{ borderTop: "1px dashed #E4DCC8", margin: "16px 0", paddingTop: 14 }}>
            <Row label="Base cost" value={cur(baseCost)} />
            <Row label="Your profit" value={cur(profit)} />
            <Row label={`Hotel commission (${commissionPct}%)`} value={(commissionPct >= 100 && mode === "final") ? "—" : cur(commissionAmount)} />
          </div>
          <div style={{ background: "#6B1E23", borderRadius: 8, padding: "14px 16px" }}>
            <div style={{ fontSize: 12, color: "#E9D9B8" }}>Quote to client</div>
            <div className="beo-serif" style={{ fontSize: 28, fontWeight: 700, color: "#FAF6EE" }}>
              {(commissionPct >= 100 && mode === "final") ? "Set commission < 100%" : cur(finalBudget)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Row({ label, value }) {
  return <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, padding: "4px 0" }}><span style={{ color: "#8a8071" }}>{label}</span><span style={{ fontWeight: 600 }}>{value}</span></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
